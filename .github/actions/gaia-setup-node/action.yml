name: 'GAIA Setup Node'
description: |
  Install pnpm, set up Node from .node-version with the pnpm store cached, and
  optionally run the frozen-lockfile install for one or both workspaces.

  Deliberately excludes `actions/checkout`: `fetch-depth` differs across
  callers, and a local action is resolved from the already-checked-out
  workspace, so folding checkout in would be both behavior-changing and
  self-defeating.

  Deliberately excludes `code-review-audit.yml`: it exists as three
  byte-identical copies (live workflow, source template, build artifact), and
  a suite pins that workflow's exact ordered guarded-step set and each step's
  `if:` expression, so replacing three steps with one here would rewrite a
  suite that exists to detect exactly that kind of rewrite. That is not
  because `.github/actions/**` fails to reach adopters; other composite
  actions in this same directory already do.

  Deliberately excludes two callers, both of which want the pinned Node
  runtime and nothing else. One gates two steps behind a narrow multi-clause
  `if:` with no install step; the other runs a single script against a
  committed binary. Adding a `cache` toggle to serve them would widen this
  contract for no shared benefit.

  The rule that puts a caller in that set: `cache: 'pnpm'` below is
  unconditional, and setup-node's post step saves that cache without checking
  the store exists on disk. A job that never runs pnpm never creates the
  store, and no pnpm restore keys are passed, so the first cache miss --
  guaranteed by any change to the lockfile that keys it -- resolves zero paths
  and fails the job on a caching error unrelated to its actual work. So a
  caller passing `install: none` that also runs no pnpm of its own belongs on
  `actions/setup-node` directly, at the same pin, rather than here.

  Deliberately excludes one caller whose provisioning sits ahead of a quality
  gate that runs under a handled-failure flag: this composite performs a
  workspace install, and folding that caller's install in here would convert
  a handled gate failure into a hard job failure.

  Every step here shares one `if:` with its caller: a composite action cannot
  gate its own steps individually from the outside, but the caller's `uses:`
  step can carry that `if:`, and the whole composite skips as a unit.
inputs:
  install:
    description: >-
      Which workspace(s) to install. One of: none, root, cli, both.
    required: false
    default: 'root'
  cache-dependency-path:
    description: >-
      Passed through to actions/setup-node. Lockfile path(s) whose hash keys the
      pnpm store cache; newline-separated for more than one. Empty means the
      action's own default.
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    # This step reaches the npm registry twice on every call on every leg:
    # `npm ci` pulls the action's own committed bootstrap pnpm, then
    # `pnpm self-update` pulls the version the root `package.json`
    # `packageManager` field pins. A fast failure in either -- a registry 5xx,
    # a connection reset, an `npm ci` error -- used to fail the whole composite
    # with nothing retrying it, so the second attempt below covers that.
    #
    # A second attempt is safe because the action's `runSelfInstaller` opens
    # with an unconditional recursive-and-forced remove of its destination
    # directory before it installs anything, so a half-written install from the
    # first attempt is wiped rather than reused. That property is the whole
    # reason this repair is a handful of lines instead of a provisioning
    # rewrite; a release that dropped it, adding a short-circuit on an existing install,
    # would make a retry over a partial tree unsafe, so re-read it when the pin
    # moves.
    #
    # It does NOT cover a stall. The caller's step-level `timeout-minutes`
    # kills the outer `uses:` step, which is this whole composite, so no inner
    # step survives to retry. Bounding an attempt below the caller's cap needs
    # `timeout -k` around a `run:` install, which is a provisioning rewrite
    # reaching every call site; gaia-react/gaia#1783 tracks that half on its
    # own terms.
    #
    # Running the action twice also registers its `post:` step twice. Harmless
    # as this composite stands, but on two gates rather than one: that step
    # runs a store prune gated on the action's `run_install` input and a cache
    # save gated on its `cache` input. This composite passes the action no
    # `with:` at all, so both sit at their defaults and both arms no-op. A
    # `with:` added here has to be checked against the gate that governs the
    # input being added, not against `cache` alone.
    - id: install-pnpm
      continue-on-error: true
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
    # Long enough for a transient registry fault to clear, short enough to stay
    # well inside the three-minute cap the leanest call site declares, which
    # has to hold the pause and both attempts.
    - name: Pause before retrying the pnpm install
      if: steps.install-pnpm.outcome == 'failure'
      shell: bash
      run: sleep 15
    # Deliberately no `continue-on-error` here: the retry is the last word, so
    # its failure fails the composite exactly as the single attempt used to.
    - name: Retry the pnpm install
      if: steps.install-pnpm.outcome == 'failure'
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: '.node-version'
        cache: 'pnpm'
        cache-dependency-path: ${{ inputs.cache-dependency-path }}
    - name: Install root dependencies
      if: inputs.install == 'root' || inputs.install == 'both'
      shell: bash
      run: pnpm install --frozen-lockfile
    - name: Install CLI dependencies
      if: inputs.install == 'cli' || inputs.install == 'both'
      shell: bash
      run: pnpm -C .gaia/cli install --frozen-lockfile
