name: 'GAIA CI, Merge and Watch'
description: |
  Enables auto-merge on a GAIA CI PR, watches post-merge CI, and runs the
  one-shot auto-revert + escalation pipeline on failure.
inputs:
  pr-number:
    description: 'PR number to merge.'
    required: true
  label:
    description: 'PR label predicate. v1 uses gaia-ci.'
    required: true
  merge-method:
    description: 'squash | merge | rebase'
    required: false
    default: 'squash'
  gh-token:
    description: 'Token with pull-requests:write + contents:write + issues:write.'
    required: true
outputs:
  merge-conclusion:
    description: 'merged | closed_without_merge | revert_opened | revert_failed'
    value: ${{ steps.summarize.outputs.conclusion }}
  revert-pr:
    description: 'Revert PR number on revert paths; empty otherwise.'
    value: ${{ steps.summarize.outputs.revert_pr }}
  revert-branch:
    description: 'Revert branch name on revert paths; empty otherwise.'
    value: ${{ steps.summarize.outputs.revert_branch }}
  severity-important-issue:
    description: 'Issue number opened on revert dispatch; empty otherwise.'
    value: ${{ steps.summarize.outputs.severity_important_issue }}
  severity-critical-issue:
    description: 'Issue number opened on revert failure; empty otherwise.'
    value: ${{ steps.summarize.outputs.severity_critical_issue }}
runs:
  using: 'composite'
  steps:
    - id: enable-auto-merge
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh-token }}
        PR_NUMBER: ${{ inputs.pr-number }}
        MERGE_METHOD: ${{ inputs.merge-method }}
      run: |
        set -euo pipefail
        # `rc=0` then `|| rc=$?`, never a bare assignment followed by `rc=$?`: an
        # assignment takes its command substitution's status, so under `set -e`
        # (the runner's own `shell: bash` default) a failing command kills the
        # step on the assignment line and the `rc=$?` never runs, making every
        # branch below dead code.
        rc=0
        merge_output="$(gh pr merge "$PR_NUMBER" "--$MERGE_METHOD" --auto 2>&1)" || rc=$?
        if [[ $rc -ne 0 ]]; then
          if [[ "$merge_output" == *"is already used by worktree"* ]]; then
            echo "::notice title=GAIA CI::PR #$PR_NUMBER auto-merge already enabled (gh reported the local branch is checked out in a worktree, which does not affect the merge state on GitHub)"
          else
            echo "::error title=GAIA CI::failed to enable auto-merge for PR #$PR_NUMBER: $merge_output"
            exit 1
          fi
        else
          echo "::notice title=GAIA CI::auto-merge enabled for PR #$PR_NUMBER"
        fi

    - id: wait-for-merge
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh-token }}
        PR_NUMBER: ${{ inputs.pr-number }}
      run: |
        set -euo pipefail
        result_json="$("${GITHUB_ACTION_PATH}"/lib/wait-for-merge.sh "$PR_NUMBER")"
        echo "result=$result_json" >> "$GITHUB_OUTPUT"
        echo "merge_state=$(jq -r '.state' <<<"$result_json")" >> "$GITHUB_OUTPUT"
        echo "merge_sha=$(jq -r '.sha // ""' <<<"$result_json")" >> "$GITHUB_OUTPUT"
        echo "merge_title=$(jq -r '.title // ""' <<<"$result_json")" >> "$GITHUB_OUTPUT"

    - id: branch-on-merge-state
      shell: bash
      env:
        MERGE_STATE: ${{ steps.wait-for-merge.outputs.merge_state }}
      run: |
        set -euo pipefail
        if [[ "$MERGE_STATE" == "MERGED" ]]; then
          echo "proceed_to_check=true" >> "$GITHUB_OUTPUT"
        else
          echo "proceed_to_check=false" >> "$GITHUB_OUTPUT"
        fi

    - id: wait-for-ci
      if: steps.branch-on-merge-state.outputs.proceed_to_check == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh-token }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        MERGE_SHA: ${{ steps.wait-for-merge.outputs.merge_sha }}
      run: |
        set -euo pipefail
        # `rc=0` then `|| rc=$?`; see the enable-auto-merge step for why a bare
        # assignment followed by `rc=$?` is unreachable under `set -e`. Here the
        # helper exits non-zero on both of the poller's non-terminal conclusions
        # while still printing the JSON that says which one, so a bare
        # assignment takes that status and kills the step on the assignment line
        # with the diagnosis unread inside the variable. The step still fails at
        # the end, it just says why first.
        #
        # read-ci-result.sh, not wait-for-ci.sh directly: the helper guarantees
        # what it PRINTS is parseable, which is what lets the jq filters below
        # run unbracketed. Its header owns why that guard needs a process of its
        # own.
        rc=0
        result_json="$("${GITHUB_ACTION_PATH}"/lib/read-ci-result.sh "$MERGE_SHA")" || rc=$?
        # That guarantee lasts exactly as long as the helper runs, so one case
        # sits outside it: the helper never got to print at all, because the file
        # is missing, its exec bit was lost, or its interpreter is absent. The
        # substitution then yields the empty string, `jq -r` reads nothing from
        # it and exits 0, and the annotation below would name an empty
        # conclusion and no cause. The bracket is emptiness rather than
        # parseability on purpose: this covers not-running, which is a different
        # cause than the helper's own fallback reports, and the messages say so.
        # It does not cover a helper killed mid-write, which leaves a partial
        # line the jq below still dies on; that is the narrower gap, and
        # deduplicating the substantive guard is what it is traded for.
        [[ -n "$result_json" ]] || result_json="$(jq -c -n --arg rc "$rc" '{conclusion: "unknown", run_url: "", error: ("read-ci-result.sh exited " + $rc + " without running")}')"
        conclusion="$(jq -r '.conclusion' <<<"$result_json")"
        echo "result=$result_json" >> "$GITHUB_OUTPUT"
        echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
        echo "run_url=$(jq -r '.run_url // ""' <<<"$result_json")" >> "$GITHUB_OUTPUT"
        if [[ $rc -ne 0 ]]; then
          echo "::error title=GAIA CI::post-merge CI watch on $MERGE_SHA ended as '$conclusion': $(jq -r '.error // "no further detail was reported"' <<<"$result_json")"
          exit "$rc"
        fi

    - id: branch-on-ci
      shell: bash
      env:
        CI_CONCLUSION: ${{ steps.wait-for-ci.outputs.conclusion }}
      run: |
        set -euo pipefail
        if [[ "$CI_CONCLUSION" == "failure" ]]; then
          echo "proceed_to_revert=true" >> "$GITHUB_OUTPUT"
          echo "done_clean=false" >> "$GITHUB_OUTPUT"
        elif [[ "$CI_CONCLUSION" == "success" ]]; then
          echo "proceed_to_revert=false" >> "$GITHUB_OUTPUT"
          echo "done_clean=true" >> "$GITHUB_OUTPUT"
        else
          echo "proceed_to_revert=false" >> "$GITHUB_OUTPUT"
          echo "done_clean=false" >> "$GITHUB_OUTPUT"
        fi

    - id: open-revert
      if: steps.branch-on-ci.outputs.proceed_to_revert == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh-token }}
        PR_NUMBER: ${{ inputs.pr-number }}
        LABEL: ${{ inputs.label }}
        MERGE_SHA: ${{ steps.wait-for-merge.outputs.merge_sha }}
      run: |
        set -euo pipefail
        # `rc=0` then `|| rc=$?`; see the enable-auto-merge step for why a bare
        # assignment followed by `rc=$?` is unreachable under `set -e`. Here the
        # dead branch is the `revert_already_opened` reuse path, and the step's
        # death also skips the three steps gated on its `success` outcome, which
        # is what silently swallows the severity:important/critical escalation.
        rc=0
        revert_json="$(gaia ci-revert open --pr "$PR_NUMBER" --label "$LABEL" --reason "post-merge CI failure on $MERGE_SHA" --json)" || rc=$?
        if [[ $rc -ne 0 ]]; then
          err_code="$(jq -r '.error // ""' <<<"$revert_json")"
          if [[ "$err_code" == "revert_already_opened" ]]; then
            existing="$(jq -r '.existing_revert_pr // ""' <<<"$revert_json")"
            echo "::warning title=GAIA CI::revert already opened for PR #$PR_NUMBER (revert PR #$existing); reusing existing"
            echo "revert_pr=$existing" >> "$GITHUB_OUTPUT"
            echo "revert_branch=" >> "$GITHUB_OUTPUT"
          else
            echo "::error title=GAIA CI::ci-revert open failed: $revert_json"
            exit 1
          fi
        else
          echo "revert_pr=$(jq -r '.revert_pr' <<<"$revert_json")" >> "$GITHUB_OUTPUT"
          echo "revert_branch=$(jq -r '.revert_branch' <<<"$revert_json")" >> "$GITHUB_OUTPUT"
        fi

    - id: open-severity-important-issue
      if: steps.open-revert.outcome == 'success' && steps.open-revert.conclusion == 'success'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh-token }}
        ORIGINAL_PR: ${{ inputs.pr-number }}
        ORIGINAL_TITLE: ${{ steps.wait-for-merge.outputs.merge_title }}
        REVERT_PR: ${{ steps.open-revert.outputs.revert_pr }}
        MERGE_SHA: ${{ steps.wait-for-merge.outputs.merge_sha }}
        FAILED_RUN_URL: ${{ steps.wait-for-ci.outputs.run_url }}
        WORKFLOW_NAME: ${{ github.workflow }}
        REVERT_FAILED_RUN_URL: ''
      run: |
        set -euo pipefail
        body="$("${GITHUB_ACTION_PATH}"/lib/render-issue.sh "${GITHUB_WORKSPACE}/.gaia/templates/ci-issues/severity-important-revert-opened.md")"
        issue_url="$(printf '%s\n' "$body" | gh issue create \
          --title "GAIA CI: PR #${ORIGINAL_PR} reverted via PR #${REVERT_PR}" \
          --label "severity:important" \
          --label "gaia-ci" \
          --body-file -)"
        issue_number="${issue_url##*/}"
        echo "severity_important_issue=$issue_number" >> "$GITHUB_OUTPUT"
        echo "::notice title=GAIA CI::PR #${ORIGINAL_PR} reverted via PR #${REVERT_PR}; see issue #${issue_number} (severity:important)"

    - id: wait-for-revert-merge
      if: steps.open-revert.outcome == 'success' && steps.open-revert.conclusion == 'success'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh-token }}
        REVERT_PR: ${{ steps.open-revert.outputs.revert_pr }}
      run: |
        set -euo pipefail
        result_json="$("${GITHUB_ACTION_PATH}"/lib/wait-for-merge.sh "$REVERT_PR")"
        echo "revert_merge_state=$(jq -r '.state' <<<"$result_json")" >> "$GITHUB_OUTPUT"
        echo "revert_merge_sha=$(jq -r '.sha // ""' <<<"$result_json")" >> "$GITHUB_OUTPUT"

    - id: wait-for-revert-ci
      if: steps.wait-for-revert-merge.outputs.revert_merge_state == 'MERGED'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh-token }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        REVERT_MERGE_SHA: ${{ steps.wait-for-revert-merge.outputs.revert_merge_sha }}
      run: |
        set -euo pipefail
        # Same helper, same non-zero-exit handling, and same not-running bracket
        # as the wait-for-ci step above, for the same reasons: this is the same
        # watch, so its non-terminal conclusions and both of its failure cases
        # arrive here the same way. What is this step's own is its input SHA,
        # its local variable name, its outputs, which differ from that step's in
        # their keys and in this step publishing no raw `result=`, and its error
        # annotation, which names the revert watch rather than the post-merge
        # one. The two steps' output value expressions are identical, so the
        # wording difference is in the annotation alone.
        rc=0
        result_json="$("${GITHUB_ACTION_PATH}"/lib/read-ci-result.sh "$REVERT_MERGE_SHA")" || rc=$?
        [[ -n "$result_json" ]] || result_json="$(jq -c -n --arg rc "$rc" '{conclusion: "unknown", run_url: "", error: ("read-ci-result.sh exited " + $rc + " without running")}')"
        revert_conclusion="$(jq -r '.conclusion' <<<"$result_json")"
        echo "revert_conclusion=$revert_conclusion" >> "$GITHUB_OUTPUT"
        echo "revert_run_url=$(jq -r '.run_url // ""' <<<"$result_json")" >> "$GITHUB_OUTPUT"
        if [[ $rc -ne 0 ]]; then
          echo "::error title=GAIA CI::revert CI watch on $REVERT_MERGE_SHA ended as '$revert_conclusion': $(jq -r '.error // "no further detail was reported"' <<<"$result_json")"
          exit "$rc"
        fi

    - id: branch-on-revert-conclusion
      if: steps.open-revert.outcome == 'success' && steps.open-revert.conclusion == 'success'
      shell: bash
      env:
        REVERT_CONCLUSION: ${{ steps.wait-for-revert-ci.outputs.revert_conclusion }}
        REVERT_MERGE_STATE: ${{ steps.wait-for-revert-merge.outputs.revert_merge_state }}
      run: |
        set -euo pipefail
        if [[ "$REVERT_CONCLUSION" == "failure" ]] || [[ "$REVERT_MERGE_STATE" == "CLOSED" ]]; then
          echo "revert_failed=true" >> "$GITHUB_OUTPUT"
          echo "revert_clean=false" >> "$GITHUB_OUTPUT"
        else
          echo "revert_failed=false" >> "$GITHUB_OUTPUT"
          echo "revert_clean=true" >> "$GITHUB_OUTPUT"
        fi

    - id: mark-revert-failed-and-escalate
      if: steps.branch-on-revert-conclusion.outputs.revert_failed == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh-token }}
        PR_NUMBER: ${{ inputs.pr-number }}
        ORIGINAL_PR: ${{ inputs.pr-number }}
        ORIGINAL_TITLE: ${{ steps.wait-for-merge.outputs.merge_title }}
        REVERT_PR: ${{ steps.open-revert.outputs.revert_pr }}
        MERGE_SHA: ${{ steps.wait-for-merge.outputs.merge_sha }}
        FAILED_RUN_URL: ${{ steps.wait-for-ci.outputs.run_url }}
        REVERT_FAILED_RUN_URL: ${{ steps.wait-for-revert-ci.outputs.revert_run_url }}
        WORKFLOW_NAME: ${{ github.workflow }}
      run: |
        set -euo pipefail
        gaia ci-revert mark-failed --pr "$PR_NUMBER" --json >/dev/null
        body="$("${GITHUB_ACTION_PATH}"/lib/render-issue.sh "${GITHUB_WORKSPACE}/.gaia/templates/ci-issues/severity-critical-revert-failed.md")"
        issue_url="$(printf '%s\n' "$body" | gh issue create \
          --title "GAIA CI: revert of PR #${ORIGINAL_PR} also failed; bot stopped" \
          --label "severity:critical" \
          --label "gaia-ci" \
          --body-file -)"
        issue_number="${issue_url##*/}"
        echo "severity_critical_issue=$issue_number" >> "$GITHUB_OUTPUT"
        echo "::error title=GAIA CI::revert PR #${REVERT_PR} failed CI; bot stopped; see issue #${issue_number} (severity:critical)"

    - id: summarize
      shell: bash
      env:
        DONE_CLEAN: ${{ steps.branch-on-ci.outputs.done_clean }}
        MERGE_STATE: ${{ steps.wait-for-merge.outputs.merge_state }}
        REVERT_FAILED: ${{ steps.branch-on-revert-conclusion.outputs.revert_failed }}
        REVERT_CLEAN: ${{ steps.branch-on-revert-conclusion.outputs.revert_clean }}
        REVERT_PR: ${{ steps.open-revert.outputs.revert_pr }}
        REVERT_BRANCH: ${{ steps.open-revert.outputs.revert_branch }}
        SEVERITY_IMPORTANT_ISSUE: ${{ steps.open-severity-important-issue.outputs.severity_important_issue }}
        SEVERITY_CRITICAL_ISSUE: ${{ steps.mark-revert-failed-and-escalate.outputs.severity_critical_issue }}
        ORIGINAL_PR: ${{ inputs.pr-number }}
      run: |
        set -euo pipefail
        if [[ "$REVERT_FAILED" == "true" ]]; then
          conclusion="revert_failed"
        elif [[ -n "$REVERT_PR" ]]; then
          conclusion="revert_opened"
        elif [[ "$MERGE_STATE" == "CLOSED" ]]; then
          conclusion="closed_without_merge"
        elif [[ "$DONE_CLEAN" == "true" ]]; then
          conclusion="merged"
        else
          conclusion="unknown"
        fi
        echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
        echo "revert_pr=${REVERT_PR}" >> "$GITHUB_OUTPUT"
        echo "revert_branch=${REVERT_BRANCH}" >> "$GITHUB_OUTPUT"
        echo "severity_important_issue=${SEVERITY_IMPORTANT_ISSUE}" >> "$GITHUB_OUTPUT"
        echo "severity_critical_issue=${SEVERITY_CRITICAL_ISSUE}" >> "$GITHUB_OUTPUT"
        if [[ "$conclusion" == "merged" ]]; then
          echo "::notice title=GAIA CI::PR #${ORIGINAL_PR} merged green"
        fi
