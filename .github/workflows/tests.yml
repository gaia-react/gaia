name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default-deny, so a job added later inherits no scope rather than the
# repository default. Each job below grants exactly what it needs.
permissions: {}

jobs:
  tests:
    name: Vitest and Playwright
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    # Bounded by the self-heal re-trigger poller in code-review-audit.yml, which
    # waits ~25 minutes for a dispatched run and then stamps nothing, leaving
    # this required context ABSENT on the self-heal HEAD instead of red. A job
    # that hits this cap is cancelled and its run still completes, so the poller
    # stamps a failure: an ordinary red check to re-run rather than a merge
    # wedged with no signal. The cap bounds execution only, so the ~10 minutes it
    # leaves under the window are what covers this run's queue wait. A test
    # derives that ceiling from the poller's own loop and charges the margin once
    # per job along a `needs:` chain, so this number is checked rather than
    # asserted here.
    #
    # 15 is what every unchained job in a re-dispatched workflow carries; a
    # chained pair is budgeted lower, against the tighter ceiling its hop count
    # earns. A full run here is about 4 minutes: typecheck and lint dominate it,
    # Vitest and Playwright together are under a minute, and the browser install
    # below fetches one engine rather than every engine Playwright ships.
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # `checks: read` lets resolve-check-base.sh query prior commits' check-runs
      # to find the last commit this check passed on (incremental scope).
      checks: read
    env:
      # Fallback placeholders let PRs from forks (which can't read repo secrets) still run the suite.
      # MSW intercepts outbound HTTP so the real API_URL is not needed; SESSION_SECRET just needs to be non-empty.
      API_URL: ${{ secrets.API_URL || 'http://localhost:3000/api' }}
      MSW_ENABLED: ${{ secrets.MSW_ENABLED || 'true' }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET || 'ci-placeholder-session-secret-not-real' }}
      SITE_URL: ${{ secrets.SITE_URL || 'http://localhost:3000' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # react-doctor resolves the highest-precedence config file and silently
      # ignores the rest, so a stray duplicate (e.g. doctor.config.json beside
      # doctor.config.ts) shadows the canonical config with no warning. Backstop
      # for the pre-commit guard of the same name (.husky/pre-commit). Runs
      # unconditionally so a duplicate fails even when the suite below is gated
      # off by the chore-deps / incremental-delta checks.
      - name: Assert a single react-doctor config
        run: |
          set -eu
          n=$(find . -maxdepth 1 -type f \( -name 'doctor.config.*' -o -name 'react-doctor.config.*' \) | wc -l | tr -d ' ')
          if [ "$n" -gt 1 ]; then
            echo "::error::Multiple react-doctor configs found; keep only doctor.config.ts"
            find . -maxdepth 1 -type f \( -name 'doctor.config.*' -o -name 'react-doctor.config.*' \)
            exit 1
          fi
          echo "OK: ${n} react-doctor config file(s)"
      # Pre-verified dep-bump PRs (the /update-deps wrapper runs the full
      # quality gate locally before pushing) skip the CI suite. Title-pattern
      # gate is restricted to `chore(deps):` and `chore(deps-dev):` so other
      # chore PRs still run normally. Skipped jobs do not satisfy required
      # checks under classic branch protection, so we gate steps instead.
      - name: Check chore-deps title
        id: chore-deps
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            skip="$(bash .gaia/scripts/chore-deps-skip.sh "$PR_TITLE")"
          else
            skip=false
          fi
          echo "skip=${skip}" >> "$GITHUB_OUTPUT"
      # Incremental scope: resolve the most recent ancestor of HEAD on which
      # "Vitest and Playwright" already passed, then gate the suite on whether
      # the delta SINCE that green run touches a test-relevant file. A code
      # commit that passes followed by a prose-only commit reviews an empty
      # relevant delta and skips. Falls back to origin/main (full scope) when
      # no green ancestor exists, first run, prior runs failed/cancelled, or
      # the API is unreachable (e.g. fork PRs without a token). Skipped jobs do
      # not satisfy required checks under branch protection, so we gate steps.
      - name: Resolve last-green base
        id: base
        if: steps.chore-deps.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          base="$(bash .github/audit/resolve-check-base.sh 'Vitest and Playwright' || echo origin/main)"
          echo "base=${base}" >> "$GITHUB_OUTPUT"
          echo "tests: incremental base = ${base}" >&2
      # Allowlist of paths that affect the test suite (ERE, matched against
      # `git diff --name-only`). Anything outside this list reports the
      # required check green without running, so a path that carries tests
      # must appear here: `.playwright/` holds the e2e specs and their
      # helpers, which `playwright.config.` alone does not cover.
      # This job also runs typecheck and lint, so a path those cover belongs
      # here too even when it carries no tests: `.storybook/` holds neither
      # tests nor stories, but it is inside the tsconfig `include` and is
      # linted, and Chromatic's Vite build strips types instead of checking
      # them, so it is not a substitute. The `*.config.*` alternation names
      # every root config for the same reason, not only the four whose tools
      # this job runs: each one is linted, the `.ts` ones are also in the
      # tsconfig program (the `.mjs` ones are not, since `include` lists no
      # `.mjs` glob and `allowJs` is off), and `react-router.config.` feeds the
      # typegen step that runs before `tsc`. `pnpm-workspace.yaml` and `.npmrc`
      # are here because pnpm 11 reads install behavior from them that the
      # lockfile's own `settings:` block does not carry, so a change to either
      # can break `--frozen-lockfile` for the next unrelated PR.
      # `.github/actions/` is here because the setup step below `uses:` a
      # composite action from it, which resolves the runtime and runs the
      # install every later step depends on. Without the alternation an
      # action-only pull request reports `code=false` and greens this required
      # check having run no tests. The sibling workflows express the same
      # coverage as a `.github/actions/**` entry in a declarative paths-filter,
      # where a check can compare the declared globs against what the gated
      # steps actually read. This gate is hand-rolled, so no such check can see
      # it: the alternation above is maintained by hand, and adding a step that
      # reads a new path means adding that path here in the same edit.
      - name: Detect test-relevant changes in the incremental delta
        id: filter
        if: steps.chore-deps.outputs.skip == 'false'
        env:
          CHECK_BASE: ${{ steps.base.outputs.base }}
        run: |
          set -eu
          # -z, so a non-ASCII path is not C-quoted into a string the ERE below
          # cannot match: without it a change under app/ can read as no relevant
          # change at all, and this step reports the required check green having
          # run no tests. `$(...)` discards NUL bytes, so the `tr` must stay
          # inside the substitution; the subshell sets pipefail so a git failure
          # still aborts the step under `set -e` as it did before the pipe.
          changed=$(set -o pipefail; git diff --name-only -z "${CHECK_BASE}...HEAD" | tr '\0' '\n')
          pattern='^(app|test)/|^\.playwright/|^\.storybook/|^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|\.npmrc|\.node-version)$|^tsconfig[^/]*\.json$|^(vite|vitest|playwright|eslint|react-router|doctor|knip|prettier|stylelint)\.config\.|^\.github/workflows/tests\.yml$|^\.github/actions/'
          if printf '%s\n' "$changed" | grep -qE "$pattern"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.chore-deps.outputs.skip == 'false' && steps.filter.outputs.code == 'true'
        name: Setup Node and install
        uses: ./.github/actions/gaia-setup-node
      # Reads the version inline rather than through a Marketplace action. The
      # Marketplace option here is a CONTAINER action, and GitHub builds a
      # container action's image during job setup, before any step-level `if:`
      # can gate it off. That cost is paid on entering the job rather than on
      # reaching the step, so it is not avoided even on a run where every step
      # below gets filtered out and nothing else runs at all.
      #
      # Same step id and same `current-version` output name, so the two
      # `npm_package_version:` consumers below (Vitest, Playwright) read
      # unchanged. `jq` is preinstalled on GitHub-hosted runners.
      #
      # Captured into a variable first, and `jq -e` so a null or absent
      # `.version` is an error rather than the string "null". Interpolating the
      # substitution straight into the `echo` would make `echo` the command
      # whose status the step reports, so a jq that could not read the file, or
      # a runner image without jq at all, would write an empty version and pass
      # green: the two suites below would then run under an empty
      # `npm_package_version` with nothing red to say so.
      - if: steps.chore-deps.outputs.skip == 'false' && steps.filter.outputs.code == 'true'
        name: get-npm-version
        id: package-version
        run: |
          set -euo pipefail
          version="$(jq -er .version package.json)"
          echo "current-version=${version}" >> "$GITHUB_OUTPUT"
      - if: steps.chore-deps.outputs.skip == 'false' && steps.filter.outputs.code == 'true'
        name: Typecheck
        run: pnpm typecheck
      - if: steps.chore-deps.outputs.skip == 'false' && steps.filter.outputs.code == 'true'
        name: Lint
        run: pnpm lint-dry
      - if: steps.chore-deps.outputs.skip == 'false' && steps.filter.outputs.code == 'true'
        name: Run Vitest tests
        run: pnpm test:ci
        env:
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          npm_package_version: ${{ steps.package-version.outputs.current-version}}
      # Only the engine this suite runs. `playwright install` resolves its browser
      # set from its arguments alone and reads nothing from playwright.config.ts,
      # so with none named it adds firefox and webkit on top of what this suite
      # needs, for a config whose CI project list is chromium alone (its
      # `otherBrowsers` are gated on `!CI`). Naming chromium still installs the
      # pair a headless run needs, the browser and chromium-headless-shell, plus
      # ffmpeg, so this is the whole requirement rather than a trimmed-down one:
      # firefox and webkit are the entire saving. Adding a CI project for another
      # engine means naming that engine here too, or the run fails on a missing
      # browser.
      #
      # Caching ~/.cache/ms-playwright is deliberately not done: Playwright's CI
      # guide advises against it because restoring the cache costs about what
      # downloading the binaries does, and the apt packages `--with-deps` installs
      # are not cacheable, so the step stays either way.
      - if: steps.chore-deps.outputs.skip == 'false' && steps.filter.outputs.code == 'true'
        name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.chore-deps.outputs.skip == 'false' && steps.filter.outputs.code == 'true'
        name: Run Playwright tests
        run: pnpm exec playwright test --pass-with-no-tests
        env:
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          npm_package_version: ${{ steps.package-version.outputs.current-version}}
      - if: ${{ failure() && steps.chore-deps.outputs.skip == 'false' && steps.filter.outputs.code == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        name: Upload Playwright failed test traces
        with:
          name: playwright-traces
          path: .playwright/output
          retention-days: 5
