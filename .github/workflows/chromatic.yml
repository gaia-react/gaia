name: Chromatic

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default-deny, so a job added later inherits no scope rather than the
# repository default. Each job below grants exactly what it needs.
permissions: {}

jobs:
  has-chromatic-token:
    name: Check for Chromatic token
    runs-on: ubuntu-latest
    # One echo into $GITHUB_OUTPUT, with no checkout and no network. The cap is
    # here because the self-heal poller waits on the RUN, and a run completes
    # only once every job does, so an uncapped job of any size can hold the
    # whole run past the poller's window and leave `Run Chromatic` absent on the
    # self-heal HEAD.
    #
    # `chromatic` declares `needs:` on this job, so the two run in sequence and
    # it is their SUM that has to fit the window, not either cap alone. A chain
    # also waits in the queue once per hop, and the cap covers execution only,
    # so this pair is budgeted 2 + 12 against a ceiling that charges the margin
    # per hop rather than once per run.
    timeout-minutes: 2
    # Reads a secret's presence and echoes a boolean. No API calls, no token.
    permissions: {}
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - id: check
        env:
          HAS_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN != '' }}
        run: echo "present=$HAS_TOKEN" >> "$GITHUB_OUTPUT"

  chromatic:
    name: Run Chromatic
    needs: has-chromatic-token
    if: needs.has-chromatic-token.outputs.present == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    # Same poller bound as tests.yml: a ~25-minute window, with the margin the
    # cap cannot cover (queue time, since the cap bounds execution only) charged
    # once per hop, so a job that runs to this cap still lets the run complete in
    # time to be stamped red rather than left absent. `exitOnceUploaded` keeps the
    # real work near 2 minutes, so this caps the failure mode that matters here,
    # an upload that hangs rather than returns. 12 rather than 15 because this job
    # runs after `has-chromatic-token` and the poller waits on the run: what has
    # to fit the ceiling is the whole 2 + 12 chain, across two queue waits.
    timeout-minutes: 12
    runs-on: ubuntu-latest
    # `contents: read` is the complete set, not an under-scoped starting point.
    # Checkout needs it to clone, and paths-filter and setup-node both default
    # their `token` input to `github.token` for the compare API and the
    # node-versions download. chromaui/action calls no GitHub API and takes no
    # token: Chromatic authenticates with `projectToken`, and its commit
    # statuses arrive through the Chromatic GitHub App installation. Nothing
    # here needs write, so do not widen this when Chromatic statuses misbehave.
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
      # Pre-verified dep-bump PRs (the /update-deps wrapper runs the full
      # quality gate locally before pushing) skip Chromatic. This workflow
      # triggers on `push`, so the gate inspects the HEAD commit subject
      # rather than the PR title. Pattern is restricted to `chore(deps):`
      # and `chore(deps-dev):` so other chore commits still run Chromatic.
      - name: Check chore-deps commit
        id: chore-deps
        run: |
          set -eu
          subject=$(git log -1 --format=%s HEAD)
          if printf '%s' "$subject" | grep -qE '^chore\(deps(-dev)?\):'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      # Allowlist of paths that can affect a Storybook build. Anything outside
      # this list reports the required check green without running Chromatic.
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        if: steps.chore-deps.outputs.skip == 'false'
        id: filter
        with:
          filters: |
            code:
              - 'app/**'
              - '.storybook/**'
              - 'public/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'tsconfig*.json'
              - 'vite.config.*'
              - '.github/workflows/chromatic.yml'
      - if: steps.chore-deps.outputs.skip == 'false' && steps.filter.outputs.code == 'true'
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
      - if: steps.chore-deps.outputs.skip == 'false' && steps.filter.outputs.code == 'true'
        name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
      - if: steps.chore-deps.outputs.skip == 'false' && steps.filter.outputs.code == 'true'
        name: Install dependencies
        run: pnpm install --frozen-lockfile
      # The preview must publish no environment values, and until now nothing on
      # the build path said so. `test/preview-env.test.ts` pins the Vitest worker;
      # the Storybook build is a separate Vite pipeline that suite never touches,
      # so a substitution re-added to `.storybook/main.ts`, `.storybook/vite.config.ts`,
      # a third config or a plugin would bake values into a public artifact with
      # nothing failing. Build with sentinel values in the environment and fail if
      # one survives into the output.
      #
      # What it asserts, exactly: no environment value reaches the published
      # artifact. It does not assert that no substitution map exists. `define`
      # replaces literal reference sites, so a re-added map whose keys nothing in
      # the story graph reads inlines nothing and this step stays green, which is
      # correct: a substitution that publishes nothing is not the failure. Both
      # cases are executed rather than reasoned about.
      #
      # The sentinels are the keys `clientSchema` in `app/env.server.ts` admits to
      # a browser, which is what a substitution map would name. `NODE_ENV` is
      # excluded, the build needs its real value. `SITE_URL` is not one of them
      # and is carried for a reason of its own: it is the only secret-backed value
      # still entering this build. A map reads these with `loadEnv(mode, cwd, '')`
      # and an empty prefix matches every key, so a sentinel set here reaches the
      # map wherever it lives.
      #
      # `pnpm exec` rather than the `build-storybook` script, deliberately:
      # `pnpm run` sets `npm_package_version` from `package.json` and overwrites
      # that sentinel, which would drop one of the four keys from the guard's
      # reach while still reporting green. Flag parity with the script is not
      # load-bearing; producing `storybook-static/` from the real config is.
      - if: steps.chore-deps.outputs.skip == 'false' && steps.filter.outputs.code == 'true'
        name: Assert the built preview inlines no environment values
        env:
          API_URL: gaia-preview-env-sentinel-api-url
          COMMIT_SHA: gaia-preview-env-sentinel-commit-sha
          MSW_ENABLED: gaia-preview-env-sentinel-msw-enabled
          npm_package_version: gaia-preview-env-sentinel-version
          SITE_URL: gaia-preview-env-sentinel-site-url
        run: |
          set -euo pipefail
          pnpm exec storybook build --test
          # `grep -r` exits 2 on a missing directory, and an `if` condition
          # absorbs that as "no match" rather than as an error, so a build that
          # produced no output would report this guard green having read nothing.
          if [ ! -d storybook-static ]; then
            echo "::error::The Storybook build produced no storybook-static/, so this guard inspected nothing."
            exit 1
          fi
          if grep -rl 'gaia-preview-env-sentinel-' storybook-static; then
            echo "::error::The Storybook build inlined environment values into the preview (files listed above). Remove the substitution and pass a story the values it needs as args."
            exit 1
          fi
          # Do not leave a sentinel-bearing artifact beside the publish step.
          # chromaui/action builds its own and clears this directory first, so
          # this is a belt on top of that brace rather than a load-bearing step.
          rm -rf storybook-static
      - if: steps.chore-deps.outputs.skip == 'false' && steps.filter.outputs.code == 'true'
        name: Run Chromatic
        uses: chromaui/action@8d925269a481085d451544f6bd9aa2ab3af55b5d # v16.9.1
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          exitZeroOnChanges: true
          exitOnceUploaded: true
          autoAcceptChanges: 'main'
          onlyChanged: true
          externals: 'app/styles/tailwind.css'
        env:
          SB: 1
          # Storybook never signs a cookie, so this only has to satisfy the
          # required z.string() in app/env.server.ts. Keep it a literal: the real
          # secret has no reason to enter a build that publishes a public artifact.
          SESSION_SECRET: 'storybook-placeholder-not-used-for-signing'
          SITE_URL: ${{ secrets.SITE_URL || 'http://localhost:3000' }}
