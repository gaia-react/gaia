name: Chromatic

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default-deny, so a job added later inherits no scope rather than the
# repository default. Each job below grants exactly what it needs.
permissions: {}

jobs:
  has-chromatic-token:
    name: Check for Chromatic token
    runs-on: ubuntu-latest
    # One echo into $GITHUB_OUTPUT, with no checkout and no network. The cap
    # bounds execution, so a hung job reports an ordinary red check instead of
    # hanging.
    timeout-minutes: 2
    # Reads a secret's presence and echoes a boolean. No API calls, no token.
    permissions: {}
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - id: check
        env:
          HAS_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN != '' }}
        run: echo "present=$HAS_TOKEN" >> "$GITHUB_OUTPUT"

  chromatic:
    name: Run Chromatic
    needs: has-chromatic-token
    if: needs.has-chromatic-token.outputs.present == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    # The cap bounds execution, so a hung upload reports an ordinary red check
    # instead of hanging. `exitOnceUploaded` keeps the real work near 2 minutes,
    # so this caps the failure mode that matters here, an upload that hangs
    # rather than returns.
    timeout-minutes: 12
    runs-on: ubuntu-latest
    # `contents: read` is the complete set, not an under-scoped starting point.
    # Checkout needs it to clone, and paths-filter and setup-node both default
    # their `token` input to `github.token` for the compare API and the
    # node-versions download. chromaui/action calls no GitHub API and takes no
    # token: Chromatic authenticates with `projectToken`, and its commit
    # statuses arrive through the Chromatic GitHub App installation. Nothing
    # here needs write, so do not widen this when Chromatic statuses misbehave.
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Pre-verified dep-bump PRs (the /update-deps wrapper runs the full
      # quality gate locally before pushing) skip Chromatic, but only when the
      # dep-bump subject is matched AND the changed-path set is confined to
      # dependency manifests. This workflow triggers on `push`, so the gate
      # inspects the HEAD commit subject rather than a PR title, and the
      # changed-path set is the pushed range on the default branch (what a
      # squash-merge lands), or the whole branch against the default branch
      # otherwise (what that branch's own PR would merge, so a manifest-only
      # follow-up commit cannot hide an earlier frontend/app/ change on the same
      # branch). Predicate lives in .gaia/scripts/chore-deps-skip.sh.
      - name: Check chore-deps commit
        id: chore-deps
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_NAME: ${{ github.ref_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -eu
          subject=$(git log -1 --format=%s HEAD)
          skip=false
          if [ "$REF_NAME" = "$DEFAULT_BRANCH" ]; then
            range="${BEFORE}...HEAD"
          else
            range="refs/remotes/origin/${DEFAULT_BRANCH}...HEAD"
          fi
          # An all-zero BEFORE (first push of a new default branch) or an
          # unreachable BEFORE (force-push, shallow history) fails closed to
          # running Chromatic, same as an unreadable diff on any other range.
          if [ "$REF_NAME" != "$DEFAULT_BRANCH" ] \
             || { [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
                  && git rev-parse --verify --quiet "${BEFORE}^{commit}" >/dev/null 2>&1; }; then
            if changed=$(set -o pipefail; git diff --name-only -z --no-renames "$range" | tr '\0' '\n'); then
              # Assigned first, then echoed. A substitution inside echo's
              # argument is a status `set -e` cannot see, so a predicate that
              # failed to run would write an empty `skip` that matches neither
              # gate below and green this job having published nothing.
              skip="$(bash .gaia/scripts/chore-deps-skip.sh "$subject" <<<"$changed")"
            fi
          fi
          echo "skip=${skip}" >> "$GITHUB_OUTPUT"
      # Allowlist of paths that can affect a Storybook build. Anything outside
      # this list reports the required check green without running Chromatic.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: steps.chore-deps.outputs.skip == 'false'
        id: filter
        with:
          filters: |
            code:
              - 'frontend/app/**'
              - 'frontend/.storybook/**'
              - 'frontend/public/**'
              - 'package.json'
              - 'frontend/package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'frontend/tsconfig*.json'
              - 'frontend/vite.config.*'
              - 'frontend/react-compiler.config.*'
              - '.gaia/packages.json'
              - 'frontend/gaia.package.json'
              - '.github/workflows/chromatic.yml'
              # The composite action the Node setup step below `uses:`. It
              # matches nothing else here, so without this line a pull request
              # changing only the action -- its node version, its install arms,
              # its cache key -- would report `code=false`, skip the build and
              # the upload, and green `Run Chromatic` having published nothing.
              # A glob rather than the one path: the directory is where shared
              # composite actions go, so an itemized entry would silently stop
              # covering the next one. This does widen what re-runs a paid
              # build, which is the deliberate trade: the alternative is a
              # required check that cannot see a change to how it builds.
              - '.github/actions/**'
      - if: steps.chore-deps.outputs.skip == 'false' && steps.filter.outputs.code == 'true'
        name: Setup Node and install
        uses: ./.github/actions/gaia-setup-node
      # The preview must publish no environment values, and until now nothing on
      # the build path said so. `frontend/test/preview-env.test.ts` pins that the Vitest node
      # project keeps its real environment, emulates no DOM and loads no preview;
      # the Storybook build is a separate Vite pipeline no Vitest suite guards,
      # so a substitution re-added to `frontend/.storybook/main.ts`, `frontend/.storybook/vite.config.ts`,
      # a third config or a plugin would bake values into a public artifact with
      # nothing failing. Build with sentinel values in the environment and fail if
      # one survives into the output.
      #
      # What it asserts, exactly: no environment value reaches the published
      # artifact. It does not assert that no substitution map exists. `define`
      # replaces literal reference sites, so a re-added map whose keys nothing in
      # the story graph reads inlines nothing and this step stays green, which is
      # correct: a substitution that publishes nothing is not the failure. Both
      # cases are executed rather than reasoned about.
      #
      # The sentinels are every key `schema` in `frontend/app/env.server.ts` declares
      # except `NODE_ENV`, which is excluded because the build needs its real
      # value. Declares, not requires: `COMMIT_SHA` and `MSW_ENABLED` are
      # `.optional()` and carry sentinels anyway, since what decides coverage is
      # what a map could name. That is the four remaining keys `clientSchema`
      # admits to a browser, plus `SESSION_SECRET` and `SITE_URL`, which
      # `clientSchema` omits: a map inlining one of those publishes into the
      # preview a value the client is never meant to see, the worse of the two
      # failures and so the one least worth leaving uncovered. No other step in
      # this job sets any of them. A map reads these with
      # `loadEnv(mode, cwd, '')` and an empty prefix matches every key, so a
      # sentinel set here reaches the map wherever it lives.
      #
      # `pnpm exec` rather than the `build-storybook` script, deliberately:
      # `pnpm run` sets `npm_package_version` from `package.json` and overwrites
      # that sentinel, which would drop one of the four keys from the guard's
      # reach while still reporting green. Flag parity with the script is not
      # load-bearing; producing `frontend/storybook-static/` from the real config is.
      - if: steps.chore-deps.outputs.skip == 'false' && steps.filter.outputs.code == 'true'
        name: Build the preview and assert it inlines no environment values
        env:
          API_URL: gaia-preview-env-sentinel-api-url
          COMMIT_SHA: gaia-preview-env-sentinel-commit-sha
          MSW_ENABLED: gaia-preview-env-sentinel-msw-enabled
          npm_package_version: gaia-preview-env-sentinel-version
          SESSION_SECRET: gaia-preview-env-sentinel-session-secret
          SITE_URL: gaia-preview-env-sentinel-site-url
        run: |
          set -euo pipefail
          pnpm -C frontend exec storybook build --test --stats-json
          # `grep -r` exits 2 on a missing directory, and an `if` condition
          # absorbs that as "no match" rather than as an error, so a build that
          # produced no output would report this guard green having read nothing.
          if [ ! -d frontend/storybook-static ]; then
            echo "::error::The Storybook build produced no frontend/storybook-static/, so this guard inspected nothing."
            exit 1
          fi
          if grep -rl 'gaia-preview-env-sentinel-' frontend/storybook-static; then
            echo "::error::The Storybook build inlined environment values into the preview (files listed above). Remove the substitution and pass a story the values it needs as args."
            exit 1
          fi
          # frontend/storybook-static/ is left in place: it is the artifact `Run Chromatic`
          # publishes below. Publishing it is safe only because every check above
          # already ran against this exact tree and this step aborts before the
          # publish step on either a missing build or a leaked sentinel, so an
          # unproven tree can never reach that step.
      # storybookBuildDir points Chromatic at the tree the step above already
      # built and verified sentinel-free, instead of letting chromaui/action
      # shell out to its own `build-storybook` run. `--stats-json` in that
      # build is what keeps onlyChanged (TurboSnap) alive here: Chromatic only
      # passes `--stats-json` to a build it runs itself, so a prebuilt
      # directory needs the stats file baked in already. The measured saving
      # is the ~5s Chromatic's own build otherwise costs, on runs that clear
      # the path filter above.
      - if: steps.chore-deps.outputs.skip == 'false' && steps.filter.outputs.code == 'true'
        name: Run Chromatic
        uses: chromaui/action@bb3b582719a93c1828c5e520e62992b2937d7889 # v18.9.4
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          exitZeroOnChanges: true
          exitOnceUploaded: true
          autoAcceptChanges: 'main'
          onlyChanged: true
          externals: 'frontend/app/styles/tailwind.css'
          storybookBuildDir: 'frontend/storybook-static'
          # TurboSnap traces stories from the stats file relative to the
          # Storybook project root, which is the package, not the repo root.
          storybookBaseDir: 'frontend'
