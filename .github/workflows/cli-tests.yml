name: CLI Tests

# `workflow_dispatch:` is the CI-mode self-heal lane, not a convenience. When
# the Code Review Audit pushes a self-heal commit, GitHub's GITHUB_TOKEN
# recursion guard fires no `pull_request` event for the new HEAD, so
# code-review-audit.yml re-dispatches the workflows named in
# `.gaia/audit-ci.yml`'s `retrigger_workflows` and stamps each dispatched run's
# per-JOB conclusion onto that HEAD. `Vitest (.gaia/cli)` below is a declared-
# required context, so without this trigger -- and without the jobs admitting it
# in their `if:` -- a self-heal commit leaves the check absent and branch
# protection blocks the merge with no bypass short of an admin override.
# .gaia/scripts/tests/retrigger-reachability.bats guards the whole invariant.
#
# GitHub honors `workflow_dispatch` only for the copy of a workflow on the
# DEFAULT branch, so a dispatch of this file fails with 422 until it lands on
# main; the audit logs and tolerates that failure. Expect it on the branch that
# introduces the trigger, not after.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default-deny, so a job added later inherits no scope rather than the
# repository default. Each job below grants exactly what it needs.
permissions: {}

jobs:
  cli-tests:
    name: Vitest (.gaia/cli)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # This job is a declared-required context, so a wedged install or a hung
    # Vitest run would hold every PR at "Expected" for the 6-hour runner
    # default. Fail fast instead; the real runtime is well under a minute.
    timeout-minutes: 15
    # Checkout needs it to clone, and paths-filter and setup-node both default
    # their `token` input to `github.token` for the compare API and the
    # node-versions download. No step here passes a token to anything else.
    #
    # `pull-requests: read` is load-bearing for paths-filter, which resolves a
    # PR's changed files through the API (the same reasoning spelled out in
    # verify-required-checks.yml). Omitting it works only while this repo is
    # public; the day it went private every run would 403 with "Resource not
    # accessible by integration", and since this is a required context that
    # would block every merge rather than redden one advisory check.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Maintainer-only surface. PRs that don't touch the CLI source report
      # this required check green without installing or running anything.
      #
      # paths-filter resolves changed files from the pull-request context, which
      # a `workflow_dispatch` run does not have, so the dispatch lane skips this
      # step entirely and every step below falls back to running unconditionally.
      # That is the intent of a re-trigger: it exists to produce a real green on
      # the self-heal HEAD, and a full run is the only thing that proves one.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            code:
              - '.gaia/cli/**'
              - '.github/workflows/cli-tests.yml'
              # The lint-pin parity guard (src/lint-pin-parity.test.ts) asserts
              # .gaia/cli/package.json pins the same @gaia-react/lint as the
              # root workspace. A root-only bump is what causes that drift, and
              # tests.yml skips its whole suite for the `chore(deps):` title
              # /update-deps opens, so without this entry nothing evaluates the
              # guard on the PR that breaks it -- it would first fire on some
              # later, unrelated .gaia/cli/** change instead (#1051).
              - 'package.json'
              # Same guard, second subject. Its resolution half asserts both
              # workspaces RESOLVE the same version of every shared rule-bearing
              # package, which no manifest states: they are direct dependencies
              # of neither workspace and arrive transitively through a caret, so
              # the only record of them is each lockfile. A root-only re-resolve
              # is what floats that caret, and it moves no manifest, so without
              # this entry the root-lockfile side of the guard is unreachable on
              # the pull request that breaks it. The .gaia/cli side already lands
              # under '.gaia/cli/**'.
              - 'pnpm-lock.yaml'
              # Third subject of the same guard: both workspaces must harden on
              # the same terms (minimumReleaseAge, its strict flag, and
              # trustPolicy). .gaia/cli is a separate pnpm root, so the settings
              # exist twice by hand with nothing holding them together, and
              # relaxing root's copy alone is the drift worth catching at the
              # moment it is proposed.
              - 'pnpm-workspace.yaml'
              # The audit-template dogfood drift-guard compares this in-tree
              # workflow against the bundled .tmpl. Editing the .tmpl already
              # lands under .gaia/cli/**; the live workflow is the other side
              # of that equality, so a workflow-only edit must re-run the guard
              # or template drift lands silently.
              - '.github/workflows/code-review-audit.yml'
              # Same shape, wider subject, which is why this glob subsumes the
              # entry above rather than replacing its rationale. The adopter-CI
              # pin guard (automation/__tests__/adopter-ci-action-pins.test.ts)
              # asserts the workflow templates pin the same action SHAs every
              # workflow here runs, and Dependabot lands its weekly bump here
              # first, so any workflow-only edit must re-run that guard or the
              # bump merges with the templates left behind. A glob rather than
              # an itemized list: the guard reads the whole directory, so an
              # itemized one would silently stop covering a workflow added
              # later.
              - '.github/workflows/**'
              # The composite action the Node setup step below `uses:`. It lives
              # outside .github/workflows/, so it matches nothing else here, and
              # without this line a pull request changing only the action -- its
              # node version, its install arms, its cache key -- would report
              # `code=false`, skip every step gated on this filter, and green
              # `Vitest (.gaia/cli)` having run nothing. A glob rather than the
              # one path, the same reasoning as the workflows glob above: the
              # directory is where shared composite actions go, so an itemized
              # entry would silently stop covering the next one.
              - '.github/actions/**'
              # The action's own inputs, one hop past the action file itself.
              # It resolves the runtime from `.node-version` and installs under
              # `.npmrc`, and neither matches anything else here, so a bump to
              # either would resolve `code=false` and green this required check
              # having run the suite zero times under the new pin.
              # `pnpm-workspace.yaml` is already listed above for the parity
              # guard and covers the third. audit-ci-tests.yml lists the same
              # two for the same reason.
              # Hand-maintained, and not covered by the coverage guard: it
              # checks that the action file itself is reachable but does not
              # descend into the action's body, so a fourth file the action
              # starts reading is a gap that guard cannot see. Revisit these
              # entries whenever the action's inputs change.
              - '.node-version'
              - '.npmrc'
              # The region-marker conformance suite binds the TypeScript parser
              # to the two bash readers it inherits its semantics from. It runs
              # in this job (see the step below), so an edit to either bash side
              # must re-run it here or the binding goes unasserted.
              - '.gaia/scripts/tests/region-marker-conformance.bats'
              - '.gaia/scripts/write-audit-remits.sh'
              - '.gaia/scripts/verify-audit-roster.sh'
              # The bundle-freshness gate below is this script, so an edit to
              # it must re-run the gate on its own pull request. Without this
              # line a change touching only the script resolves `code=false`,
              # skips the step, and reports this required check green having
              # run nothing. release.yml runs the same script and so is no
              # independent second opinion; shell-lint.yml catches only what
              # shellcheck can see, and a semantic weakening -- dropping the
              # template `diff -rq`, inverting a `cmp` -- is invisible to it.
              - '.gaia/scripts/verify-cli-bundle-fresh.sh'
      - if: steps.filter.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
        name: Setup Node and install the CLI workspace
        uses: ./.github/actions/gaia-setup-node
        with:
          install: cli
          cache-dependency-path: '.gaia/cli/pnpm-lock.yaml'
      - if: steps.filter.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
        name: Typecheck
        run: pnpm -C .gaia/cli typecheck
      - if: steps.filter.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
        name: Lint
        run: pnpm -C .gaia/cli lint
      - if: steps.filter.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
        name: Run Vitest tests
        run: pnpm -C .gaia/cli test --run
      # The region-marker conformance suite drives the real TypeScript parser
      # through tsx, so it needs .gaia/cli/node_modules and skips itself wherever
      # they are absent. audit-ci-tests.yml runs the .gaia/scripts/tests suites on
      # a lean box with no Node and no pnpm, so that guard is always true there
      # and the suite reports skipped-and-green on every run. This job is the one
      # place the dependency exists, which makes it the only place the binding
      # between the parser and the two bash readers is actually asserted.
      - if: steps.filter.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
        name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - if: steps.filter.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
        name: Run region-marker conformance suite
        run: bats .gaia/scripts/tests/region-marker-conformance.bats
      # PR-time half of the bundle-freshness gate; release.yml runs the same
      # script at tag-push. A PR that edits .gaia/cli/src/** without rebuilding
      # the committed bundles would otherwise merge a stale binary that only the
      # release cut later catches, and this job is a required check, so what it
      # misses merges. Both callers run one script rather than a copy each,
      # which is what keeps them from drifting: a comment asking a human to hold
      # two copies in lockstep is not an enforcement mechanism. Full rationale
      # lives in the script's docblock.
      - if: steps.filter.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
        name: Verify committed CLI binaries and templates are rebuilt from src
        run: bash .gaia/scripts/verify-cli-bundle-fresh.sh

  # PR-gated distribution harness. Before this job, the harness (run-all.sh,
  # its scenarios, lib/) ran only at tag-push (release.yml) and manual
  # workflow_dispatch (distribution.yml), so a change to the CLI bundle, the
  # release-exclude set, or the scrub config that breaks the adopter tarball (a
  # leak, a marker-strip regression, manifest drift) shipped through PR review
  # and was caught only at release, when the fix is far more expensive.
  #
  # This runs Layers 0+1 plus the adopter-flow regressions (07+) and the
  # deterministic marker-strip survival check. It passes NO
  # CLAUDE_CODE_OAUTH_TOKEN, so the Docker/secret-dependent scenarios (06, and
  # 15's advisory model probe) soft-pass-skip via their own guards; the full
  # Layers 0+1+2 run stays with release.yml and distribution.yml, which have the
  # org secret. Not a declared-required context (see verify-required-checks.sh),
  # unlike the sibling cli-tests job. It shares that job's always-runs shape --
  # reporting green when the filter does not match -- so it is
  # branch-protection-safe without ever forcing a merge block from a
  # maintainer-only surface adopters cannot see.
  distribution-harness:
    name: Distribution harness (no-Docker)
    # Advisory, not a required context, but it shares this workflow with the
    # required sibling above: one dispatch runs both, and the audit stamps a
    # check run per JOB. Left gated to `pull_request` it would stamp a bare
    # `skipped` onto the self-heal HEAD, which reads as a regression rather than
    # the "not evaluated" it actually is.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Same three consumers as cli-tests above; the scenarios run without a
    # token by design (see the step name at the harness invocation below).
    # `pull-requests: read` is paths-filter's, for the same reason given there.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # PRs that touch neither the bundle inputs nor the harness report this
      # check green without installing or running anything. Skipped on the
      # dispatch lane for the same reason as the sibling job above.
      #
      # This list stays narrow on purpose, and the narrowness is now backstopped
      # rather than merely tolerated: the scenario suite is the expensive part of
      # this job and its inputs really are these paths. The one thing the
      # narrowness used to be able to skip -- the release leak check, whose real
      # input is every file that ships -- runs unconditionally in the
      # shipped-surface job below, so a pull request touching only some other
      # shipped file can no longer green a leak.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            code:
              - '.gaia/cli/**'
              - '.gaia/release-exclude'
              - '.gaia/release-scrub.yml'
              # The harness itself: a scenario, lib, or runner edit must re-run.
              - '.gaia/tests/distribution/**'
              - '.github/workflows/cli-tests.yml'
              # The composite action this job's Node setup step `uses:`. Nothing
              # else here reaches it, so without this line an action-only change
              # would resolve `code=false` and skip the harness, greening the job
              # having run no scenario. Same reasoning as the sibling job's own
              # entry above; the two filters are separate lists, so it is needed
              # in both.
              - '.github/actions/**'
              # The action's own inputs, same reasoning as the sibling job's
              # entries. This job's scenarios additionally run `pnpm install`
              # against the extracted staging tree, so the install settings are
              # load-bearing here too. Hand-maintained on the same terms as the
              # sibling job's entries: the coverage guard reaches the action
              # file, not the files the action itself reads.
              - '.node-version'
              - '.npmrc'
              - 'pnpm-workspace.yaml'
      - if: steps.filter.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
        name: Setup Node
        uses: ./.github/actions/gaia-setup-node
        with:
          install: none
          # Scenarios 04/05 run `pnpm install` against the extracted staging
          # tree, which resolves the root lockfile; warm the pnpm store on it.
          cache-dependency-path: 'pnpm-lock.yaml'
      # The harness shells out to the COMMITTED bundled binaries directly
      # (build-staging.sh needs gaia-maintainer; the scenarios need gaia); it
      # does not `pnpm -C .gaia/cli install`. Freshness of those binaries vs.
      # src is the sibling cli-tests job's concern; here we test the committed
      # bundle as-is, which is what the release tarball ships.
      - if: steps.filter.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
        name: Verify committed CLI binaries are present
        run: |
          for bin in .gaia/cli/gaia .gaia/cli/gaia-maintainer; do
            if [ ! -x "$bin" ]; then
              echo "::error::$bin missing or not executable. Maintainer must commit the bundled binary." >&2
              exit 1
            fi
          done
      - if: steps.filter.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
        name: Run distribution scenarios (Layers 0+1 + adopter-flow; no token)
        # Intentionally no CLAUDE_CODE_OAUTH_TOKEN: keeps the Docker/secret
        # scenarios out of the required PR lane (they self-skip as soft PASS).
        run: bash .gaia/tests/distribution/run-all.sh

  # The cheap half of the harness above, split out so it can run over the whole
  # shipped surface. build-staging.sh stages every tracked file that
  # .gaia/release-exclude does not withhold, resets the wiki sentinels, and runs
  # the scrub and runtime-dependency leak checks over the result, so its honest
  # input is the entire tree minus that exclude list, not the handful of paths
  # the harness filter above names. Every scenario builds that same tree, which
  # is what made the mismatch live rather than theoretical: a comment added to a
  # SHIPPED workflow naming a maintainer-only path failed the leak check in all
  # of them, and was caught only because that pull request happened to also touch
  # this file. An edit confined to that shipped workflow would have resolved the
  # harness filter false, skipped the job, greened it having validated nothing,
  # and surfaced the leak at tag push in release.yml, where the fix is far more
  # expensive.
  #
  # No paths-filter here, and the absence is the decision rather than an
  # oversight. An allowlist that honestly described this job's inputs is `'**'`,
  # which gates nothing while still costing a paths-filter step, a
  # `pull-requests: read` API round trip, and a failure mode of its own: the 403
  # that scope earns the day this repo goes private would redden the job for a
  # reason unrelated to any leak. The complement -- everything except the
  # maintainer-only paths -- is a denylist, and this repo forbids that shape
  # twice over: .gaia/release-scrub.yml's `workflow-denylist` leak check rejects
  # `paths-ignore:`/`!` shapes in workflows, and
  # .gaia/scripts/tests/workflow-filter-coverage.bats fails CLOSED on a leading
  # `!` because a negation is the false-bless direction. So the real choice is
  # between a filter that lies about being narrowable and no filter at all.
  #
  # The cost, stated where the filter would have been: a checkout, a Node setup,
  # and roughly a second of build-staging.sh on every pull request. What that
  # buys is a leak check no pull request can skip by changing only a shipped file
  # the harness filter above does not name.
  shipped-surface-leak-check:
    name: Shipped-surface leak check
    # Advisory, not a declared-required context, and it must not become one. It
    # admits `workflow_dispatch` for the same reason the harness above does: one
    # dispatch runs every job in this workflow and the audit stamps a check run
    # per JOB, so a job left gated to `pull_request` alone stamps a bare
    # `skipped` onto the self-heal HEAD, which reads as a regression rather than
    # the "not evaluated" it actually is.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `contents: read` and nothing more: checkout needs it to clone, and
    # setup-node defaults its `token` input to `github.token` for the
    # node-versions download. The `pull-requests: read` the two jobs above hold
    # is paths-filter's alone, and no paths-filter runs here, so granting it
    # would be scope this job never spends.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # build-staging.sh shells out to the committed .gaia/cli/gaia-maintainer,
      # a bundled binary with a `#!/usr/bin/env node` shebang, so the runtime has
      # to be the pinned `.node-version` one rather than whatever ubuntu-latest
      # happens to preinstall. That is the whole of this job's Node requirement.
      #
      # actions/setup-node directly rather than ./.github/actions/gaia-setup-node,
      # the same exception forensics-triage.yml already takes and the composite's
      # own docblock records. The composite passes `cache: 'pnpm'`
      # unconditionally, and setup-node's post step saves that cache with no
      # on-disk check: it reads the store path from `pnpm store path`, which
      # prints a path without creating it, so on a cache MISS the save resolves
      # zero paths and fails the job on a caching error unrelated to any leak.
      # A hit returns early and a job that runs `pnpm install` creates the store
      # first, which is why the two jobs above never see it; this job runs no
      # pnpm at all, and setup-node passes no pnpm restore keys, so every pull
      # request that moves the root lockfile is a guaranteed miss. Dropping the
      # cache also drops the pnpm bootstrap this job never uses. The pin is
      # unchanged, which is what keeps adopter-ci-action-pins.test.ts green.
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
      # No binary-presence step, unlike the harness job above. That job checks
      # both committed binaries because its scenarios drive `gaia` as well;
      # here build-staging.sh is the only consumer, and its first act is to test
      # .gaia/cli/gaia-maintainer for the executable bit and exit 1 naming both
      # the path and the `pnpm -C .gaia/cli bundle` that fixes it. A step
      # asserting what the script already asserts adds a second place to drift,
      # not a second signal.
      - name: Stage the release tree and prove no shipped file leaks
        # build-staging.sh requires an output dir that exists and is EMPTY, and
        # $RUNNER_TEMP is neither guaranteed empty nor exclusively this step's,
        # hence mktemp beneath it rather than the directory itself. $RUNNER_TEMP
        # rather than a hardcoded /tmp path so the runner cleans it up.
        run: |
          staging="$(mktemp -d "$RUNNER_TEMP/release-staging.XXXXXX")"
          bash .gaia/tests/distribution/lib/build-staging.sh "$staging"
