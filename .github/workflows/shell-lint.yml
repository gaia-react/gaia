name: Shell Lint

# Runs shellcheck over every tracked *.sh and *.bats in the repo via
# .gaia/tests/shell-lint.sh (per-type severity floor: *.sh at style, *.bats at
# warning).
#
# Two jobs, on two runner images, because one pass of that harness cannot run on
# the image the rest of it wants. The shellcheck passes and the folded guards
# are host-independent and run on ubuntu; the bash-3.2 parse pass is a question
# about the host's own /bin/bash, and ubuntu's is bash 5, where the pass can
# only skip. Stock macOS still ships 3.2.57 as /bin/bash, so the macOS leg is
# the only place in this repo's CI where that pass has an interpreter to answer
# with. It runs `--only bash32-parse` rather than the whole harness: macOS
# minutes bill at 10x, and every other pass would be a duplicate of the ubuntu
# leg's work at ten times the price.
#
# Maintainer-only: adopters run GAIA's bash but never author it, so the linter
# that guards the framework's own shell has no adopter surface. Release-excluded
# alongside the other maintainer-only workflows; on an adopter clone this would
# be a silent passenger at best and a confusing red check at worst.
#
# Complements rather than replaces the code-audit-maintainer-shell agent: that
# agent already treats shellcheck as an authoritative oracle, but it is
# model-dispatched and advisory-only, so nothing enforced a clean tree. The agent
# keeps the lenses shellcheck cannot model (hook fail-open, stdin-JSON shape,
# `jq -n` injection safety); this job keeps the mechanics from regressing.
#
# Pinned action SHAs match .github/workflows/audit-ci-tests.yml:
#   actions/checkout    @ 3d3c42e5aac5ba805825da76410c181273ba90b1 (v7.0.1)
#   dorny/paths-filter  @ ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d (v4.0.3)

# No `push:` trigger. The job only ever has something to say about a proposed
# change, and a push-to-main run would be a skipped no-op cluttering the
# dashboard. Merges all land via PR, so the PR run is the gate.
on:
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default-deny, so a job added later inherits no scope rather than the
# repository default. Each job below grants exactly what it needs.
permissions: {}

jobs:
  shell-lint:
    name: shellcheck (tracked *.sh + *.bats)
    runs-on: ubuntu-latest
    # A checkout, one pinned-tarball download, and a whole-tree shellcheck run.
    # Ten minutes is a wide margin for an ordinary run, wider than it looks
    # because the one step that can hang is a network fetch from github.com,
    # not the linter. Without a cap a stalled download burns the 6-hour
    # default; the same reasoning audit-roster.yml spells out for itself.
    timeout-minutes: 10
    # Read-only token: this job lints and reports, it never writes to the repo.
    # Bounds the blast radius of the third-party binary it installs below.
    #
    # `pull-requests: read` is load-bearing, not decoration. Naming any scope here
    # sets every unlisted one to `none`, and dorny/paths-filter resolves a PR's
    # changed files through the API, which needs it. Omitting it works only while
    # this repo is public (the token can still read public PR data); the day it went
    # private, every run would 403 with "Resource not accessible by integration".
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # PRs that touch no shell script report this check green without
      # installing or running anything.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            shell:
              - '**/*.sh'
              - '**/*.bats'
              # The husky hooks are extensionless, so neither glob above reaches
              # them -- the same gap that kept them out of the gate's own
              # discovery. Without this line a PR that changes only a husky hook
              # resolves `shell=false`, skips the install and the gate, and
              # greens the check having linted nothing.
              - '.husky/**'
              # The gate folds in guards whose scan surface INCLUDES the
              # workflow `run:` blocks, which no *.sh glob reaches:
              # lint-git-path-quoting.sh, lint-workflow-run-interpolation.sh,
              # lint-grep-ere-escapes.sh, lint-errexit-status-read.sh, and
              # lint-collapsed-signal-trap.sh. Only
              # lint-workflow-run-interpolation.sh is
              # workflow/action/template-only; the rest scan tracked *.sh as
              # well, so this line is not their whole surface, it is the only
              # path that arms the half no other line here covers. Naming the
              # exception rather than counting the others is deliberate: a count
              # rots the moment a guard widens its pathspec, which is why the
              # list above is named rather than counted too. Each one is named
              # because this line is the sole CI path for that guard's
              # `run:`-block half, so retiring any of them must not read as
              # licence to drop it. Without this line a PR that changes only a
              # workflow resolves `shell=false`, skips the gate and greens the
              # check having linted the very files it just changed -- the same
              # gap the .husky/** line above closes, one file type over.
              - '.github/workflows/**'
              # The run-interpolation, grep-escape, status-read, and
              # collapsed-signal-trap guards also scan the composite actions,
              # which the glob above does not reach. For the status-read guard
              # this is the load-bearing half rather than a widening: both
              # instances of its class shipped inside a composite action, and
              # actionlint does not lint composite step bodies at all.
              - '.github/actions/**'
              # Subsumed by the glob above and kept deliberately: it is the
              # explicit record that this gate re-runs on a change to itself,
              # which survives any later narrowing of that glob.
              - '.github/workflows/shell-lint.yml'
              # The run-interpolation, grep-escape, status-read, and
              # collapsed-signal-trap guards also scan the adopter workflow
              # templates. Those render into an adopter's own CI, so a
              # template-only PR resolving `shell=false` would green the check
              # having left unscanned the one surface whose defects this repo's
              # review is the last place able to see.
              - '.gaia/cli/src/automation/templates/workflows/**'
              # The path-quoting guard additionally scans the fenced blocks of
              # every tracked markdown file, so its scan surface reaches a file
              # type nothing above matches. Without this line a PR whose only
              # change is a doc adding a fenced `git diff --name-only` without
              # `-z` resolves `shell=false` and greens the check having scanned
              # the very file it changed zero times. The glob mirrors that
              # guard's own `*.md` pathspec deliberately: a filter narrower than
              # the surface it arms is the fail-open shape, so the two are
              # widened and narrowed together or not at all.
              - '**/*.md'
              # The stale-cardinal guard reads the C-family globs
              # .claude/rules/code-comments.md binds, a surface nothing above
              # matches. Without these lines a pull request whose only change is
              # a `.tsx` comment asserting a definite cardinal resolves
              # `shell=false` and greens the check having scanned the very file
              # it changed zero times. These are a transcription of that rule's
              # own entries, and the guard's sibling suite holds all three lists
              # together: it pins the gate's pathspecs against the rule, and it
              # pins this block against the rule as a superset, so a glob added
              # to the rule and not to either place reds rather than silently
              # leaving a governed surface unarmed.
              - 'app/**/*.{ts,tsx,js,jsx,css}'
              - 'test/**/*.{ts,tsx}'
              - '.playwright/**/*.ts'
              - '.storybook/**/*.{ts,tsx}'
              - '.gaia/**/*.ts'
              # The bundled-hooks inventory guard reads .claude/settings.json,
              # which nothing above matches. Registering a hook usually adds a
              # script under .claude/hooks/ too, and `**/*.sh` arms on that, but
              # a PR that only REGISTERS an already-present script changes
              # settings.json alone: it would resolve `shell=false` and green the
              # check having never compared the registration it just added
              # against the page. The other half of that guard's surface, the
              # page itself, is already reached by the `**/*.md` line above.
              - '.claude/settings.json'
      # Install a pinned release binary rather than `apt-get install shellcheck`:
      # Ubuntu ships 0.9.0 while a maintainer's Homebrew ships newer, and their
      # directive parsers disagree, so an unpinned gate returns a different verdict
      # depending on which machine ran it.
      #
      # The digest is pinned, not just the version. A GitHub release TAG is mutable
      # (an asset can be deleted and re-uploaded under the same `v0.11.0`), so
      # pinning the version alone would still let a compromised upstream feed this
      # job an arbitrary binary that the next step then executes. Verify the tarball
      # against SHELLCHECK_SHA256 BEFORE extracting it, and never pipe the download
      # straight into `tar`: a pipe streams bytes into the extractor before anything
      # can check them. This is the same discipline as the SHA-pinned actions above.
      #
      # To bump: change SHELLCHECK_VERSION, recompute the digest
      #   curl -fsSL <url> | shasum -a 256
      # and update SHELLCHECK_PIN in .gaia/tests/shell-lint.sh to match. The guard
      # below fails the job if the two drift apart, so they cannot silently diverge.
      - if: steps.filter.outputs.shell == 'true'
        name: Install shellcheck (pinned + digest-verified)
        env:
          SHELLCHECK_VERSION: '0.11.0'
          SHELLCHECK_SHA256: '8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198'
        run: |
          set -euo pipefail
          pin="$(awk -F= '/^SHELLCHECK_PIN=/{print $2; exit}' .gaia/tests/shell-lint.sh)"
          if [ "$pin" != "$SHELLCHECK_VERSION" ]; then
            echo "::error::shellcheck pin drift: workflow pins ${SHELLCHECK_VERSION}, .gaia/tests/shell-lint.sh pins ${pin}" >&2
            exit 1
          fi
          url="https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL "$url" -o shellcheck.tar.xz
          echo "${SHELLCHECK_SHA256}  shellcheck.tar.xz" | sha256sum -c -
          tar -xJf shellcheck.tar.xz
          sudo install -m 0755 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          rm -rf "shellcheck-v${SHELLCHECK_VERSION}" shellcheck.tar.xz
          shellcheck --version
      # The gate lints every tracked *.sh and *.bats, not just the changed ones:
      # shellcheck is fast enough at this repo's size (~280 scripts + suites, low
      # seconds) that a whole-tree run is simpler than a diff-scoped one and
      # cannot drift out of sync with the paths filter above.
      - if: steps.filter.outputs.shell == 'true'
        name: Run shellcheck gate
        run: bash .gaia/tests/shell-lint.sh

  bash32-parse:
    name: bash-3.2 parse (stock macOS /bin/bash)
    runs-on: macos-latest
    # A checkout and a `bash -n` sweep of the tracked *.sh set, seconds of work.
    # Ten minutes matches the sibling job above for the same reason: without a
    # cap a stalled step burns the 6-hour default, and on this image that is
    # billed at 10x.
    timeout-minutes: 10
    # Read-only, and `pull-requests: read` is load-bearing for dorny/paths-filter
    # for the reason spelled out on the job above.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Narrower than the sibling job's filter, and deliberately so: this leg
      # runs one pass, and that pass reads the tracked *.sh set and nothing
      # else. The husky hooks, the composite actions, the workflow templates and
      # the markdown fences all belong to passes that do not run here. The
      # second entry is the self-coverage half every gated step owes -- a gate
      # blind to a change in its own definition greens having run nothing.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            shell:
              - '**/*.sh'
              - '.github/workflows/shell-lint.yml'
      # The parse pass skips, loudly but at exit 0, on any bash 4 or newer. That
      # is correct behavior for a Linux contributor's local run and fatal here:
      # this leg exists only to answer the 3.2 question, so an image that ever
      # stopped shipping 3.2.57 would leave it green having parsed nothing --
      # the same false clean, one layer up, that the pass itself exists to end.
      # Assert the interpreter before trusting the verdict.
      - if: steps.filter.outputs.shell == 'true'
        name: Assert this runner ships bash 3.2 as /bin/bash
        run: |
          set -euo pipefail
          major="$(/bin/bash -c 'printf "%s\n" "${BASH_VERSINFO[0]}"')"
          echo "/bin/bash reports bash major version $major"
          if [ "$major" -ge 4 ]; then
            echo "::error::/bin/bash on this runner is bash $major, so the parse pass would skip and this job would report green having parsed nothing" >&2
            exit 1
          fi
      # No shellcheck install step, which is the whole point of `--only`: this
      # pass needs an interpreter, not a linter.
      - if: steps.filter.outputs.shell == 'true'
        name: Parse every tracked *.sh with /bin/bash 3.2
        run: bash .gaia/tests/shell-lint.sh --only bash32-parse
