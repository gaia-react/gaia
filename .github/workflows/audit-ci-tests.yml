name: 'GAIA: Audit CI Tests'

# Runs the bats suites for the .github/audit/ helpers,
# resolve-audit-base.sh (the audit's incremental review base) and
# resolve-check-base.sh (tests.yml's check base), plus the
# pr-merge-audit-check.sh PreToolUse merge hook (GAIA-Audit status reader).
# Maintainer-only:
# adopters receive these as GAIA-controlled (`owned`) code they never
# modify, so the suite only catches regressions from maintainer edits.
# Mirrors cli-tests.yml's narrow-surface, paths-filtered, step-gated shape.
#
# The last step is the odd one and is deliberate: the INV-7 concurrency meter
# (.gaia/tests/concurrency/) is gated through meter-gate.sh, which runs the
# whole suite and fails on any scenario that does not report an unconditional
# `ok` (a `skip` counts as a failure). See .gaia/tests/concurrency/README.md.
#
# Pinned action SHAs match .github/workflows/cli-tests.yml:
#   actions/checkout    @ 3d3c42e5aac5ba805825da76410c181273ba90b1 (v7.0.1)
#   dorny/paths-filter  @ ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d (v4.0.3)
#   pnpm/action-setup   @ ea17c68df8912ef543352723c149a84f56e3d413 (v6.1.0)
#   actions/setup-node  @ 820762786026740c76f36085b0efc47a31fe5020 (v7.0.0)

# A pull request runs each bats leg change-scoped (the suites its diff can
# affect, plus the whole-tree-marked tests) unless it touches harness machinery.
# Every push to main runs every leg whole: it is the backstop for whatever the
# change-scoped selection cannot see, and `report-main-status` below keeps one
# `ci-red-main` issue open while main is red.
#
# `workflow_dispatch:` is the manual re-run lane, and also runs every leg whole.
# A push made with a GITHUB_TOKEN fires no `pull_request` event, so a head moved
# that way carries no `Audit CI Tests` run. `Audit CI Tests` below is a
# declared-required context, so dispatching this workflow, with the job
# admitting the event in its `if:`, is how a maintainer produces the check on
# such a head. Same shape as cli-tests.yml. GitHub honors the trigger only for
# the default-branch copy of this file, so a dispatch fails with 422 until it
# lands on main.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# A push run's group is its own commit, so no merge's run is cancelled or
# dropped as pending behind a later merge, and each merge gets its own verdict.
# A pull request keeps one group per ref with in-progress cancellation, so a
# superseded push to the same branch stops paying for the old head.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Default-deny, so a job added later inherits no scope rather than the
# repository default. Each job below grants exactly what it needs.
permissions: {}

jobs:
  # The fan-out matrix: one leg per bats shard, plus the sandbox conformance
  # tree, the INV-7 concurrency meter and the commitlint config suite as three
  # further legs that run their own runners under their own filter gates. `audit-ci-tests` below is the
  # thin aggregator that carries the declared-required check name; splitting
  # the name off this job is what lets `fail-fast: false` keep one failing
  # shard from cancelling its siblings without also cancelling the check
  # itself.
  shards:
    name: Shard (${{ matrix.shard }})
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # The outer bound only. A matrix takes ONE integer job cap for every leg,
    # so this one is sized to the heaviest leg's whole run, installs included.
    # What fails a hung leg at its own bound is the integer literal
    # `timeout-minutes` on each run step below, each sized to that step's own
    # measured runtime and kept strictly below this one.
    # `.gaia/tests/lib/audit-ci-shards.bats` W5 checks both.
    timeout-minutes: 13
    # Read-only token: the job checks out, resolves changed files via
    # dorny/paths-filter, and runs bats or the sandbox/concurrency runners; it
    # needs no write scopes.
    #
    # `pull-requests: read` is load-bearing, not decoration: naming any scope
    # here sets every unlisted one to `none`, and dorny/paths-filter resolves a
    # PR's changed files through the API, which needs it. Omitting it works only
    # while this repo is public; the day it went private, every run would 403
    # with "Resource not accessible by integration". Mirrors shell-lint.yml,
    # which runs the same action on the same trigger.
    permissions:
      contents: read
      pull-requests: read
    # `fail-fast: false` is load-bearing, not a default preference: one failing
    # shard must not cancel its siblings, or the aggregator adjudicates a
    # partial picture and a re-run loses information about every leg GitHub
    # cancelled rather than ran. The matrix values are the bats-shards.sh shard
    # ids plus the three workflow-level legs; audit-ci-shards.bats checks the
    # two stay in sync.
    strategy:
      fail-fast: false
      matrix:
        shard: [hooks-1, hooks-2, hooks-3, hooks-4, scripts-1, scripts-2, scripts-3, scripts-4, audit, lib, misc, sandbox, concurrency, commitlint]
    steps:
      # Depth 2 so the change-scoped run can diff the pull request's merge
      # commit against its first parent, the base branch it merges into.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      # A pull request that touches nothing these filters list reports this
      # check green without installing or running anything.
      #
      # paths-filter resolves changed files from the pull-request context, which
      # a push or `workflow_dispatch` run does not have, so those lanes skip this
      # step and every filter-gated step below admits the event directly. A push
      # to main or a manual re-run exists to produce a real verdict on that
      # commit, and a full run is the only thing that proves one: the selection
      # step below plans every bats leg whole for both.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            # Harness machinery: the files that decide which suites run and how
            # they run, so a change to one can alter any suite's outcome while
            # being named by none of them. Matching any of these plans every
            # bats leg whole. This list equals the change classifier's static
            # harness list (`bash .gaia/tests/bats-change-scope.sh
            # --list-harness-paths`), entry for entry; audit-ci-shards.bats
            # holds the two in lockstep.
            code:
              # This job's own definition: the filters, the step gates and the
              # commands they arm.
              - '.github/workflows/audit-ci-tests.yml'
              # The sharder every bats leg's plan and run steps invoke.
              - '.gaia/tests/bats-shards.sh'
              # The classifier the sharder asks whether a change is harness
              # scope, which is what decides whole shard or change-scoped.
              - '.gaia/tests/bats-change-scope.sh'
              # The selector that picks the change-scoped suites.
              - '.gaia/scripts/bats-suites-for-change.sh'
              # The installer every leg's bats install step calls (also listed
              # in `sandbox:` and `commitlint:`, whose legs call it too).
              - '.gaia/tests/install-bats.sh'
              # The vendored archive that install extracts; the digest check
              # that would catch a swapped blob runs inside that install.
              - '.gaia/tests/vendor/**'
              # The shared bats helpers, sourced by suites across directories.
              # A suite names the helper it sources, not every file that helper
              # reaches, so a helper change can move any suite's outcome.
              - '.gaia/tests/helpers/**'
              - '.gaia/tests/**/helpers/**'
              - '.gaia/scripts/tests/helpers/**'
              # The composite actions the Node setup steps use: their node
              # version, install arms and cache key are every Node leg's
              # environment.
              - '.github/actions/**'
              # The release boundary. Its readers mostly reach it through a
              # script they call (the rooting, array-guard, vendored-skill,
              # bundle-freshness and telemetry checks) and never name it, so no
              # selection could find them; a file that changes this rarely costs
              # little as a full-run trigger.
              - '.gaia/release-exclude'
              # Shared shell libraries. A suite names the script it tests, not
              # the library that script loads, so a library change reaches
              # suites none of which name it. The classifier also treats any
              # file another tracked script sources as harness scope; these
              # globs are the static half of that rule.
              - '.claude/hooks/**/lib/**'
              - '.gaia/scripts/**/lib/**'
              - '**/*-lib.sh'
            # Everything else that arms the bats legs. A pull request matching
            # these, and nothing in `code` above, runs each bats leg
            # change-scoped (`bats-shards.sh run-for-change`): the suites the
            # change selector picks, in full, plus the leg's whole-tree-marked
            # tests, plus, for a change to an install input, the suites marked
            # as reading installed dependencies. The concurrency meter runs as it
            # does for `code`.
            #
            # A path belongs in `code` only when it is harness machinery;
            # everything else is change-scoped. That is safe because a suite
            # whose outcome a file can change either names it, which is what
            # the selector picks on, or reads a tree-wide property and carries
            # the whole-tree mark, which .gaia/tests/whole-tree-mark-guard.sh
            # enforces for tests that enumerate the tree directly or through a
            # script or helper they call; and a shared library fails closed
            # through the classifier. The residual limit, a test that reaches a
            # file by a path neither the selector nor the guard can see, is
            # backstopped by the full run on every push to main.
            scoped:
              # LOAD-BEARING: the steps the selection step gates, and the
              # concurrency meter, name these as inputs, and
              # workflow-filter-coverage.bats holds each gated step's literal
              # inputs reachable by the outputs its `if:` reads.
              # meter-gate.sh is reached by this output alone; the rest are in
              # `code` too, and stay here so this output reaches every input of
              # the steps it arms without leaning on the other.
              - '.github/workflows/audit-ci-tests.yml'
              - '.github/actions/**'
              - '.gaia/tests/install-bats.sh'
              - '.gaia/tests/bats-shards.sh'
              - '.gaia/tests/concurrency/meter-gate.sh'
              # The audit helpers under .github/audit/ and their suites.
              - '.github/audit/**'
              # Every hook. Each hook suite under .gaia/tests/hooks/ names the
              # hook it runs; the hook-tree scans carry the whole-tree mark.
              - '.claude/hooks/**'
              # Rule files. A suite asserting on one rule names it; a suite
              # asserting a property of every rule carries the whole-tree mark.
              - '.claude/rules/**'
              # The git hooks. githooks-pre-commit.bats names .githooks/pre-commit
              # and asserts which staged paths reach the Quality Gate floor.
              - '.githooks/**'
              - '.gaia/packages.json'
              - '.gaia/scripts/**'
              # Every tracked shell file. The shell lint suites
              # (.gaia/scripts/tests/lint-*.bats) scan the real tree's tracked
              # shell and carry the whole-tree mark; a suite testing one script
              # names it. The glob is the scans' own input rather than an
              # enumeration of the files it reaches today, so it self-maintains
              # when shell appears somewhere new.
              - '**/*.sh'
              # check-main-root-derivation.bats scans tracked source for a
              # hand-rolled main-checkout derivation, and hook commands live in
              # settings.json as inline shell; the suites reading it name it.
              - '.claude/settings.json'
              # shell-lint.bats names the local shell gate it asserts the wiring
              # of; its real-tree pass carries the whole-tree mark.
              - '.gaia/tests/shell-lint.sh'
              # audit-guard-structural.bats names code-audit-frontend.md, whose
              # no-op-guard wiring it greps.
              - '.claude/agents/code-audit-frontend.md'
              # doc-noop-terminal-contract.bats (.gaia/tests/lib/) derives its
              # dispatch-prompt carriers by searching the whole tree, and its
              # tests carry the whole-tree mark. Each glob below is a root that
              # holds dispatch prompts: the .claude skills, commands and agents,
              # and the spec workflow templates. The three .claude roots are
              # supersets of the narrower file entries around them, which stay
              # listed so each suite's own sources remain armed if a root is ever
              # narrowed.
              # The workflow-doctrine suite's pin-site scan names the health
              # taxonomy page it reads for model pins.
              - '.gaia/cli/health/taxonomy.md'
              - '.claude/skills/**/*.md'
              - '.claude/commands/**/*.md'
              - '.claude/agents/**/*.md'
              # The fitness-ci-command suite lints the whole tracked tree with
              # the committed bundle and the base suppressions, and names both.
              # setup-decision-nudge.bats and the other statusline suites that
              # record through the real bundle name it too.
              - '.claude/gaia-fitness.json'
              - '.gaia/cli/gaia'
              - '.gaia/templates/spec/**'
              # The doc-isolation suite (.gaia/tests/lib/) renders the prompt
              # out of the shared isolation reference and greps both callers'
              # pointer wiring, naming each.
              - '.claude/skills/gaia/references/isolation.md'
              - '.claude/skills/gaia/references/debt.md'
              # The difficulty-grading rubric and one of its filing routes, and
              # the code-audit roster several .gaia/tests/lib/ doc-conformance
              # suites derive from. The `.claude/agents/**/*.md` root above
              # already covers the roster; this glob names it so that narrowing
              # that root cannot silently drop it, and it self-maintains when a
              # new member joins.
              - '.claude/skills/file-tech-debt/SKILL.md'
              - '.claude/skills/gaia/references/cleanse.md'
              - '.claude/agents/code-audit-*.md'
              # main-only-lib.bats (.gaia/scripts/tests/) renders this doc's
              # fenced block and names it.
              - '.claude/commands/setup-gaia.md'
              # The suites themselves. A changed suite always selects itself.
              # The catch-all also reaches the gate scripts at the top of
              # .gaia/tests/ and every .gaia/tests/**/*.sh the array-guard lint
              # scans; the narrower entries stay listed so each documents its own
              # test-dir/source-dir pairing.
              - '.gaia/tests/forensics/**'
              - '.gaia/tests/hooks/**'
              - '.gaia/tests/lib/**'
              - '.gaia/tests/**'
              # The forensics reference pages and scripts the forensics suites
              # read, naming each.
              - '.claude/skills/gaia/references/forensics*'
              - '.github/forensics/**'
              # The statusline suites (.gaia/tests/statusline/) exercise the
              # shipped statusline and real copies of the refreshers that feed
              # it (.gaia/scripts/check-updates.sh, debt-count-refresh.sh, under
              # the .gaia/scripts/** glob above), and read codify.md as real
              # repo text. Each names the file it copies or reads.
              - '.gaia/statusline/**'
              - '.gaia/tests/statusline/**'
              - '.claude/skills/gaia/references/codify.md'
              # workflow-filter-coverage.bats reads every workflow in
              # .github/workflows/; its live-tree tests carry the whole-tree
              # mark. The glob self-maintains as workflows are added.
              - '.github/workflows/**'
              # The rest of .github/: lint-errexit-status-read.sh scans every
              # tracked `*.sh` under it (whole-tree marked), and the issue
              # templates, pull request template, CODEOWNERS and FUNDING.yml are
              # read by the suites that name them.
              - '.github/**'
              - '.gaia/audit-ci.yml'
              # The INV-7 concurrency meter (.gaia/tests/concurrency/) and the
              # sources it drives. Most are already listed above -- it copies
              # .claude/hooks/**, .gaia/scripts/**, .gaia/statusline/** and
              # .gaia/scripts/spec/** into its fixtures at their real
              # repo-relative paths -- but these three are not, and each is a
              # source the meter reads:
              #   state-registry.json  copied into every fixture, so a
              #     registry edit changes what the meter observes.
              #   .gaia/cli/src/**  C3-05 runs the real TypeScript storage
              #     functions through the CLI's tsx; C5-03's call-site check
              #     greps the wiki and release command surfaces.
              #   .claude/commands/gaia-release.md  the other surface C5-03
              #     greps for a resolver consult.
              # The install inputs (the root lockfile, workspace file and
              # manifest, .node-version and .npmrc, and the frontend and CLI
              # manifests) are below, the same list as
              # `bash .gaia/tests/bats-change-scope.sh --list-install-inputs`. A
              # dependency bump touches only them, and it runs the selector's
              # picks plus every suite marked as reading installed dependencies
              # against the new install, the concurrency meter among the legs it
              # arms.
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - '.node-version'
              - '.npmrc'
              - 'frontend/package.json'
              - '.gaia/cli/package.json'
              - '.gaia/tests/concurrency/**'
              - '.gaia/state-registry.json'
              - '.gaia/cli/src/**'
              - '.claude/commands/gaia-release.md'
              # branch-name-lib.bats and usage-resolve.bats pin the branch
              # validator's and the issue-link regex's type lists to the shared
              # type file, and name it.
              - '.gaia/conventional-commits.json'
              # githooks-pre-commit.bats reads the lint-staged config (every
              # pre-commit arm matched by an ESLint glob) and the package
              # descriptor's preCommitSource globs; settings-drift.bats reads
              # the generated settings and the overlay it is built from;
              # dockerfile-contract.bats reads the Dockerfile pair and the
              # package manifests, and pins every dotenv file out of the image
              # context. Each suite names the file it reads.
              - 'frontend/.lintstagedrc.json'
              - 'frontend/gaia.package.json'
              - 'frontend/.claude/settings.json'
              - 'frontend/.claude/settings.overlay.json'
              - 'frontend/Dockerfile'
              - 'frontend/Dockerfile.dockerignore'
              # frontend-rule-globs.bats reads every frontend rule (whole-tree
              # marked), main-only-lib.bats names the perf skill it renders,
              # and doc-noop-terminal-contract.bats searches the whole tree for
              # dispatch-prompt carriers (whole-tree marked). Suites reading
              # the frontend rules router name it.
              - 'frontend/.claude/**'
              - 'frontend/CLAUDE.md'
              # Every wiki page, the executed ones (PR Merge Workflow, the
              # audit round and gate pages, the disposition, policy-memory and
              # audit-agent pages, the Code Audit Team pages, the fitness page)
              # included. A suite asserting on one page names it; a suite
              # asserting a property of every tracked file carries the
              # whole-tree mark. A wiki sync (wiki/log.md and a rewrite of
              # wiki/.state.json) is the routine case this output exists for.
              - 'wiki/**'
            # The .gaia/tests/sandbox/ conformance tree gets its own filter
            # output rather than joining `code:` above, so a sandbox-only edit
            # arms that leg's own steps without arming the full matrix.
            sandbox:
              # This job's own definition, including the `sandbox:` filter
              # itself and the step conditions it gates. LOAD-BEARING: with no
              # broad glob left in this list, an edit weakening this filter or
              # its gated steps would otherwise not re-run the filter that
              # gates it.
              - '.github/workflows/audit-ci-tests.yml'
              # LOAD-BEARING: .bats, reached by no broad glob.
              - '.gaia/tests/sandbox/**'
              # install-bats.sh is what the sandbox leg's own install step
              # calls. LOAD-BEARING: no other entry in this list reaches it, so
              # without this line an edit to the pinned bats version or digest
              # would report `sandbox=false` and skip that leg's install too.
              - '.gaia/tests/install-bats.sh'
              # The vendored archive that install step extracts. LOAD-BEARING
              # for the same reason as the line above: no other entry reaches a
              # `.tar.gz`, so without this line a change to the archive alone -- the half
              # of a version bump that carries the actual bytes, or a swap of
              # them -- would report `sandbox=false` and skip the leg whose
              # install is what would have caught it at the digest check.
              - '.gaia/tests/vendor/**'
              # The sandbox composition suite asserts the .env deny entries the
              # settings file carries, the hooks that back them, the shared
              # operand grammar those hooks load, and the shared registration
              # assertion it makes them through. Every one of these is
              # LOAD-BEARING, named rather than reached by a directory glob,
              # matching how this list names its other entries. Note that a
              # filter output is evaluated independently of its siblings, so
              # `code:` listing any of these does nothing for this output.
              #
              # The last entry is a transitive one and is here for the same
              # reason as the rest: hook-registration.sh unconditionally sources
              # hook-registration-lib.sh for the regex its assertion matches
              # hook names with, so an edit confined to that lib changes what
              # this suite asserts. workflow-filter-coverage.bats does not read
              # transitive inputs, by its own header, so nothing derives this
              # entry and it is kept by hand like the others. A reader adding a
              # dependency to the helper owes this list the same walk.
              - '.claude/settings.json'
              - '.claude/hooks/block-sensitive-read.sh'
              - '.claude/hooks/lib/reader-operands.sh'
              - '.claude/hooks/lib/hook-payload.sh'
              - '.gaia/tests/helpers/hook-registration.sh'
              - '.gaia/scripts/hook-registration-lib.sh'
            # The commitlint config suite (.gaia/tests/commitlint/) runs the REAL
            # commitlint binary, so it needs the root workspace installed, which
            # the bats shards do not do. It gets its own filter output for the
            # same reason `sandbox` does: a commit-lint-only edit arms this leg
            # without arming the full matrix, and nothing else here reaches it.
            # Every entry is LOAD-BEARING, named rather than reached by a glob
            # on another output: a filter output is evaluated independently of
            # its siblings, and a path missing here reports `commitlint=false`,
            # skips the leg's steps, and greens a declared-required context
            # having run the suite zero times.
            commitlint:
              # This job's own definition, including this filter and the step
              # conditions it gates.
              - '.github/workflows/audit-ci-tests.yml'
              # The suite itself.
              - '.gaia/tests/commitlint/**'
              # The config under test and the type list it reads at load time.
              - 'commitlint.config.mjs'
              - '.gaia/conventional-commits.json'
              # The hook that runs the same config on every commit.
              - '.githooks/commit-msg'
              # The PR conventions workflow whose steps pr-conventions.bats
              # extracts and runs, and the branch validator and plan-type
              # reader those steps call.
              - '.github/workflows/pr-conventions.yml'
              - '.gaia/scripts/branch-name-lib.sh'
              # The PreToolUse hook that runs the same title lint before a PR
              # exists, the libraries it loads, the registration it is checked
              # against, and the helper that check sources.
              - '.claude/hooks/block-invalid-pr-title.sh'
              - '.claude/hooks/lib/jq-availability.sh'
              - '.claude/hooks/lib/hook-payload.sh'
              - '.claude/hooks/lib/verb-arming.sh'
              - '.claude/hooks/lib/verb-arming-walk.sh'
              - '.claude/hooks/lib/repo-scope.sh'
              - '.claude/settings.json'
              - '.gaia/tests/helpers/hook-registration.sh'
              - '.gaia/scripts/hook-registration-lib.sh'
              # The install inputs, every one the change classifier lists:
              # commitlint and its shared config are root devDependencies, so a
              # bump of either, of the toolchain, or of the workspace settings
              # the frozen install obeys changes what the suite runs against,
              # and a member manifest is part of the lockfile the frozen install
              # checks.
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.npmrc'
              - '.node-version'
              - 'frontend/package.json'
              - '.gaia/cli/package.json'
              # The composite action the Node setup step uses.
              - '.github/actions/**'
              # What the leg's own steps invoke: the bats installer and its
              # vendored archive, and the bats5.sh wrapper the run step calls.
              - '.gaia/tests/install-bats.sh'
              - '.gaia/tests/vendor/**'
              - '.gaia/scripts/bats5.sh'
      # What this bats leg will run, decided before anything is installed:
      # `mode` (full, scoped or none) and whether that set needs Node or
      # Chromium. Every bats-leg install step and the run step below gate on it,
      # so a leg with nothing selected installs nothing and greens, and a skipped
      # selection step (a pull request that arms neither `code` nor `scoped`)
      # skips them too. `code`, a push and a manual dispatch plan the whole
      # shard (`--full`); `scoped` alone plans the pull request's net change, the
      # merge commit the checkout holds against its first parent. A non-zero
      # `plan` fails the leg rather than greening it empty.
      - if: matrix.shard != 'sandbox' && matrix.shard != 'concurrency' && matrix.shard != 'commitlint' && (steps.filter.outputs.code == 'true' || steps.filter.outputs.scoped == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        id: selection
        name: Plan this shard's suites
        env:
          SHARD: ${{ matrix.shard }}
          FULL_RUN: ${{ steps.filter.outputs.code == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          MERGE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$FULL_RUN" = true ]; then
            plan="$(bash .gaia/tests/bats-shards.sh plan "$SHARD" --full)"
          else
            plan="$(bash .gaia/tests/bats-shards.sh plan "$SHARD" "$MERGE_COMMIT^1" "$MERGE_COMMIT")"
          fi
          printf '%s\n' "$plan"
          printf '%s\n' "$plan" >> "$GITHUB_OUTPUT"
      # python3-yaml pins the parser (python3+pyyaml) that every
      # `require_yaml_parser` gate on this runner needs. How many suites carry
      # one is deliberately not written down here: a hand-kept count drifts as
      # suites are added, and W10 below already derives the live set from the
      # suites themselves via `shard_package_needs`. Every such gate FAILs
      # rather than `skip`s when GITHUB_ACTIONS is set, precisely so dropping
      # this package reds the run here instead of retiring the invariants
      # behind it, the manual re-run (workflow_dispatch) reachability one and the YAML-write hook's
      # coverage among them, behind `ok ... # skip`. A gate that accepts `yq`
      # as a second parser reds only when neither is present. Those gates are
      # what enforce this line; this comment only explains it. Pin the package
      # here rather than resting on whatever the runner image happens to
      # preinstall.
      #
      # zsh backs four suites under .gaia/scripts/tests/ (audit-key-lib,
      # main-only-lib, usage-lib, branch-name-lib), and those `skip`
      # SILENTLY when it is absent, so its absence looks identical to a clean
      # tree rather than reporting red. That silent-skip hazard is the whole
      # reason the apt step below names the legs it runs on rather than being
      # left uniform: a per-shard package list is only safe while something
      # checks that the named set still covers every leg that draws one of
      # those files, and a reshuffle of the weighted split moves files
      # between legs without touching this file. W10 in .gaia/tests/lib/audit-ci-shards.bats
      # is that check. It recomputes the leg-to-dependency map from the suites
      # themselves and reds when this list and that map disagree, in either
      # direction, which is what converts the reduced set from an assumption
      # into a checked invariant -- the same move W9 already makes for the
      # sandbox leg's empty package set.
      #
      # The bats install runs on every bats leg whose plan selected something,
      # and on the concurrency leg through its own step below; only apt is
      # narrowed by leg. The `sandbox` and `commitlint` legs install bats through
      # their own steps, with no apt line at all, because their suites need
      # neither package (W9 pins that for sandbox). Splitting the install this
      # way, rather than one shared step, is what keeps a docs-only pull request
      # (which arms `sandbox` alone) from running `apt-get update` -- the
      # flakiest operation in this job -- on every leg, and what keeps a bats
      # leg with nothing selected from installing anything.
      # `workflow-filter-coverage.bats` holds install-bats.sh reachable by the
      # outputs that arm the selection step.
      - if: matrix.shard != 'sandbox' && matrix.shard != 'concurrency' && matrix.shard != 'commitlint' && contains(fromJSON('["full","scoped"]'), steps.selection.outputs.mode)
        name: Install pinned bats
        run: bash .gaia/tests/install-bats.sh
      # The concurrency leg has no selection step: its meter runs whole on
      # every armed pull request, a push and a dispatch, and `meter-gate.sh`
      # needs bats.
      - if: matrix.shard == 'concurrency' && (steps.filter.outputs.code == 'true' || steps.filter.outputs.scoped == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        name: Install pinned bats for the concurrency meter
        run: bash .gaia/tests/install-bats.sh
      # python3-yaml pins the parser (python3+pyyaml) rather than resting on
      # whatever the runner image happens to preinstall, and it is installed
      # beside zsh on the same legs rather than on a list of its own: two
      # narrowly-gated apt steps would pay `apt-get update` twice on every leg
      # needing both, which is most of this list.
      #
      # The list is not hand-picked. It is the set of shards holding a suite
      # that reaches for either dependency, by the four patterns W10 names,
      # rounded up to whole EXCHANGE GROUPS: if any leg of a weighted group
      # needs a package, every leg of that group is listed. Every shard outside
      # such a group runs no apt at all. The suites behind it are deliberately
      # NOT enumerated here; to see the current membership, run
      # `shard_package_legs` out of .gaia/tests/lib/audit-ci-shards.bats.
      #
      # Rounding up is what stops this list churning. Which leg of a group
      # holds which suite is decided by the sharder's weighted assignment, by
      # FILE SIZE, so the un-rounded set moves whenever any suite in the group
      # changes size, for a reason with no relationship to the packages: it
      # moved three times on one branch because an unrelated suite beside the
      # one needing suite grew. A group is the set of legs a file can move
      # between without anyone editing the sharder, so the rounded set moves
      # only when a suite's dependency really changes, which is the event worth
      # an edit here.
      #
      # The cost is one apt on the legs of a needing group that hold no needing
      # suite themselves, and it has two halves. Runtime: an over-match costs
      # seconds, an under-match silently retires a suite's assertions, and that
      # trade is the one this whole scan already prefers. Blast radius: every
      # listed leg joins the concurrent `apt-get update` burst, where a mirror
      # hash-sum mismatch on any one of them reds `Audit CI Tests`, a
      # declared-required context. `wiki/decisions/Sharded CI Test Matrix.md` prices that second
      # half and is the place to weigh any further widening; it is not
      # seconds-cheap the way the first half is.
      #
      # Do not edit this list by hand to make W10 pass: W10 failing means a
      # suite's dependency changed or a group's membership did, and the repair
      # is to copy the set W10 names, which it derives from the suites and the
      # sharder's own groups rather than from here.
      - if: contains(fromJSON('["lib", "scripts-1", "scripts-2", "scripts-3", "scripts-4"]'), matrix.shard) && contains(fromJSON('["full","scoped"]'), steps.selection.outputs.mode)
        name: Install the YAML parser and zsh
        # Sized for fast failure and honest attribution, NOT to the leg. When
        # this cap fires is the budget paragraph's subject, not this one's,
        # because the answer is not "after every attempt". A leg that fails
        # here reds `Audit CI Tests`
        # (.gaia/scripts/verify-required-checks.sh names it required) and that
        # leg's tests do not run.
        #
        # The budget is what makes three attempts reachable: 3 x (45 + 45) of
        # apt plus 30 of backoff is 300, inside this 360. Read 300 as the
        # intended shape, not a ceiling. `timeout` REQUESTS termination, and
        # dpkg defers SIGTERM while unpacking, so a per-call bound can be
        # overrun and this step cap is the only bound that always holds.
        # `-k` would make it a ceiling and is deliberately not used: SIGKILL
        # mid-dpkg leaves an interrupted state that fails attempts 2 and 3
        # outright, which is worse than overrunning into this cap.
        #
        # Why every apt call is wrapped in `timeout` rather than left to
        # Acquire::*::Timeout: those options bound a STALLED transfer, and the
        # failure actually observed here is not a stall. The runner's mirror
        # list puts azure.archive.ubuntu.com first, that host answers `Ign:`
        # within seconds, apt falls back to archive.ubuntu.com and gets a
        # clean `Hit:`, and the time is then spent AFTER a successful
        # connection, where a per-connection timeout has nothing to break. A
        # single `apt-get update` consumed the entire step budget twice, and
        # neither run ever printed an `apt attempt N of 3 failed` line: the cap
        # fired inside attempt 1 and attempts 2 and 3 were unreachable, so the
        # retry absorbed nothing on the one failure it exists for. Bounding the
        # call itself is what makes the loop reachable, whichever mirror is the
        # one misbehaving.
        timeout-minutes: 6
        # Bounded three times, because the three bounds catch different
        # failures and none is sufficient alone: `Acquire::*::Timeout` per
        # connection, `timeout` per call, and `timeout-minutes` per step.
        #
        # `Acquire::*::Timeout` ends a STALLED connection in seconds rather
        # than letting it hold. It bounds a connection, never a call: with
        # `Acquire::Retries=2` one dead URI is three tries of 20, so a single
        # apt call can still run past its 45s wrapper and be killed there.
        # These knobs do NOT make the retry reachable, which is the per-call
        # `timeout` above's job: they were the only bound on a call for two
        # runs, and both spent the whole step budget in attempt 1 because the
        # failure was never a stall. Both the `http` and `https` knobs are set
        # because the option is keyed on the acquire method, not on the scheme
        # the loop happens to hit.
        #
        # Three attempts because an archive.ubuntu.com stall is transient:
        # re-running an identically-stalled leg by hand passes it in a
        # fraction of the time it hung for. A genuine mirror outage still
        # fails red rather than hanging, three short attempts later.
        #
        # A bounded shell retry rather than a marketplace retry action: this
        # repository vendors its pinned bats and keeps its composite actions
        # local under .github/actions/, so a third-party action here would be
        # the only dependency of its kind, pinned and reviewed for a loop bash
        # states in ten lines.
        run: |
          set -euo pipefail
          apt_opts=(-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
          # `sudo timeout`, not `timeout sudo`: the latter signals sudo and can
          # leave the apt child running past the bound, which is the bound not
          # holding. Exit 124 is timeout's own "I killed it", reported so a log
          # reader can tell a bounded attempt from a failed one.
          apt_bounded() {
            local what="$1"; shift
            local rc=0
            sudo timeout 45 "$@" || rc=$?
            if [ "${rc}" -eq 124 ]; then
              echo "apt ${what} exceeded its 45s bound" >&2
            fi
            return "${rc}"
          }
          for attempt in 1 2 3; do
            if apt_bounded update apt-get "${apt_opts[@]}" update \
              && apt_bounded install apt-get "${apt_opts[@]}" install -y python3-yaml zsh; then
              exit 0
            fi
            echo "apt attempt ${attempt} of 3 failed" >&2
            if [ "${attempt}" -lt 3 ]; then
              sleep $((attempt * 10))
            fi
          done
          echo "apt-get failed after 3 attempts; python3-yaml and zsh are unavailable" >&2
          exit 1
      # No apt at all: the sandbox tree provably needs neither python3-yaml nor
      # zsh (W9 above), so this leg only needs the pinned bats binary. A PR
      # that arms `sandbox` alone therefore runs no apt at all, instead of the
      # exposure a single shared install step on every leg would carry.
      - if: matrix.shard == 'sandbox' && (steps.filter.outputs.sandbox == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        name: Install bats
        run: bash .gaia/tests/install-bats.sh
      # The commitlint leg: no apt (the suite needs neither python3-yaml nor
      # zsh; `jq` ships on the runner image), the pinned bats, and the ROOT
      # package's dependencies only. Gated on `commitlint` rather than `code`,
      # so a PR touching only a file this suite reads runs it without arming
      # the other legs. A `workflow_dispatch` run has no filter output and runs
      # every step, as on the other legs.
      - if: matrix.shard == 'commitlint' && (steps.filter.outputs.commitlint == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        name: Install pinned bats for the commitlint suite
        run: bash .gaia/tests/install-bats.sh
      # `install: none` and a filtered install of our own, because the
      # composite's `root` arm is a plain `pnpm install --frozen-lockfile`,
      # which also installs the frontend workspace this suite never touches.
      # `--filter .` is the root importer alone (commitlint and its shared
      # config are root devDependencies); the lockfile stays frozen. The
      # composite is still the right caller: the next step runs pnpm itself, so
      # the store its cache step saves exists.
      - if: matrix.shard == 'commitlint' && (steps.filter.outputs.commitlint == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        name: Setup Node for the commitlint suite
        uses: ./.github/actions/gaia-setup-node
        with:
          install: none
          cache-dependency-path: pnpm-lock.yaml
      - if: matrix.shard == 'commitlint' && (steps.filter.outputs.commitlint == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        name: Install the root workspace only
        run: pnpm install --frozen-lockfile --filter .
      # One root install on THIS leg provisions both things the meter needs:
      # the root dependencies C4-04 and C4-07 resolve `typescript` from, and
      # the CLI member's node_modules, which C3-05 needs because it runs the
      # CLI's own tsx binary out of .gaia/cli/node_modules (gitignored, so
      # absent on a fresh checkout). Skipping the install flips a landed, green
      # scenario red for want of an npm install, which would read as a
      # regression in the number this program is judged by rather than as the
      # environment gap it is.
      #
      # This step is scoped to the `concurrency` leg, but Node itself is NOT
      # this leg's alone. It used to say so -- "no bats suite in any other
      # shard depends on a Node runtime or an installed workspace dependency,
      # which is what makes it safe for those legs to run on a box that never
      # sets Node up at all" -- and that was false the whole time: a group of
      # suites under .gaia/tests/hooks drives the RED signal helper and the
      # determinism classifier, both of which resolve `typescript` from the
      # repo root.
      # They did not red those legs, they SKIPPED, and a skip reports `ok`, so
      # the belief and the evidence for it were the same silence.
      # gaia-react/gaia#1748. The step below this one is what they need; keep
      # the two separate rather than widening this one's `if:`, because they
      # install different things for different reasons.
      - if: matrix.shard == 'concurrency' && (steps.filter.outputs.code == 'true' || steps.filter.outputs.scoped == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        name: Setup Node and install the workspace
        uses: ./.github/actions/gaia-setup-node
        with:
          install: root
          cache-dependency-path: pnpm-lock.yaml
      # The root workspace for the suites marked as reading installed
      # dependencies (`# bats file_tags=installed-dependencies`): the RED
      # signal and determinism suites, which resolve `typescript` through
      # createRequire against the repo root, and the two Chromium suites, which
      # run the frontend's Vitest and Playwright. The plan's `needs_node` is set
      # when the set this leg will run holds one of them, so a change-scoped leg
      # that owes none of them skips the install. The suites are the authority
      # on the set; `.gaia/tests/installed-dependencies-mark-guard.sh` derives it
      # from what they run and fails on a stale or missing mark.
      #
      # THE LEG LIST IS A WHOLE EXCHANGE GROUP, which is what makes it safe to
      # write here. Every such suite the guard lists as unprovisioned elsewhere
      # lives in HOOKS_DIRECTORY and none is pinned, so bats-shards.sh assigns
      # them across HOOKS_GREEDY_IDS -- hooks-2, hooks-3 and hooks-4 -- and a
      # reshuffle moves a file BETWEEN those three and never out of them. A
      # marked suite another workflow provisions (its backstop line names that
      # workflow) needs no install here. audit-ci-shards.bats derives the list
      # from the guard's `--list-derived` minus `--list-backstopped`, rounded up
      # to whole exchange groups, and reds when this one disagrees.
      #
      # The suites fail loudly without the install:
      # .gaia/tests/hooks/helpers/require-node-typescript.sh returns non-zero
      # rather than skipping when GITHUB_ACTIONS is set, and both Chromium
      # suites fail rather than skip when the browser is absent.
      #
      # The cost is bounded by something already on this job rather than by an
      # estimate: it is the same composite action the `concurrency` leg runs,
      # the same install, with the pnpm store cached the same way.
      - if: contains(fromJSON('["hooks-2", "hooks-3", "hooks-4"]'), matrix.shard) && contains(fromJSON('["full","scoped"]'), steps.selection.outputs.mode) && steps.selection.outputs.needs_node == '1'
        name: Setup Node for the node-dependent RED suites
        uses: ./.github/actions/gaia-setup-node
        with:
          install: root
          # The root install also provisions the CLI member, and the cache key
          # stays the root lockfile: the CLI member has no lockfile of its own.
          cache-dependency-path: pnpm-lock.yaml
      # Two suites run a real Chromium: the story-name equality suite (the
      # storybook Vitest project) and the UAT lifecycle suite (Playwright over
      # a rendered spec). The plan's `needs_chromium` is derived from the set
      # this leg will run, not written as a shard name: a suite moves between
      # legs as the weighted split re-balances, and a hard-coded shard name
      # would arm the install on the wrong leg. Only the legs that install the
      # root workspace can hold them.
      #
      # No `--with-deps`: the ubuntu-latest image already carries every shared
      # library headless Chromium loads, so the flag only upgrades a few of them
      # and adds fonts, through an apt mirror that can stall for minutes and
      # take this leg past `timeout-minutes` with every test green.
      - if: contains(fromJSON('["hooks-2", "hooks-3", "hooks-4"]'), matrix.shard) && contains(fromJSON('["full","scoped"]'), steps.selection.outputs.mode) && steps.selection.outputs.needs_chromium == '1'
        name: Install Chromium for the Chromium suites
        run: pnpm -C frontend exec playwright install chromium
      # One run step per exchange group, because each group's runtime differs
      # and a step's `timeout-minutes` has to be an integer literal (W5 refuses
      # an expression, so a per-leg value cannot come from the matrix). Each
      # literal is the group's measured whole-shard p95 with headroom, so a
      # hung leg fails at its own bound rather than at the job's. The three leg
      # lists partition the sharder's shards; audit-ci-shards.bats checks that
      # every bats leg reaches exactly one of them.
      #
      # `${{ matrix.shard }}` and the plan's mode reach the script only through
      # `env:`, never interpolated into the run: body text itself -- the shape
      # this repo's workflows auditor checks.
      #
      # `full` runs the whole shard; `scoped` runs the shard's change-scoped
      # share. On a pull_request event github.sha is the merge commit the
      # checkout holds, and its first parent is the base it merges into, so
      # that pair is the pull request's net change as it would land, the same
      # pair the selection step planned.
      - if: contains(fromJSON('["hooks-2", "hooks-3", "hooks-4"]'), matrix.shard) && contains(fromJSON('["full","scoped"]'), steps.selection.outputs.mode)
        name: Run a bats shard (hooks group)
        timeout-minutes: 9
        env:
          SHARD: ${{ matrix.shard }}
          PLAN_MODE: ${{ steps.selection.outputs.mode }}
          MERGE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$PLAN_MODE" = full ]; then
            bash .gaia/tests/bats-shards.sh run "$SHARD"
          else
            bash .gaia/tests/bats-shards.sh run-for-change "$SHARD" "$MERGE_COMMIT^1" "$MERGE_COMMIT"
          fi
      - if: contains(fromJSON('["scripts-1", "scripts-2", "scripts-3", "scripts-4"]'), matrix.shard) && contains(fromJSON('["full","scoped"]'), steps.selection.outputs.mode)
        name: Run a bats shard (scripts group)
        timeout-minutes: 12
        env:
          SHARD: ${{ matrix.shard }}
          PLAN_MODE: ${{ steps.selection.outputs.mode }}
          MERGE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$PLAN_MODE" = full ]; then
            bash .gaia/tests/bats-shards.sh run "$SHARD"
          else
            bash .gaia/tests/bats-shards.sh run-for-change "$SHARD" "$MERGE_COMMIT^1" "$MERGE_COMMIT"
          fi
      - if: contains(fromJSON('["hooks-1", "audit", "lib", "misc"]'), matrix.shard) && contains(fromJSON('["full","scoped"]'), steps.selection.outputs.mode)
        name: Run a bats shard (single-shard legs)
        timeout-minutes: 12
        env:
          SHARD: ${{ matrix.shard }}
          PLAN_MODE: ${{ steps.selection.outputs.mode }}
          MERGE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$PLAN_MODE" = full ]; then
            bash .gaia/tests/bats-shards.sh run "$SHARD"
          else
            bash .gaia/tests/bats-shards.sh run-for-change "$SHARD" "$MERGE_COMMIT^1" "$MERGE_COMMIT"
          fi
      # The sandbox-enablement conformance tree, on its own leg with its own
      # filter output. Gated on `sandbox` rather than `code`, so a PR touching
      # only a file this tree reads runs it without arming the Node install or
      # the concurrency meter's leg. Invoked through run-all.sh, matching the
      # contract that script documents in its own header.
      - if: matrix.shard == 'sandbox' && (steps.filter.outputs.sandbox == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        name: Run .gaia/tests/sandbox bats suites
        timeout-minutes: 2
        run: bash .gaia/tests/sandbox/run-all.sh
      # Runs the WHOLE suite and fails on any scenario that does not report
      # an unconditional `ok` (a `skip` counts as a failure).
      - if: matrix.shard == 'concurrency' && (steps.filter.outputs.code == 'true' || steps.filter.outputs.scoped == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        name: Run the INV-7 concurrency meter
        timeout-minutes: 2
        run: bash .gaia/tests/concurrency/meter-gate.sh
      # The suites fail in setup_file when commitlint is absent rather than
      # skipping, so a leg whose install silently produced nothing reds here.
      # The directory is run whole: the non-shard allowlist excuses every
      # suite under it on the strength of this step.
      - if: matrix.shard == 'commitlint' && (steps.filter.outputs.commitlint == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        name: Run the commitlint suites
        timeout-minutes: 2
        run: bash .gaia/scripts/bats5.sh .gaia/tests/commitlint/

  # The declared-required check. `needs: [shards]` makes it the second hop of
  # a 2-hop chain the arithmetic above is sized to, and `always()` is what
  # stops a plain skip-on-dependency-failure from satisfying nothing: a
  # `needs:` with no `if:` SKIPS when a dependency fails, and a skipped stamp
  # satisfies no required check.
  audit-ci-tests:
    name: Audit CI Tests
    needs: [shards]
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # No checkout and no scopes: this job reads its `needs:` results and
    # exits, so it needs nothing a default-deny leaves it without. Stated
    # without a count, which goes stale the next time a job joins `needs:`.
    permissions: {}
    steps:
      # The `shards` result is the aggregate over every matrix leg: it reads
      # `success` only when every leg concluded `success`. A leg whose steps
      # all skipped, because the filter resolved false or its plan selected
      # nothing, still concludes `success`, which is correct -- a PR touching
      # nothing a leg's suites read should report this check green having run
      # nothing there.
      # `skipped` and `cancelled` both fail this check, along with
      # `failure`, because each comparison is `!= "success"` rather than a
      # `case` enumerating the failure states it knows about, so a conclusion
      # GitHub adds later fails closed instead of reading as an unrecognized,
      # unhandled success.
      - name: Require every dependency in needs to have concluded success
        env:
          SHARDS_RESULT: ${{ needs.shards.result }}
        run: |
          if [ "$SHARDS_RESULT" != "success" ]; then
            echo "::error::at least one shard did not conclude success: $SHARDS_RESULT" >&2
            exit 1
          fi

  # Keeps one `ci-red-main` issue open while main is red: a failed push run
  # opens it or comments on it, and a green push run on the red commit or a
  # descendant closes it. Push to main only; a pull request or a dispatch
  # verdict is not main's. The logic, and its tests with a stubbed `gh`, live
  # in .gaia/tests/report-main-status.sh; this job only hands it the run's
  # facts.
  report-main-status:
    name: Report main status
    needs: [shards]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # The only write scope in this workflow. `contents: read` for the
    # checkout, `issues: write` to open, comment on and close the issue, and
    # `actions: read` for the jobs listing that names the failing legs, since
    # `needs.shards.result` is one aggregate value.
    permissions:
      contents: read
      issues: write
      actions: read
    # One static group serializes the reporters, so two red runs finishing
    # together cannot both see no open issue and both open one. GitHub keeps
    # one pending run per group, so a pending reporter replaced by a newer
    # one loses only an intermediate verdict: the newer run tests a superset
    # of that commit, and its result opens, comments on or closes the issue
    # in its place.
    concurrency:
      group: audit-ci-tests-main-status-report
      cancel-in-progress: false
    steps:
      # The reporter is the only file this job needs, and the token never has
      # to reach git, so the checkout persists no credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      # Every value reaches the script through `env:`, and none of them is
      # free text from the event: the issue's title and body are built from
      # SHAs, run ids and the jobs listing only.
      - name: Open, update or close the red-main issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          SHARDS_RESULT: ${{ needs.shards.result }}
        run: bash .gaia/tests/report-main-status.sh
