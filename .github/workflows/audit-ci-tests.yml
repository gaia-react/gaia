name: Audit CI Tests

# Runs the bats suites for the .github/audit/ helpers that
# code-review-audit.yml consumes, check-trailer.sh (skip-logic gate) and
# resolve-audit-base.sh (incremental review base), plus the
# pr-merge-audit-check.sh PreToolUse merge hook (GAIA-Audit status reader).
# Maintainer-only:
# adopters receive these as GAIA-controlled (`owned`) code they never
# modify, so the suite only catches regressions from maintainer edits.
# Mirrors cli-tests.yml's narrow-surface, paths-filtered, step-gated shape.
#
# The last step is the odd one and is deliberate: the INV-7 concurrency meter
# (.gaia/tests/concurrency/) admits scenarios that are red by design, belonging
# to phases that have not run yet, so it is gated through meter-gate.sh against
# a checked-in expected-status manifest rather than on its own exit status. A
# green here means every scenario did exactly what the manifest says it does --
# an expected-pass going red AND an expected-red going green both fail the
# build. The manifest, not this comment, is the authority on which scenarios
# are which, and how many of each there are at any moment.
# See .gaia/tests/concurrency/README.md.
#
# Pinned action SHAs match .github/workflows/cli-tests.yml:
#   actions/checkout    @ 3d3c42e5aac5ba805825da76410c181273ba90b1 (v7.0.1)
#   dorny/paths-filter  @ ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d (v4.0.3)
#   pnpm/action-setup   @ 0977fd99725f1db4007ccb2928dbb4e90d06cc86 (v6.0.10)
#   actions/setup-node  @ 820762786026740c76f36085b0efc47a31fe5020 (v7.0.0)

# `workflow_dispatch:` is the CI-mode self-heal lane. A GITHUB_TOKEN-authored
# self-heal push fires no `pull_request` event, so code-review-audit.yml
# re-dispatches the workflows named in `.gaia/audit-ci.yml`'s
# `retrigger_workflows` and stamps each dispatched run's per-JOB conclusion onto
# the new HEAD. `Audit CI Tests` below is a declared-required context, so
# without this trigger -- and without the job admitting it in its `if:` -- the
# check is absent on the self-heal HEAD and branch protection blocks the merge.
# Same shape as cli-tests.yml; .gaia/scripts/tests/retrigger-reachability.bats
# guards the invariant for every declared-required context. As there, GitHub
# honors the trigger only for the default-branch copy of this file, so a
# dispatch fails with 422 until it lands on main.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default-deny, so a job added later inherits no scope rather than the
# repository default. Each job below grants exactly what it needs.
permissions: {}

jobs:
  # The fan-out matrix: one leg per bats shard, plus the sandbox conformance
  # tree and the INV-7 concurrency meter as two further legs that run their
  # own runners under their own filter gates. `audit-ci-tests` below is the
  # thin aggregator that carries the declared-required check name; splitting
  # the name off this job is what lets `fail-fast: false` keep one failing
  # shard from cancelling its siblings without also cancelling the check
  # itself.
  shards:
    name: shard ${{ matrix.shard }}
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # 13 minutes is sized to the heaviest leg, `concurrency`: it runs the two
    # full pnpm workspace installs and the meter's real git worktrees, the
    # work today's shared 15-minute cap was sized for. A matrix takes ONE
    # integer cap for every leg, so the lighter shards inherit it too. Paired
    # with the aggregator's 2-minute cap this sums to 15 over the 2-hop
    # `needs:` chain .gaia/scripts/tests/retrigger-reachability.bats checks,
    # which is the maximum this repo's 25-minute self-heal poller window
    # allows at 2 hops -- zero headroom, so raising either cap or adding a
    # third hop reds that suite immediately.
    timeout-minutes: 13
    # Read-only token: the job checks out, resolves changed files via
    # dorny/paths-filter, and runs bats or the sandbox/concurrency runners; it
    # needs no write scopes.
    #
    # `pull-requests: read` is load-bearing, not decoration: naming any scope
    # here sets every unlisted one to `none`, and dorny/paths-filter resolves a
    # PR's changed files through the API, which needs it. Omitting it works only
    # while this repo is public; the day it went private, every run would 403
    # with "Resource not accessible by integration". Mirrors shell-lint.yml,
    # which runs the same action on the same trigger.
    permissions:
      contents: read
      pull-requests: read
    # `fail-fast: false` is load-bearing, not a default preference: one failing
    # shard must not cancel its siblings, or the aggregator adjudicates a
    # partial picture and a re-run loses information about every leg GitHub
    # cancelled rather than ran. The matrix values are the bats-shards.sh shard
    # ids plus the two workflow-level legs; audit-ci-shards.bats' W6 checks the
    # two stay in sync.
    strategy:
      fail-fast: false
      matrix:
        shard: [hooks-1, hooks-2, hooks-3, hooks-4, scripts-1, scripts-2, scripts-3, audit, lib, misc, sandbox, concurrency]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # PRs that don't touch the audit scripts report this check green
      # without installing or running anything.
      #
      # paths-filter resolves changed files from the pull-request context, which
      # a `workflow_dispatch` run does not have, so the dispatch lane skips this
      # step and every step below falls back to running unconditionally. That is
      # the intent of a re-trigger: it exists to produce a real green on the
      # self-heal HEAD, and a full run is the only thing that proves one.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            code:
              - '.github/audit/**'
              # This job's own definition. The filter above, the step conditions
              # below and the bats invocations they arm all live here, so an edit
              # to this file changes what every suite in this job runs, and
              # retrigger-reachability.bats reads it as one of the workflows it
              # scans. Redundant today: the `.github/workflows/**` catch-all below
              # already matches it. Listed deliberately anyway, the same
              # convention the `sandbox:` filter uses for its own redundant
              # entries, so that narrowing that glob later cannot silently drop
              # this file. It is documentation of the self-coverage, not the thing
              # arming it.
              - '.github/workflows/audit-ci-tests.yml'
              # ci-status-member-gate.bats EXECUTES `run:` bodies extracted from
              # code-review-audit.yml, so that workflow is a source this suite
              # guards, not just a consumer of it. Its structural lock pins the
              # set of steps that POST a `pending` GAIA-Audit status and fails on
              # an unguarded new one. Redundant today: the `.github/workflows/**`
              # catch-all below already matches it. Listed deliberately anyway,
              # the same convention the `sandbox:` filter uses for its own
              # redundant entries, so that narrowing that glob later cannot
              # silently drop this source. It is documentation of the test-dir/
              # source-dir pairing, the same pairing as the three instruction
              # files below, not the thing arming it.
              - '.github/workflows/code-review-audit.yml'
              # distribution-audit-pr-gate.bats (.gaia/scripts/tests/) EXECUTES
              # the `run:` body extracted from distribution-audit-pr.yml, so that
              # workflow is a source this suite guards rather than a file it
              # merely mentions. Redundant today: the `.github/workflows/**`
              # catch-all below already matches it, and `.gaia/scripts/**` arms
              # the suite a second way. Listed deliberately anyway, the same
              # convention the `sandbox:` filter uses for its own redundant
              # entries, so that narrowing either glob later cannot silently drop
              # this source. It is documentation of the pairing, not the thing
              # arming it.
              - '.github/workflows/distribution-audit-pr.yml'
              # '.claude/hooks/**' is the superset of the specific hooks this
              # suite used to filter on (repo-scope.sh, pr-merge-audit-check.sh,
              # post-audit-status.sh); it now also covers every hook exercised
              # by the .gaia/tests/hooks/ suites below.
              - '.claude/hooks/**'
              # Every file under .claude/rules/ is gate machinery, so each one
              # must land in exactly one tier of the reset-predicate partition,
              # and audit-rules-changed-complete.bats (.gaia/scripts/tests/) is
              # the only thing that runs that partition check. A pull request
              # adding a rule file and nothing else matches no other pattern
              # here, so without this line it reports `code=false`, skips every
              # bats step, and greens the job on an already-broken partition --
              # the red then lands on the next unrelated pull request that
              # happens to touch .claude/hooks/** or .gaia/scripts/**.
              - '.claude/rules/**'
              # husky-pre-commit.bats (.gaia/tests/hooks/) runs the real
              # .husky/pre-commit and asserts which staged paths reach the
              # Quality Gate floor. That hook lives outside every other path
              # here, so without this line the edit the suite exists to catch --
              # an arm added to or dropped from the change-detection guard --
              # would report `code=false`, skip every bats step, and green the
              # job having run the suite zero times.
              - '.husky/**'
              - '.gaia/scripts/**'
              # check-main-root-derivation.bats (.gaia/scripts/tests/) scans
              # tracked source for a hand-rolled main-checkout derivation, and
              # settings.json is one of the files that scan reads: hook commands
              # live there as inline shell. It matches no other pattern here, so
              # without this line a change that inlines a derivation into
              # settings.json alone would skip every bats step and green the job
              # having run that scan zero times.
              - '.claude/settings.json'
              # check-wiki-state-collision.bats (.gaia/scripts/tests/) asserts
              # that wiki/.state.json stays tracked and that no merge driver is
              # bound to it, which is what keeps a cross-branch collision on the
              # single recorded sha a conflict rather than a silent overwrite.
              # Those are exactly the two files the check reads, and both match
              # nothing else here, so without these lines the edits the check
              # exists to catch -- untracking the state file, or adding a
              # .gitattributes that resolves it automatically -- would skip every
              # bats step and green the job having run that scan zero times.
              # .gitattributes is listed at both depths because git honors a
              # nested one and a root-level glob would not match it.
              - 'wiki/.state.json'
              - '.gitattributes'
              - '**/.gitattributes'
              # debt-origin-contract.bats (.gaia/scripts/tests/) asserts the
              # tech-debt rollout command is byte-identical between its two
              # homes, one of which is CHANGELOG.md, so that file's CONTENT is a
              # source this suite guards rather than a file it merely mentions.
              # It matches nothing else here, so without this line a
              # CHANGELOG-only edit to that fence -- trimming the entry, dropping
              # the --limit that keeps the sweep off a default page size -- would
              # report `code=false`, skip every bats step, and green the job
              # having run that comparison zero times. Same test-source pairing
              # as code-review-audit.yml above.
              - 'CHANGELOG.md'
              # shell-lint.bats (.gaia/scripts/tests/) asserts the wiring of the
              # local shell gate .gaia/tests/shell-lint.sh -- its .husky/*
              # discovery pass and its lint-hook-array-guard.sh invocation. The
              # gate sits at the top of .gaia/tests/, matching none of the four
              # .gaia/tests/*/ globs below, so without this line an edit dropping
              # one of those passes would report `code=false`, skip every bats
              # step, and green the job having run the assertions written to catch
              # that edit zero times. shell-lint.yml does not backstop it: a gate
              # that lints fewer files reports fewer findings, so a dropped pass
              # looks identical to a clean tree. Same test-dir/source-dir pairing
              # as the entries above.
              - '.gaia/tests/shell-lint.sh'
              # run-bats-parallel.sh drives the same partition
              # the shard steps below invoke via .gaia/tests/bats-shards.sh,
              # but it is not itself a bats step. It remains the hand-run
              # entry point for that partition, and its own adversarial suite
              # (.gaia/tests/lib/run-bats-parallel.bats, already listed
              # below) sources it directly to read builtin_table() back out.
              # It sits at the top of .gaia/tests/, matching none of the four
              # .gaia/tests/*/ globs below. Redundant today: the
              # `.gaia/tests/**` catch-all below already matches it, the same
              # as the vendored-archive entry further down. Listed
              # deliberately anyway, because that catch-all carries a standing
              # motive to be narrowed -- its own comment records that it arms
              # the full matrix, two pnpm installs included, on any
              # `.gaia/tests` change. A narrowing that dropped this path would
              # leave a runner-only edit reporting `code=false`, skipping every
              # bats step, and greening the job having run that suite's
              # assertions against a stale copy.
              - '.gaia/tests/run-bats-parallel.sh'
              # bats-shards.sh is what every non-sandbox, non-concurrency
              # shard's bats step below invokes, and it sits at the top of
              # .gaia/tests/ too, matching none of the four .gaia/tests/*/
              # globs below, the same reasoning as the two entries above.
              # Without this line an edit to the sharder -- its weighted
              # split, its directory seam, its pinned-hook check -- would
              # report `code=false`, skip every shard's bats step, and green
              # the job having run the suites zero times.
              - '.gaia/tests/bats-shards.sh'
              # install-bats.sh is what the two install steps below call.
              # Listed here for the `code` output; it is ALSO required in
              # `sandbox:` below, because that output reaches no `.sh` outside
              # `.gaia/tests/sandbox/` and the sandbox leg's own install step
              # calls this script too. Without this line here, an edit to the
              # pinned bats version or digest would report `code=false` and
              # skip every non-sandbox leg's install.
              - '.gaia/tests/install-bats.sh'
              # The vendored archive that install extracts. Redundant today:
              # the `.gaia/tests/**` catch-all below already matches it.
              # Listed deliberately anyway, the same convention the entry
              # above and the `sandbox:` ones use, because that catch-all
              # carries a standing motive to be narrowed -- its own comment
              # records that it arms the full matrix, two pnpm installs
              # included, on any `.gaia/tests` change. A narrowing that
              # dropped the archive would leave a vendor-only edit skipping
              # every non-sandbox install, and the digest check that would
              # have caught a swapped blob runs inside exactly that install.
              - '.gaia/tests/vendor/**'
              # The audit-guard-structural suite (.gaia/scripts/tests/) greps the
              # prose of these three instruction files for the no-op-guard wiring
              # (SPEC-025 plan DP-005). An instruction-only edit touches none of
              # the source dirs above, so without these three paths the suite
              # would not re-trigger on drift of the surfaces it guards.
              - '.claude/skills/gaia/references/spec.md'
              - '.claude/skills/gaia/references/plan.md'
              - '.claude/agents/code-audit-frontend.md'
              # The doc-isolation suite (.gaia/tests/lib/) renders the prompt out
              # of the shared isolation reference and greps both callers' pointer
              # wiring, so the fragment and debt.md are sources it guards too.
              # plan.md is already listed above.
              - '.claude/skills/gaia/references/isolation.md'
              - '.claude/skills/gaia/references/debt.md'
              # The doc-difficulty-prose suite (.gaia/tests/lib/) greps the
              # difficulty-grading rubric and both machine filing routes;
              # code-audit-frontend.md and debt.md are already listed above,
              # add the other two. The suite also asserts that `difficulty`
              # appears in NONE of the sibling audit members, so those four are
              # sources it guards too: without the glob, a PR adding grading
              # prose to one of them matches no pattern here, every bats step
              # skips, and the job greens having run the very assertion written
              # to catch that edit zero times. The glob is a superset of the
              # code-audit-frontend.md entry above (patterns OR together) and
              # self-maintains when a new member joins the roster.
              - '.claude/skills/file-tech-debt/SKILL.md'
              - '.claude/skills/gaia/references/audit.md'
              - '.claude/agents/code-audit-*.md'
              # doc-machinery-waive-prose.bats (.gaia/tests/lib/) greps the
              # out-of-scope disposition rule on this page; it is a source the
              # suite guards, and it matches no other pattern here.
              - 'wiki/concepts/PR Merge Workflow.md'
              # The same suite greps this page as the THIRD surface stating
              # the out-of-scope waive rule, and its cross-surface assertions
              # compare all three against each other, so an edit here alone is
              # exactly the drift they exist to catch. It matches no other
              # pattern here: without this entry that edit would report
              # `code=false`, skip every bats step, and green the job having
              # run those assertions zero times.
              - 'wiki/concepts/Audit Disposition and Debt Fix.md'
              # doc-audit-verification-gate.bats (.gaia/tests/lib/) greps this
              # page's description of the classification-verification round.
              # It is the THIRD surface stating the Run-vs-Skip criterion, and
              # the one that drifted: a fix landed on the two audit.md surfaces
              # and left this page asserting the criterion that fix rejected.
              # Same test-dir/source-dir pairing as the line above, and it
              # matches no other pattern here, so without it a wiki-only edit
              # reintroducing the superseded phrasing would report `code=false`,
              # skip every bats step, and green the job having run the very
              # assertion written to catch that edit zero times.
              - 'wiki/concepts/GAIA Audit.md'
              # doc-countability-prose.bats (.gaia/tests/lib/) greps this page
              # for the superseded classless-finding claims (a classless finding
              # is "not a countable finding", "omitted from findings[]",
              # "is ineligible") alongside the five code-audit-*.md sidecar
              # contracts. The agent files are reached by the code-audit-*.md
              # glob above and the three tally/schema sources by
              # `.gaia/cli/src/**` below, but this page matches no other pattern
              # here, so without this line a wiki-only edit restoring one of
              # those claims would report `code=false`, skip every bats step,
              # and green the job having run that assertion zero times. Same
              # test-dir/source-dir pairing as the two entries above.
              - 'wiki/concepts/Policy-Memory Loop.md'
              # doc-countability-prose.bats now greps this page too, for the
              # two corrected classless-finding claims (a classless finding
              # is "omitted from the findings block" / is "seeded in the
              # agent definition"). It matches no other pattern here, so
              # without this line a wiki-only edit reintroducing either claim
              # would report `code=false`, skip every bats step, and green
              # the job having run that assertion zero times.
              - 'wiki/concepts/Code Review Audit Agent.md'
              # plan-phase-ci-read.bats (.gaia/scripts/tests/) greps this
              # page's phase-loop step as the SECOND surface describing the
              # per-phase post-push CI read, and compares it against the
              # plan.md template the generated orchestrator inherits, so an
              # edit here alone is exactly the drift it exists to catch. It
              # matches no other pattern here, so without this line that edit
              # would report `code=false`, skip every bats step, and green the
              # job having run that comparison zero times. Same
              # test-dir/source-dir pairing as the entries above.
              - 'wiki/concepts/Task Orchestration.md'
              # The doc-setup-gaia-isolation and doc-gaia-init-isolation suites
              # (.gaia/tests/lib/) grep the /setup-gaia Phase 3.5 clause and the
              # /gaia-init Step 9 question block; trigger on the two command
              # files that carry that prose so an edit to either re-runs its
              # suite.
              - '.claude/commands/setup-gaia.md'
              - '.claude/commands/gaia-init.md'
              - '.gaia/tests/forensics/**'
              - '.gaia/tests/hooks/**'
              - '.gaia/tests/lib/**'
              # lint-hook-array-guard.bats (.gaia/scripts/tests/) asserts the
              # real scanned tree is clean, and that scan walks every
              # .gaia/tests/**/*.sh, so the WHOLE tree is a source this suite
              # guards rather than one it merely runs from. A PR touching a part
              # of it that no glob names -- reintroducing the bash-3.2
              # empty-array class the gate exists to catch -- would report
              # `code=false`, skip every bats step, and green this required
              # check having run that assertion zero times. `Shell Lint` runs
              # the same scan on any tracked *.sh, but it is advisory rather
              # than a declared-required context, so it reports such a
              # regression without blocking the merge.
              #
              # One self-maintaining glob rather than a subtree list, matching
              # what `.claude/hooks/**` and `.gaia/scripts/**` above already do
              # for the scan's other two roots. An itemized list has to be
              # extended the first time a new subdirectory gains a `.sh`, and
              # nothing forces that edit: adding a file to a new subtree does
              # not read as widening the scan, so the omission would be silent
              # and would reopen exactly this gap. The cost is that any
              # `.gaia/tests` change arms the full matrix, including the two
              # pnpm installs on the concurrency leg. The entries above stay as
              # they are: each documents its own test-dir/source-dir pairing,
              # which this glob does not express, and the file already keeps
              # redundant-but-documented entries for that reason.
              - '.gaia/tests/**'
              # The cross-directory bats helper (.gaia/tests/helpers/) is sourced
              # by suites in .gaia/scripts/tests/, .gaia/tests/lib/ and
              # .gaia/tests/hooks/, and it holds the byte-identity assertion
              # those suites depend on. It sits at the top of .gaia/tests/,
              # matching none of the .gaia/tests/*/ globs above, so without this
              # line an edit that weakened the helper alone would report
              # `code=false`, skip every bats step, and green the job having run
              # the assertions it broke zero times.
              - '.gaia/tests/helpers/**'
              # The .gaia/tests/lib/ suites exercise the SPEC-ledger lib scripts
              # under .specify/extensions/gaia/lib/ (spec-archive-merged.sh and
              # its shared cost-consolidate.sh, the allocators, ledger-update,
              # etc.), so trigger on that source dir too. A source-only edit then
              # runs the suite, matching the test-dir + source-dir pairing the
              # filters above already use (.gaia/tests/hooks/** + .claude/hooks/**;
              # .gaia/tests/forensics/** + .github/forensics/**).
              - '.specify/extensions/gaia/lib/**'
              # registry.bats (.gaia/tests/lib/) asserts every commands/*.md
              # file is registered in extension.yml's provides.commands and
              # every registered file: resolves on disk; trigger on both
              # guarded surfaces so an unregistered command file (the #651
              # drift the suite exists to catch) re-runs the suite.
              - '.specify/extensions/gaia/commands/**'
              - '.specify/extensions/gaia/extension.yml'
              - '.claude/skills/gaia/references/forensics*'
              - '.github/forensics/**'
              # The statusline suite (.gaia/tests/statusline/) exercises the
              # shipped .gaia/statusline/gaia-statusline.sh worktree gate and
              # segment rendering, and it runs real copies of the two
              # refreshers that feed those segments:
              # .gaia/scripts/check-updates.sh (the hardenUnclassifiedCount
              # segment, and the audit nudge's project_drift suppression) and
              # .gaia/scripts/debt-count-refresh.sh (the coveredPaths that
              # suppression keys on). Both refreshers are already covered by
              # the .gaia/scripts/** glob above, so only the statusline dirs
              # and harden.md need listing here -- but narrowing that glob
              # would stop arming this suite on two of its sources.
              # harden.md is the third source it reads as real repo text:
              # three tests grep it for the prose pinning the unclassified
              # signal, and the .claude/skills/gaia/references/ entries above
              # name other files only, so without this line an edit to it
              # alone skips every code-gated shard, where that suite lives,
              # and greens having run those three assertions zero times.
              - '.gaia/statusline/**'
              - '.gaia/tests/statusline/**'
              - '.claude/skills/gaia/references/harden.md'
              # retrigger-reachability.bats (.gaia/scripts/tests/) reads every
              # workflow in .github/workflows/ and the retrigger_workflows knob
              # in .gaia/audit-ci.yml, so both are sources it guards. Without
              # them, the edit the suite exists to catch -- a required check's
              # workflow losing its workflow_dispatch trigger, or dropping out
              # of the knob -- matches no pattern here, every bats step skips,
              # and the job greens having run that assertion zero times. The
              # workflows glob self-maintains as the declared-required set
              # changes, the same reasoning as the code-audit-*.md glob above.
              - '.github/workflows/**'
              # The composite action the Node setup step below `uses:`. It lives
              # outside .github/workflows/, so it matches nothing else here, and
              # without this line a pull request changing only the action -- its
              # node version, its install arms, its cache key -- would report
              # `code=false`, skip every step gated on this filter, and green a
              # declared-required context having run nothing. A glob rather than
              # the one path: the directory is where shared composite actions go,
              # so an itemized entry would silently stop covering the next one.
              - '.github/actions/**'
              - '.gaia/audit-ci.yml'
              # check-hook-scope-manifest.bats (.gaia/scripts/tests/) asserts
              # coverage + conformance of the hook tree-scope manifest; a
              # manifest-only edit touches neither .claude/hooks/** nor
              # .gaia/scripts/** above, so without these two lines it would
              # match no pattern here and skip the very suite that guards it.
              - '.gaia/hook-scopes.json'
              - '.gaia/hook-scopes.schema.json'
              # check-script-capabilities.bats (.gaia/scripts/tests/) asserts
              # coverage + conformance of the script-capabilities manifest
              # against the checker; a manifest-only edit touches neither
              # .gaia/scripts/** nor .claude/settings.json above, so without
              # these two lines it would match no pattern here and skip the
              # very suite that guards it.
              - '.gaia/script-capabilities.json'
              - '.gaia/script-capabilities.schema.json'
              # check-hook-capabilities.bats (.gaia/scripts/tests/) asserts
              # coverage + conformance of the hook-capabilities manifest
              # against the checker; a manifest-only edit touches neither
              # .gaia/scripts/** nor .claude/settings.json above, so without
              # these two lines it would match no pattern here and skip the
              # very suite that guards it.
              - '.gaia/hook-capabilities.json'
              - '.gaia/hook-capabilities.schema.json'
              # .gaia/release-exclude is the authority check-script-capabilities.sh
              # reconciles maintainer_only against (C-10): a change to the
              # release boundary is exactly what makes that marking wrong, and
              # it touches no other pattern here, so without this line the
              # suite that guards it would skip on the very change that breaks
              # it.
              - '.gaia/release-exclude'
              # lint-shipped-issue-refs.bats (.gaia/scripts/tests/) derives its
              # scan set from the release manifest, and its release-boundary
              # parity assertions read the manifest directly to check that the
              # shipped-versus-excluded split .claude/rules/code-comments.md
              # states in prose is still true. A manifest-only edit -- a release
              # regeneration, a /distribution-audit answer -- is exactly what
              # makes that prose stop being true, and it touches no other
              # pattern here, so without this line the suite that guards it
              # would skip on the very change that breaks it.
              - '.gaia/manifest.json'
              # The INV-7 concurrency meter (.gaia/tests/concurrency/) and the
              # sources it drives. Most are already listed above -- it copies
              # .claude/hooks/**, .gaia/scripts/**, .gaia/statusline/** and
              # .specify/extensions/gaia/lib/** into its fixtures at their real
              # repo-relative paths -- but these five are not, and each is a
              # source the meter reads:
              #   state-registry.json + schema  copied into every fixture, so a
              #     registry edit changes what the meter observes.
              #   .gaia/cli/src/**  C3-05 runs the real TypeScript storage
              #     functions through the CLI's tsx; C5-03's call-site check
              #     greps the wiki and release command surfaces.
              #   .claude/commands/gaia-release.md  the other surface C5-03
              #     greps for a resolver consult.
              #   both lockfiles  three scenarios resolve `typescript`/`tsx`
              #     from installed dependencies, and a dependency bump touches
              #     a lockfile without touching any source dir here. That is a
              #     live path in this repo (/update-deps runs on its own
              #     cadence), so without them a bump could red the meter and
              #     the next unrelated PR would be the first to notice.
              #   both workspace files  same argument as the lockfiles, same
              #     installs: pnpm-workspace.yaml governs `allowBuilds`,
              #     `trustPolicyExclude` and `minimumReleaseAge` for the very
              #     `pnpm install --frozen-lockfile` runs the meter depends on,
              #     and each is edited standalone. .gaia/cli/pnpm-workspace.yaml
              #     documents ERR_PNPM_IGNORED_BUILDS in its own header, so a
              #     missing allowBuilds entry breaking the install is observed
              #     behavior here, not a hypothetical.
              - '.gaia/tests/concurrency/**'
              - '.gaia/state-registry.json'
              - '.gaia/state-registry.schema.json'
              - '.gaia/cli/src/**'
              - '.claude/commands/gaia-release.md'
              - 'pnpm-lock.yaml'
              - '.gaia/cli/pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.gaia/cli/pnpm-workspace.yaml'
              # The remaining two install inputs. No sibling workflow lists
              # .node-version, but this job is the one that reads it
              # (node-version-file below) AND is judged by a scenario count, so
              # a toolchain edit silently skipping the meter is the same hazard
              # as a lockfile edit doing so. package.json pins packageManager
              # for pnpm/action-setup.
              - '.node-version'
              - 'package.json'
              - '.npmrc'
            # The .gaia/tests/sandbox/ conformance tree gets its OWN filter
            # output instead of joining `code:` above, and the reason is cost,
            # not tidiness. One of its suites git-greps every committed
            # .json/.md/.yml/.yaml file in the repo, so an honest read set for
            # it is those four globs and nothing narrower. Folding them into
            # `code:` would arm this job's two pnpm installs and the INV-7
            # concurrency meter on very nearly every pull request. As its own
            # output it arms only the bats step below, plus the apt install that
            # step needs.
            #
            # Be honest about what that still costs, because it is a real change
            # in this job's posture rather than a free addition. Those four globs
            # match a bit under a third of tracked files, but they are
            # the documentation and configuration types, so the PRs that arm
            # `sandbox` alone are the ones that used to run no step at all: a
            # wiki-only change now runs `apt-get update`, unless its paths also
            # match `code:` above, in which case the full bats matrix runs
            # instead. `apt-get update` is the flakiest operation in this job,
            # and this is a declared-required context, so a mirror hash-sum
            # mismatch can now red a required check on a docs-only PR. A pure app-only change is not in
            # that set: app/ is .tsx/.ts/.css and matches neither output, so it
            # still runs nothing. The broad read set is the honest one and
            # narrowing it would trade a visible cost for a silent gap; the
            # exposure is bounded to an apt install.
            # Read the four broad globs at the end of this list first: they
            # cover every committed .json/.md/.yml/.yaml, which is most of what
            # these suites read. The entries above them that are load-bearing on
            # their own are the ones whose file type those globs do not reach,
            # and each says so at its own entry rather than being counted or
            # listed here, because a tally in this sentence goes stale the next
            # time one is added and reads as completeness while it does. The
            # file types that need such an entry are the ones no broad glob
            # names: .bats, .ts, .sh, .tar.gz. The rest are redundant
            # today and kept deliberately, so that narrowing the broad globs
            # later cannot silently drop a suite's source; a reader auditing
            # completeness should know which is which rather than assume every
            # line is the only thing arming its suite.
            sandbox:
              # LOAD-BEARING: .bats, reached by no broad glob.
              - '.gaia/tests/sandbox/**'
              # install-bats.sh is what the sandbox leg's own install step
              # calls. LOAD-BEARING, not redundant: none of the four broad
              # globs below reach a `.sh` outside `.gaia/tests/sandbox/`, so
              # without this line an edit to the pinned bats version or digest
              # would report `sandbox=false` and skip that leg's install too.
              - '.gaia/tests/install-bats.sh'
              # The vendored archive that install step extracts. LOAD-BEARING
              # for the same reason and by the same argument as the line above:
              # a `.tar.gz` is reached by none of the four broad globs below,
              # so without this line a change to the archive alone -- the half
              # of a version bump that carries the actual bytes, or a swap of
              # them -- would report `sandbox=false` and skip the leg whose
              # install is what would have caught it at the digest check.
              - '.gaia/tests/vendor/**'
              # doc-setup-gaia.bats greps the sandbox-decision block of the
              # /setup-gaia command doc, and pins its `.sandbox_recommended`
              # reader literal byte-identical against the schema writer key, so
              # the schema is a source it guards as much as the doc is. The doc
              # is already covered by '**/*.md'; the schema is LOAD-BEARING,
              # being .ts.
              - '.claude/commands/setup-gaia.md'
              - '.gaia/cli/src/schemas/automation-config.ts'
              # wiki-page.bats greps the shipped OS Sandbox wiki page. Already
              # covered by '**/*.md'; listed so the suite's source stays armed
              # if that glob is ever narrowed.
              - 'wiki/concepts/OS Sandbox.md'
              # spec-028-composition.bats asserts the .env deny entries the
              # settings file carries and the hook that backs them. The settings
              # file is already covered by '**/*.json'; the hook is
              # LOAD-BEARING, being .sh. Note that a filter output is evaluated
              # independently of its siblings, so `code:` listing either of these
              # does nothing for this output.
              - '.claude/settings.json'
              - '.claude/hooks/block-env-read.sh'
              # manifest-and-enable.bats git-greps EVERY committed file of these
              # four types for a raw top-level sandbox enable, in both the flat
              # key form and the nested object form, so its read set is
              # literally all of them and any narrower glob would be a filter
              # that omits a path the suite reads. Neither forbidden spelling is
              # written out here on purpose: this file is a *.yml, so the suite
              # greps this very comment, and quoting them reds the suite. One
              # glob per type is the whole set at every depth: dorny/paths-filter
              # matches with picomatch `{dot: true}` (MatchOptions in its
              # src/filter.ts, at the SHA pinned above), so `**/` both descends
              # into .claude/, .gaia/ and .github/ and matches zero segments,
              # covering root-level package.json and CHANGELOG.md too.
              - '**/*.json'
              - '**/*.md'
              - '**/*.yml'
              - '**/*.yaml'
      # python3-yaml pins the parser (python3+pyyaml) that every
      # `require_yaml_parser` gate on this runner needs. How many suites carry
      # one is deliberately not written down here: a hand-kept count drifts as
      # suites are added, and W10 below already derives the live set from the
      # suites themselves via `shard_package_needs`. Every such gate FAILs
      # rather than `skip`s when GITHUB_ACTIONS is set, precisely so dropping
      # this package reds the run here instead of retiring the invariants
      # behind it, the self-heal reachability one and the YAML-write hook's
      # coverage among them, behind `ok ... # skip`. A gate that accepts `yq`
      # as a second parser reds only when neither is present. Those gates are
      # what enforce this line; this comment only explains it. Pin the package
      # here rather than resting on whatever the runner image happens to
      # preinstall.
      #
      # zsh backs four suites under .gaia/scripts/tests/ (audit-key-lib,
      # main-only-lib, debt-origin-lib, audit-window-lib), and those `skip`
      # SILENTLY when it is absent, so its absence looks identical to a clean
      # tree rather than reporting red. That silent-skip hazard is the whole
      # reason the apt step below names the legs it runs on rather than being
      # left uniform: a per-shard package list is only safe while something
      # checks that the named set still covers every leg that draws one of
      # those files, and a reshuffle of the weighted split moves files
      # between legs without touching this file. W10 in .gaia/tests/lib/audit-ci-shards.bats
      # is that check. It recomputes the leg-to-dependency map from the suites
      # themselves and reds when this list and that map disagree, in either
      # direction, which is what converts the reduced set from an assumption
      # into a checked invariant -- the same move W9 already makes for the
      # sandbox leg's empty package set.
      #
      # The bats install stays on every non-sandbox leg; only apt is narrowed.
      # This step covers only the `code` output: the `sandbox` leg installs
      # bats through its own step below, with no apt line at all, because
      # .gaia/tests/sandbox/*.bats needs neither package (W9 pins that too).
      # Splitting the install this way, rather than admitting both outputs on
      # one shared step as the pre-shard job did, is what keeps a docs-only PR
      # (which arms `sandbox` but not `code`) from running `apt-get update` --
      # the flakiest operation in this job -- on every leg. It also keeps this
      # step's `workflow-filter-coverage.bats` obligation single: a step gated
      # on `code || sandbox` would need install-bats.sh listed in both filter
      # bodies for the SAME step, and this way each step's script is covered by
      # exactly the filter that gates it.
      - if: matrix.shard != 'sandbox' && (steps.filter.outputs.code == 'true' || github.event_name == 'workflow_dispatch')
        name: Install pinned bats
        run: bash .gaia/tests/install-bats.sh
      # python3-yaml pins the parser (python3+pyyaml) rather than resting on
      # whatever the runner image happens to preinstall, and it is installed
      # beside zsh on the same legs rather than on a list of its own: two
      # narrowly-gated apt steps would pay `apt-get update` twice on every leg
      # needing both, which is most of this list.
      #
      # The list is not hand-picked. It is exactly the set of shards holding a
      # suite that reaches for either dependency, by the four patterns W10
      # names; every other leg runs no apt at all. The suites behind it are
      # deliberately NOT enumerated here. Which leg holds which suite is
      # decided by the sharder's weighted assignment, so any list written down
      # is one reshuffle from being wrong while reading as authoritative, and
      # W10 recomputes the set from the suites either way. To see the current
      # membership, run `shard_package_needs` out of
      # .gaia/tests/lib/audit-ci-shards.bats.
      #
      # Do not edit this list by hand to make W10 pass: W10 failing means a
      # suite moved legs, and the repair is to copy the set W10 names, which it
      # derives from the suites rather than from here.
      - if: contains(fromJSON('["hooks-4", "lib", "scripts-1", "scripts-2", "scripts-3"]'), matrix.shard) && (steps.filter.outputs.code == 'true' || github.event_name == 'workflow_dispatch')
        name: Install the YAML parser and zsh
        # Sized for fast failure and honest attribution, NOT to the leg. When
        # this cap fires is the budget paragraph's subject, not this one's,
        # because the answer is not "after every attempt". A leg that fails
        # here reds `Audit CI Tests`
        # (.gaia/scripts/verify-required-checks.sh names it required) and that
        # leg's tests do not run.
        #
        # The budget is what makes three attempts reachable: 3 x (45 + 45) of
        # apt plus 30 of backoff is 300, inside this 360. Read 300 as the
        # intended shape, not a ceiling. `timeout` REQUESTS termination, and
        # dpkg defers SIGTERM while unpacking, so a per-call bound can be
        # overrun and this step cap is the only bound that always holds.
        # `-k` would make it a ceiling and is deliberately not used: SIGKILL
        # mid-dpkg leaves an interrupted state that fails attempts 2 and 3
        # outright, which is worse than overrunning into this cap.
        #
        # Why every apt call is wrapped in `timeout` rather than left to
        # Acquire::*::Timeout: those options bound a STALLED transfer, and the
        # failure actually observed here is not a stall. The runner's mirror
        # list puts azure.archive.ubuntu.com first, that host answers `Ign:`
        # within seconds, apt falls back to archive.ubuntu.com and gets a
        # clean `Hit:`, and the time is then spent AFTER a successful
        # connection, where a per-connection timeout has nothing to break. A
        # single `apt-get update` consumed the entire step budget twice, and
        # neither run ever printed an `apt attempt N of 3 failed` line: the cap
        # fired inside attempt 1 and attempts 2 and 3 were unreachable, so the
        # retry absorbed nothing on the one failure it exists for. Bounding the
        # call itself is what makes the loop reachable, whichever mirror is the
        # one misbehaving.
        timeout-minutes: 6
        # Bounded three times, because the three bounds catch different
        # failures and none is sufficient alone: `Acquire::*::Timeout` per
        # connection, `timeout` per call, and `timeout-minutes` per step.
        #
        # `Acquire::*::Timeout` ends a STALLED connection in seconds rather
        # than letting it hold. It bounds a connection, never a call: with
        # `Acquire::Retries=2` one dead URI is three tries of 20, so a single
        # apt call can still run past its 45s wrapper and be killed there.
        # These knobs do NOT make the retry reachable, which is the per-call
        # `timeout` above's job: they were the only bound on a call for two
        # runs, and both spent the whole step budget in attempt 1 because the
        # failure was never a stall. Both the `http` and `https` knobs are set
        # because the option is keyed on the acquire method, not on the scheme
        # the loop happens to hit.
        #
        # Three attempts because an archive.ubuntu.com stall is transient:
        # re-running an identically-stalled leg by hand passes it in a
        # fraction of the time it hung for. A genuine mirror outage still
        # fails red rather than hanging, three short attempts later.
        #
        # A bounded shell retry rather than a marketplace retry action: this
        # repository vendors its pinned bats and keeps its composite actions
        # local under .github/actions/, so a third-party action here would be
        # the only dependency of its kind, pinned and reviewed for a loop bash
        # states in ten lines.
        run: |
          set -euo pipefail
          apt_opts=(-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
          # `sudo timeout`, not `timeout sudo`: the latter signals sudo and can
          # leave the apt child running past the bound, which is the bound not
          # holding. Exit 124 is timeout's own "I killed it", reported so a log
          # reader can tell a bounded attempt from a failed one.
          apt_bounded() {
            local what="$1"; shift
            local rc=0
            sudo timeout 45 "$@" || rc=$?
            if [ "${rc}" -eq 124 ]; then
              echo "apt ${what} exceeded its 45s bound" >&2
            fi
            return "${rc}"
          }
          for attempt in 1 2 3; do
            if apt_bounded update apt-get "${apt_opts[@]}" update \
              && apt_bounded install apt-get "${apt_opts[@]}" install -y python3-yaml zsh; then
              exit 0
            fi
            echo "apt attempt ${attempt} of 3 failed" >&2
            if [ "${attempt}" -lt 3 ]; then
              sleep $((attempt * 10))
            fi
          done
          echo "apt-get failed after 3 attempts; python3-yaml and zsh are unavailable" >&2
          exit 1
      # No apt at all: the sandbox tree provably needs neither python3-yaml nor
      # zsh (W9 above), so this leg only needs the pinned bats binary. A PR
      # that arms `sandbox` alone therefore runs no apt at all, instead of the
      # exposure a single shared install step on every leg would carry.
      - if: matrix.shard == 'sandbox' && (steps.filter.outputs.sandbox == 'true' || github.event_name == 'workflow_dispatch')
        name: Install bats
        run: bash .gaia/tests/install-bats.sh
      # TWO installs across this job, not one, and the reason is structural:
      # .gaia/cli is deliberately its own isolated pnpm workspace
      # (.gaia/cli/pnpm-workspace.yaml), so a repo-root install does not reach
      # it. The root install is what C4-04 and C4-07 need (their node helpers
      # resolve `typescript` from the repo root); the .gaia/cli install is what
      # C3-05 needs (it runs the CLI's own tsx binary out of
      # .gaia/cli/node_modules, which is gitignored and so absent on a fresh
      # checkout). Skipping either flips a landed, green scenario red for want
      # of an npm install, which would read as a regression in the number this
      # program is judged by rather than as the environment gap it is. Scoped
      # to the `concurrency` leg alone: no bats suite in any other shard
      # depends on a Node runtime or an installed workspace dependency, which
      # is what makes it safe for those legs to run on a box that never sets
      # Node up at all.
      - if: matrix.shard == 'concurrency' && (steps.filter.outputs.code == 'true' || github.event_name == 'workflow_dispatch')
        name: Setup Node and install both workspaces
        uses: ./.github/actions/gaia-setup-node
        with:
          install: both
          # Both lockfiles: the meter installs both workspaces, so warming the
          # store on only one leaves the other cold.
          cache-dependency-path: |
            pnpm-lock.yaml
            .gaia/cli/pnpm-lock.yaml
      # `${{ matrix.shard }}` reaches the script only through `env:`, never
      # interpolated into the run: body text itself -- the shape this repo's
      # workflows auditor checks, and what keeps it true when a future edit
      # drives the matrix from an expression rather than a literal list.
      - if: matrix.shard != 'sandbox' && matrix.shard != 'concurrency' && (steps.filter.outputs.code == 'true' || github.event_name == 'workflow_dispatch')
        name: Run a bats shard
        env:
          SHARD: ${{ matrix.shard }}
        run: bash .gaia/tests/bats-shards.sh run "$SHARD"
      # The sandbox-enablement conformance tree, on its own leg with its own
      # filter output. Gated on `sandbox` rather than `code`, so a PR touching
      # only a file this tree reads runs it without arming the Node install or
      # the concurrency meter's leg. Invoked through run-all.sh, matching the
      # contract that script documents in its own header.
      #
      # Two of its 20 tests self-skip here and both are green outcomes, not
      # gaps: UAT-016 needs a sandbox-capable runner (bubblewrap/socat, which
      # ubuntu-latest does not have and its header says so), and the docs-link
      # reachability check skips under CI so a third-party outage cannot red a
      # declared-required context. The other 18 run.
      - if: matrix.shard == 'sandbox' && (steps.filter.outputs.sandbox == 'true' || github.event_name == 'workflow_dispatch')
        name: Run .gaia/tests/sandbox bats suites
        run: bash .gaia/tests/sandbox/run-all.sh
      # Runs the WHOLE suite and adjudicates every scenario against
      # .gaia/tests/concurrency/expected-status.txt, so any scenario the
      # manifest marks red by design does not wedge this required check while
      # still counting in the reading. A `bats --filter` over the armed
      # tranches was the alternative and is worse: it hides the reds and makes
      # a newly added scenario invisible by default.
      - if: matrix.shard == 'concurrency' && (steps.filter.outputs.code == 'true' || github.event_name == 'workflow_dispatch')
        name: Run the INV-7 concurrency meter (gated on its expected-status manifest)
        run: bash .gaia/tests/concurrency/meter-gate.sh

  # A standalone job, not a matrix leg: `.gaia/scripts/check-hook-capabilities.sh`
  # walks the live-tree closure of every registered hook, and its 66-70s median
  # standalone gate-mode cost on the maintainer machine (83s on this runner;
  # see the WTI_EXCLUDED entry this checker carries in
  # .gaia/tests/whole-tree-invariants.sh) is long
  # enough that no size-weighted shard should absorb it as a step -- bats-shards.sh
  # weights a suite by file size as a runtime proxy, which a short suite shelling
  # out to a minute-long checker would break. It runs here instead, at hop 1
  # alongside `shards`, so the `needs:` chain into the aggregator below stays 2
  # hops; see the `shards` job's own comment for the 15-minute total that
  # arithmetic is sized to. This is the one named home success criterion 6
  # requires for a live-tree run of this checker.
  hook-capabilities-live-tree:
    name: Hook Capabilities (live tree)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Sized to the measured runner cost, not to the 13-minute `shards` cap:
    # this job's own contribution to the aggregator's needs-chain must stay
    # under that same cap for the arithmetic above to hold. The checker itself
    # measures 83s on ubuntu-latest (91s for the whole job including the
    # full-history checkout), against a 66-70s median on the maintainer
    # machine -- the runner is the slower host, so size against 83s, not the
    # laptop figure. 5 minutes leaves better than 3x headroom for a noisy
    # runner without approaching the cap.
    timeout-minutes: 5
    # Checks out and runs a shell checker; no write scope needed. No
    # `pull-requests: read`: unlike `shards`, this job's filter is hand-rolled
    # (see the comment on the filter step below) rather than dorny/paths-filter,
    # so it never calls the API that scope exists for.
    permissions:
      contents: read
    steps:
      # `fetch-depth: 0` (full history), not the default shallow clone: the
      # hand-rolled filter step below diffs against the PR's base commit, which
      # a depth-1 checkout never fetches.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Hand-rolled rather than a second dorny/paths-filter step. W7 in
      # .gaia/tests/lib/audit-ci-shards.bats pins exactly one paths-filter step
      # for the whole workflow, and this job runs in parallel with `shards`
      # rather than depending on it, so it cannot read that one step's output
      # without adding a `needs:` hop the arithmetic above has no room for.
      # `tests.yml`'s own hand-rolled gate is the precedent this mirrors; both
      # are named in workflow-filter-coverage.bats's HANDROLLED_EXEMPT set for
      # the same reason. The alternation below is maintained by hand: a step
      # reading a new path means adding that path here in the same edit.
      #
      # `.claude/settings.local.json` is also read by the checker (the
      # LOCAL-REGISTRATION arm) but is gitignored, so it cannot appear in the
      # pattern below; it is also absent on every CI runner, so the arm is
      # silent here by its own contract. A recorded limit, not a gap.
      - name: Detect hook-capabilities-relevant changes
        id: filter
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          # `-z` plus `tr`, not a bare `--name-only`: an unquoted diff C-quotes
          # a non-ASCII path (e.g. `"caf\303\251.sh"`), and the ERE below would
          # stop matching it. `$(...)` discards NUL bytes on its own, so `tr`
          # must stay inside the substitution for `set -o pipefail` to still
          # abort the step on a git failure.
          changed=$(set -o pipefail; git diff --name-only -z "$BASE_SHA" HEAD | tr '\0' '\n')
          # `^\.github/audit/` earns its place the moment the oracle learned to
          # walk a script executed by its own path: `.github/audit/` is inside a
          # registered hook's closure now, so a change there moves a declared
          # reach and has to run this job.
          pattern='^\.claude/settings\.json$|^\.claude/hooks/|^\.gaia/scripts/|^\.github/audit/|^\.specify/extensions/gaia/lib/|^\.gaia/hook-capabilities\.(json|schema\.json)$|^\.gaia/release-exclude$|^\.github/workflows/audit-ci-tests\.yml$'
          if printf '%s\n' "$changed" | grep -qE "$pattern"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.filter.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
        name: Run the hook-capabilities checker against the live tree
        run: |
          start="$SECONDS"
          bash .gaia/scripts/check-hook-capabilities.sh
          echo "hook-capabilities-live-tree elapsed: $(( SECONDS - start ))s"

  # A standalone job, not a matrix leg. .gaia/scripts/check-verb-arming-adoption.sh
  # pins the shared verb-arming decision as a singleton and the eleven adopting
  # hooks against drift (SPEC-075's Constitution requires the check run in CI
  # rather than by hand; see that check's own header). It runs here rather than
  # inside a bats shard because bats-shards.sh weights a shard by its suites'
  # file size, and this checker has no .bats file of its own to weigh it in --
  # a short suite shelling out to it would misprice that shard the same way
  # hook-capabilities-live-tree's comment describes for its own checker. It
  # runs at hop 1 alongside `shards` and `hook-capabilities-live-tree`, so the
  # `needs:` chain into the aggregator below stays 2 hops; see the `shards`
  # job's own comment for the 15-minute total that arithmetic is sized to.
  verb-arming-adoption:
    name: Verb Arming Adoption
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # The check itself is a handful of git grep calls (~1s standalone,
    # nowhere near hook-capabilities-live-tree's closure-walk cost), so 2
    # minutes sizes to the measurement rather than borrowing the neighbour's
    # 5-minute cap.
    timeout-minutes: 2
    # Checks out and runs a shell checker; no write scope needed. No
    # `pull-requests: read`: this job's filter is hand-rolled (see the
    # comment on the filter step below) rather than dorny/paths-filter, so it
    # never calls the API that scope exists for.
    permissions:
      contents: read
    steps:
      # `fetch-depth: 0` (full history), not the default shallow clone: the
      # hand-rolled filter step below diffs against the PR's base commit,
      # which a depth-1 checkout never fetches.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Hand-rolled rather than a second dorny/paths-filter step. W7 in
      # .gaia/tests/lib/audit-ci-shards.bats pins exactly one paths-filter
      # step for the whole workflow, and this job runs in parallel with
      # `shards` rather than depending on it, so it cannot read that one
      # step's output without adding a `needs:` hop the arithmetic above has
      # no room for. hook-capabilities-live-tree's own hand-rolled gate is
      # the precedent this mirrors; both are named in
      # workflow-filter-coverage.bats's HANDROLLED_EXEMPT set (by workflow
      # file, not by job id) for the same reason. The alternation below is
      # maintained by hand: a step reading a new path means adding that path
      # here in the same edit.
      - name: Detect verb-arming-adoption-relevant changes
        id: filter
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          # `-z` plus `tr`, not a bare `--name-only`: see
          # hook-capabilities-live-tree's identical filter step for why an
          # unquoted diff over a non-ASCII path breaks the pattern below.
          changed=$(set -o pipefail; git diff --name-only -z "$BASE_SHA" HEAD | tr '\0' '\n')
          # `\.sh$` rather than a list of directories, because the checker's
          # own scan is the whole tracked tree: its private-pattern and
          # grep-idiom assertions take `-- '*.sh'`, so a shell file ANYWHERE
          # can plant what they look for, and most tracked `.sh` files sit
          # outside any directory list this job would plausibly carry, well
          # over half of them outside even the four paths this filter used to
          # name. No count is pinned here: it decays on the next script anyone
          # adds, and `git ls-files -- '*.sh'` answers it on demand. A narrower
          # filter runs the job with the checker step skipped and reports
          # success over content it never scanned. Honest limit: the singleton
          # assertion scans `-- .`, every tracked file, so a definition planted
          # in a non-`.sh` file arms nothing here.
          pattern='^\.claude/hooks/|^\.claude/settings\.json$|\.sh$|^\.github/workflows/audit-ci-tests\.yml$'
          if printf '%s\n' "$changed" | grep -qE "$pattern"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.filter.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
        name: Run the verb-arming adoption checker
        run: bash .gaia/scripts/check-verb-arming-adoption.sh

  # The declared-required check. `needs: [shards, hook-capabilities-live-tree,
  # verb-arming-adoption]` makes it the second hop of a 2-hop chain the
  # arithmetic above is sized to, and `always()` is what stops a plain
  # skip-on-dependency-failure from satisfying nothing: a `needs:` with no
  # `if:` SKIPS when a dependency fails, and a skipped stamp satisfies no
  # required check.
  audit-ci-tests:
    name: Audit CI Tests
    needs: [shards, hook-capabilities-live-tree, verb-arming-adoption]
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # No checkout and no scopes: this job reads two expressions off `needs:`
    # and exits, so it needs nothing a default-deny leaves it without.
    permissions: {}
    steps:
      # `needs.shards.result` is the aggregate over every matrix leg: it reads
      # `success` only when every leg concluded `success`. A leg whose steps
      # all skipped because the filter resolved false still concludes
      # `success`, which is correct and matches today's pre-shard behavior --
      # a PR touching nothing relevant should report this check green having
      # run nothing. `needs.hook-capabilities-live-tree.result` is read the same
      # way. `skipped` and `cancelled` both fail this check, along with
      # `failure`, because each comparison is `!= "success"` rather than a
      # `case` enumerating the failure states it knows about, so a conclusion
      # GitHub adds later fails closed instead of reading as an unrecognized,
      # unhandled success.
      - name: Require every shard and the live-tree job to have succeeded
        env:
          SHARDS_RESULT: ${{ needs.shards.result }}
          HOOK_CAPABILITIES_RESULT: ${{ needs.hook-capabilities-live-tree.result }}
          VERB_ARMING_RESULT: ${{ needs.verb-arming-adoption.result }}
        run: |
          if [ "$SHARDS_RESULT" != "success" ]; then
            echo "::error::at least one shard did not conclude success: $SHARDS_RESULT" >&2
            exit 1
          fi
          if [ "$HOOK_CAPABILITIES_RESULT" != "success" ]; then
            echo "::error::hook-capabilities-live-tree did not conclude success: $HOOK_CAPABILITIES_RESULT" >&2
            exit 1
          fi
          if [ "$VERB_ARMING_RESULT" != "success" ]; then
            echo "::error::verb-arming-adoption did not conclude success: $VERB_ARMING_RESULT" >&2
            exit 1
          fi
