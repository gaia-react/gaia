name: Audit CI Tests

# Runs the bats suites for the .github/audit/ helpers that
# code-review-audit.yml consumes, check-trailer.sh (skip-logic gate) and
# resolve-audit-base.sh (incremental review base), plus the
# pr-merge-audit-check.sh PreToolUse merge hook (GAIA-Audit status reader).
# Maintainer-only:
# adopters receive these as GAIA-controlled (`owned`) code they never
# modify, so the suite only catches regressions from maintainer edits.
# Mirrors cli-tests.yml's narrow-surface, paths-filtered, step-gated shape.
#
# The last step is the odd one and is deliberate: the INV-7 concurrency meter
# (.gaia/tests/concurrency/) admits scenarios that are red by design, belonging
# to phases that have not run yet, so it is gated through meter-gate.sh against
# a checked-in expected-status manifest rather than on its own exit status. A
# green here means every scenario did exactly what the manifest says it does --
# an expected-pass going red AND an expected-red going green both fail the
# build. The manifest, not this comment, is the authority on which scenarios
# are which, and how many of each there are at any moment.
# See .gaia/tests/concurrency/README.md.
#
# Pinned action SHAs match .github/workflows/cli-tests.yml:
#   actions/checkout    @ 3d3c42e5aac5ba805825da76410c181273ba90b1 (v7.0.1)
#   dorny/paths-filter  @ ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d (v4.0.3)
#   pnpm/action-setup   @ 0977fd99725f1db4007ccb2928dbb4e90d06cc86 (v6.0.10)
#   actions/setup-node  @ 820762786026740c76f36085b0efc47a31fe5020 (v7.0.0)

# `workflow_dispatch:` is the CI-mode self-heal lane. A GITHUB_TOKEN-authored
# self-heal push fires no `pull_request` event, so code-review-audit.yml
# re-dispatches the workflows named in `.gaia/audit-ci.yml`'s
# `retrigger_workflows` and stamps each dispatched run's per-JOB conclusion onto
# the new HEAD. `Audit CI Tests` below is a declared-required context, so
# without this trigger -- and without the job admitting it in its `if:` -- the
# check is absent on the self-heal HEAD and branch protection blocks the merge.
# Same shape as cli-tests.yml; .gaia/scripts/tests/retrigger-reachability.bats
# guards the invariant for every declared-required context. As there, GitHub
# honors the trigger only for the default-branch copy of this file, so a
# dispatch fails with 422 until it lands on main.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The job checks out, resolves changed files via dorny/paths-filter, and runs
# bats; it needs no write scopes, so pin GITHUB_TOKEN to least privilege instead
# of inheriting the repo-default scope. `pull-requests: read` is load-bearing,
# not decoration: naming any scope here sets every unlisted one to `none`, and
# dorny/paths-filter resolves a PR's changed files through the API, which needs
# it. Omitting it works only while this repo is public; the day it went private,
# every run would 403 with "Resource not accessible by integration". Mirrors
# shell-lint.yml, which runs the same action on the same trigger.
permissions:
  contents: read
  pull-requests: read

jobs:
  audit-ci-tests:
    name: Audit CI Tests
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # The self-heal poller in code-review-audit.yml waits 25 minutes for a
    # dispatched run, then gives up and stamps nothing, which leaves this
    # required context ABSENT on the self-heal HEAD rather than merely red: the
    # exact wedge the dispatch lane exists to prevent. Cap well under that
    # window so a hung `apt-get` fails fast instead of inheriting the 6-hour
    # runner default. The cap is derived from that 25-minute poller window, not
    # from an observed runtime: this job also does two full dependency installs
    # and a concurrency suite that creates real git worktrees, so do not treat
    # any figure quoted here as a measurement. Nothing machine-checks this cap
    # against real run durations, so a job that slows past it fails on the cap
    # rather than reporting that it got slower.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # PRs that don't touch the audit scripts report this check green
      # without installing or running anything.
      #
      # paths-filter resolves changed files from the pull-request context, which
      # a `workflow_dispatch` run does not have, so the dispatch lane skips this
      # step and every step below falls back to running unconditionally. That is
      # the intent of a re-trigger: it exists to produce a real green on the
      # self-heal HEAD, and a full run is the only thing that proves one.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            code:
              - '.github/audit/**'
              # This job's own definition. The filter above, the step conditions
              # below and the bats invocations they arm all live here, so an edit
              # to this file changes what every suite in this job runs, and
              # retrigger-reachability.bats reads it as one of the workflows it
              # scans. Redundant today: the `.github/workflows/**` catch-all below
              # already matches it. Listed deliberately anyway, the same
              # convention the `sandbox:` filter uses for its own redundant
              # entries, so that narrowing that glob later cannot silently drop
              # this file. It is documentation of the self-coverage, not the thing
              # arming it.
              - '.github/workflows/audit-ci-tests.yml'
              # ci-status-member-gate.bats EXECUTES `run:` bodies extracted from
              # code-review-audit.yml, so that workflow is a source this suite
              # guards, not just a consumer of it. Its structural lock pins the
              # set of steps that POST a `pending` GAIA-Audit status and fails on
              # an unguarded new one. Redundant today: the `.github/workflows/**`
              # catch-all below already matches it. Listed deliberately anyway,
              # the same convention the `sandbox:` filter uses for its own
              # redundant entries, so that narrowing that glob later cannot
              # silently drop this source. It is documentation of the test-dir/
              # source-dir pairing, the same pairing as the three instruction
              # files below, not the thing arming it.
              - '.github/workflows/code-review-audit.yml'
              # distribution-audit-pr-gate.bats (.gaia/scripts/tests/) EXECUTES
              # the `run:` body extracted from distribution-audit-pr.yml, so that
              # workflow is a source this suite guards rather than a file it
              # merely mentions. Redundant today: the `.github/workflows/**`
              # catch-all below already matches it, and `.gaia/scripts/**` arms
              # the suite a second way. Listed deliberately anyway, the same
              # convention the `sandbox:` filter uses for its own redundant
              # entries, so that narrowing either glob later cannot silently drop
              # this source. It is documentation of the pairing, not the thing
              # arming it.
              - '.github/workflows/distribution-audit-pr.yml'
              # '.claude/hooks/**' is the superset of the specific hooks this
              # suite used to filter on (repo-scope.sh, pr-merge-audit-check.sh,
              # post-audit-status.sh); it now also covers every hook exercised
              # by the .gaia/tests/hooks/ suites below.
              - '.claude/hooks/**'
              # husky-pre-commit.bats (.gaia/tests/hooks/) runs the real
              # .husky/pre-commit and asserts which staged paths reach the
              # Quality Gate floor. That hook lives outside every other path
              # here, so without this line the edit the suite exists to catch --
              # an arm added to or dropped from the change-detection guard --
              # would report `code=false`, skip every bats step, and green the
              # job having run the suite zero times.
              - '.husky/**'
              - '.gaia/scripts/**'
              # check-main-root-derivation.bats (.gaia/scripts/tests/) scans
              # tracked source for a hand-rolled main-checkout derivation, and
              # settings.json is one of the files that scan reads: hook commands
              # live there as inline shell. It matches no other pattern here, so
              # without this line a change that inlines a derivation into
              # settings.json alone would skip every bats step and green the job
              # having run that scan zero times.
              - '.claude/settings.json'
              # check-wiki-state-collision.bats (.gaia/scripts/tests/) asserts
              # that wiki/.state.json stays tracked and that no merge driver is
              # bound to it, which is what keeps a cross-branch collision on the
              # single recorded sha a conflict rather than a silent overwrite.
              # Those are exactly the two files the check reads, and both match
              # nothing else here, so without these lines the edits the check
              # exists to catch -- untracking the state file, or adding a
              # .gitattributes that resolves it automatically -- would skip every
              # bats step and green the job having run that scan zero times.
              # .gitattributes is listed at both depths because git honors a
              # nested one and a root-level glob would not match it.
              - 'wiki/.state.json'
              - '.gitattributes'
              - '**/.gitattributes'
              # debt-origin-contract.bats (.gaia/scripts/tests/) asserts the
              # tech-debt rollout command is byte-identical between its two
              # homes, one of which is CHANGELOG.md, so that file's CONTENT is a
              # source this suite guards rather than a file it merely mentions.
              # It matches nothing else here, so without this line a
              # CHANGELOG-only edit to that fence -- trimming the entry, dropping
              # the --limit that keeps the sweep off a default page size -- would
              # report `code=false`, skip every bats step, and green the job
              # having run that comparison zero times. Same test-source pairing
              # as code-review-audit.yml above.
              - 'CHANGELOG.md'
              # shell-lint.bats (.gaia/scripts/tests/) asserts the wiring of the
              # local shell gate .gaia/tests/shell-lint.sh -- its .husky/*
              # discovery pass and its lint-hook-array-guard.sh invocation. The
              # gate sits at the top of .gaia/tests/, matching none of the four
              # .gaia/tests/*/ globs below, so without this line an edit dropping
              # one of those passes would report `code=false`, skip every bats
              # step, and green the job having run the assertions written to catch
              # that edit zero times. shell-lint.yml does not backstop it: a gate
              # that lints fewer files reports fewer findings, so a dropped pass
              # looks identical to a clean tree. Same test-dir/source-dir pairing
              # as the entries above.
              - '.gaia/tests/shell-lint.sh'
              # run-bats-parallel.sh is the runner the bats step below invokes,
              # and it sits at the top of .gaia/tests/ too, matching none of the
              # four .gaia/tests/*/ globs below, exactly like the gate above.
              # Without this line an edit to the runner -- to its per-PID wait,
              # its replay order, or its fail-closed table handling -- would
              # report `code=false`, skip the bats step, and green this job
              # having run the six suite directories zero times. Its own
              # adversarial suite lives in .gaia/tests/lib/, already listed
              # below, so it needs no entry of its own.
              - '.gaia/tests/run-bats-parallel.sh'
              # The audit-guard-structural suite (.gaia/scripts/tests/) greps the
              # prose of these three instruction files for the no-op-guard wiring
              # (SPEC-025 plan DP-005). An instruction-only edit touches none of
              # the source dirs above, so without these three paths the suite
              # would not re-trigger on drift of the surfaces it guards.
              - '.claude/skills/gaia/references/spec.md'
              - '.claude/skills/gaia/references/plan.md'
              - '.claude/agents/code-audit-frontend.md'
              # The doc-isolation suite (.gaia/tests/lib/) renders the prompt out
              # of the shared isolation reference and greps both callers' pointer
              # wiring, so the fragment and debt.md are sources it guards too.
              # plan.md is already listed above.
              - '.claude/skills/gaia/references/isolation.md'
              - '.claude/skills/gaia/references/debt.md'
              # The doc-difficulty-prose suite (.gaia/tests/lib/) greps the
              # difficulty-grading rubric and both machine filing routes;
              # code-audit-frontend.md and debt.md are already listed above,
              # add the other two. The suite also asserts that `difficulty`
              # appears in NONE of the sibling audit members, so those four are
              # sources it guards too: without the glob, a PR adding grading
              # prose to one of them matches no pattern here, every bats step
              # skips, and the job greens having run the very assertion written
              # to catch that edit zero times. The glob is a superset of the
              # code-audit-frontend.md entry above (patterns OR together) and
              # self-maintains when a new member joins the roster.
              - '.claude/skills/file-tech-debt/SKILL.md'
              - '.claude/skills/gaia/references/audit.md'
              - '.claude/agents/code-audit-*.md'
              # doc-machinery-waive-prose.bats (.gaia/tests/lib/) greps the
              # out-of-scope disposition rule on this page; it is a source the
              # suite guards, and it matches no other pattern here.
              - 'wiki/concepts/PR Merge Workflow.md'
              # doc-audit-verification-gate.bats (.gaia/tests/lib/) greps this
              # page's description of the classification-verification round.
              # It is the THIRD surface stating the Run-vs-Skip criterion, and
              # the one that drifted: a fix landed on the two audit.md surfaces
              # and left this page asserting the criterion that fix rejected.
              # Same test-dir/source-dir pairing as the line above, and it
              # matches no other pattern here, so without it a wiki-only edit
              # reintroducing the superseded phrasing would report `code=false`,
              # skip every bats step, and green the job having run the very
              # assertion written to catch that edit zero times.
              - 'wiki/concepts/GAIA Audit.md'
              # The doc-setup-gaia-isolation and doc-gaia-init-isolation suites
              # (.gaia/tests/lib/) grep the /setup-gaia Phase 3.5 clause and the
              # /gaia-init Step 9 question block; trigger on the two command
              # files that carry that prose so an edit to either re-runs its
              # suite.
              - '.claude/commands/setup-gaia.md'
              - '.claude/commands/gaia-init.md'
              - '.gaia/tests/forensics/**'
              - '.gaia/tests/hooks/**'
              - '.gaia/tests/lib/**'
              # The cross-directory bats helper (.gaia/tests/helpers/) is sourced
              # by suites in .gaia/scripts/tests/, .gaia/tests/lib/ and
              # .gaia/tests/hooks/, and it holds the byte-identity assertion
              # those suites depend on. It sits at the top of .gaia/tests/,
              # matching none of the .gaia/tests/*/ globs above, so without this
              # line an edit that weakened the helper alone would report
              # `code=false`, skip every bats step, and green the job having run
              # the assertions it broke zero times.
              - '.gaia/tests/helpers/**'
              # The .gaia/tests/lib/ suites exercise the SPEC-ledger lib scripts
              # under .specify/extensions/gaia/lib/ (spec-archive-merged.sh and
              # its shared cost-consolidate.sh, the allocators, ledger-update,
              # etc.), so trigger on that source dir too. A source-only edit then
              # runs the suite, matching the test-dir + source-dir pairing the
              # filters above already use (.gaia/tests/hooks/** + .claude/hooks/**;
              # .gaia/tests/forensics/** + .github/forensics/**).
              - '.specify/extensions/gaia/lib/**'
              # registry.bats (.gaia/tests/lib/) asserts every commands/*.md
              # file is registered in extension.yml's provides.commands and
              # every registered file: resolves on disk; trigger on both
              # guarded surfaces so an unregistered command file (the #651
              # drift the suite exists to catch) re-runs the suite.
              - '.specify/extensions/gaia/commands/**'
              - '.specify/extensions/gaia/extension.yml'
              - '.claude/skills/gaia/references/forensics*'
              - '.github/forensics/**'
              # The statusline suite (.gaia/tests/statusline/) exercises the
              # shipped .gaia/statusline/gaia-statusline.sh worktree gate and
              # segment rendering, and it runs real copies of the two
              # refreshers that feed those segments:
              # .gaia/scripts/check-updates.sh (the hardenUnclassifiedCount
              # segment, and the audit nudge's project_drift suppression) and
              # .gaia/scripts/debt-count-refresh.sh (the coveredPaths that
              # suppression keys on). Both refreshers are already covered by
              # the .gaia/scripts/** glob above, so only the two statusline
              # dirs need listing here -- but narrowing that glob would stop
              # arming this suite on two of the three sources it guards.
              - '.gaia/statusline/**'
              - '.gaia/tests/statusline/**'
              # retrigger-reachability.bats (.gaia/scripts/tests/) reads every
              # workflow in .github/workflows/ and the retrigger_workflows knob
              # in .gaia/audit-ci.yml, so both are sources it guards. Without
              # them, the edit the suite exists to catch -- a required check's
              # workflow losing its workflow_dispatch trigger, or dropping out
              # of the knob -- matches no pattern here, every bats step skips,
              # and the job greens having run that assertion zero times. The
              # workflows glob self-maintains as the declared-required set
              # changes, the same reasoning as the code-audit-*.md glob above.
              - '.github/workflows/**'
              - '.gaia/audit-ci.yml'
              # check-hook-scope-manifest.bats (.gaia/scripts/tests/) asserts
              # coverage + conformance of the hook tree-scope manifest; a
              # manifest-only edit touches neither .claude/hooks/** nor
              # .gaia/scripts/** above, so without these two lines it would
              # match no pattern here and skip the very suite that guards it.
              - '.gaia/hook-scopes.json'
              - '.gaia/hook-scopes.schema.json'
              # The INV-7 concurrency meter (.gaia/tests/concurrency/) and the
              # sources it drives. Most are already listed above -- it copies
              # .claude/hooks/**, .gaia/scripts/**, .gaia/statusline/** and
              # .specify/extensions/gaia/lib/** into its fixtures at their real
              # repo-relative paths -- but these five are not, and each is a
              # source the meter reads:
              #   state-registry.json + schema  copied into every fixture, so a
              #     registry edit changes what the meter observes.
              #   .gaia/cli/src/**  C3-05 runs the real TypeScript storage
              #     functions through the CLI's tsx; C5-03's call-site check
              #     greps the wiki and release command surfaces.
              #   .claude/commands/gaia-release.md  the other surface C5-03
              #     greps for a resolver consult.
              #   both lockfiles  three scenarios resolve `typescript`/`tsx`
              #     from installed dependencies, and a dependency bump touches
              #     a lockfile without touching any source dir here. That is a
              #     live path in this repo (/update-deps runs on its own
              #     cadence), so without them a bump could red the meter and
              #     the next unrelated PR would be the first to notice.
              #   both workspace files  same argument as the lockfiles, same
              #     installs: pnpm-workspace.yaml governs `allowBuilds`,
              #     `trustPolicyExclude` and `minimumReleaseAge` for the very
              #     `pnpm install --frozen-lockfile` runs the meter depends on,
              #     and each is edited standalone. .gaia/cli/pnpm-workspace.yaml
              #     documents ERR_PNPM_IGNORED_BUILDS in its own header, so a
              #     missing allowBuilds entry breaking the install is observed
              #     behavior here, not a hypothetical.
              - '.gaia/tests/concurrency/**'
              - '.gaia/state-registry.json'
              - '.gaia/state-registry.schema.json'
              - '.gaia/cli/src/**'
              - '.claude/commands/gaia-release.md'
              - 'pnpm-lock.yaml'
              - '.gaia/cli/pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.gaia/cli/pnpm-workspace.yaml'
              # The remaining two install inputs. No sibling workflow lists
              # .node-version, but this job is the one that reads it
              # (node-version-file below) AND is judged by a scenario count, so
              # a toolchain edit silently skipping the meter is the same hazard
              # as a lockfile edit doing so. package.json pins packageManager
              # for pnpm/action-setup.
              - '.node-version'
              - 'package.json'
              - '.npmrc'
            # The .gaia/tests/sandbox/ conformance tree gets its OWN filter
            # output instead of joining `code:` above, and the reason is cost,
            # not tidiness. One of its suites git-greps every committed
            # .json/.md/.yml/.yaml file in the repo, so an honest read set for
            # it is those four globs and nothing narrower. Folding them into
            # `code:` would arm this job's two pnpm installs and the INV-7
            # concurrency meter on very nearly every pull request. As its own
            # output it arms only the bats step below, plus the apt install that
            # step needs.
            #
            # Be honest about what that still costs, because it is a real change
            # in this job's posture rather than a free addition. Those four globs
            # match 459 of 1471 tracked files, a bit under a third, but they are
            # the documentation and configuration types, so the PRs that arm
            # `sandbox` alone are the ones that used to run no step at all: a
            # wiki-only change now runs `apt-get update`, unless its paths also
            # match `code:` above, in which case the full bats matrix runs
            # instead. `apt-get update` is the flakiest operation in this job,
            # and this is a declared-required context, so a mirror hash-sum
            # mismatch can now red a required check on a docs-only PR. A pure app-only change is not in
            # that set: app/ is .tsx/.ts/.css and matches neither output, so it
            # still runs nothing. The broad read set is the honest one and
            # narrowing it would trade a visible cost for a silent gap; the
            # exposure is bounded to an apt install.
            # Read the four broad globs at the end of this list first: they
            # cover every committed .json/.md/.yml/.yaml, which is most of what
            # these suites read. Only three entries above them are load-bearing
            # on their own, the ones whose file type those globs do not reach:
            # the suite dir itself (.bats), the CLI schema (.ts), and the .env
            # guard hook (.sh). Each is marked below. The rest are redundant
            # today and kept deliberately, so that narrowing the broad globs
            # later cannot silently drop a suite's source; a reader auditing
            # completeness should know which is which rather than assume every
            # line is the only thing arming its suite.
            sandbox:
              # LOAD-BEARING: .bats, reached by no broad glob.
              - '.gaia/tests/sandbox/**'
              # doc-setup-gaia.bats greps the sandbox-decision block of the
              # /setup-gaia command doc, and pins its `.sandbox_recommended`
              # reader literal byte-identical against the schema writer key, so
              # the schema is a source it guards as much as the doc is. The doc
              # is already covered by '**/*.md'; the schema is LOAD-BEARING,
              # being .ts.
              - '.claude/commands/setup-gaia.md'
              - '.gaia/cli/src/schemas/automation-config.ts'
              # wiki-page.bats greps the shipped OS Sandbox wiki page. Already
              # covered by '**/*.md'; listed so the suite's source stays armed
              # if that glob is ever narrowed.
              - 'wiki/concepts/OS Sandbox.md'
              # spec-028-composition.bats asserts the .env deny entries the
              # settings file carries and the hook that backs them. The settings
              # file is already covered by '**/*.json'; the hook is
              # LOAD-BEARING, being .sh. Note that a filter output is evaluated
              # independently of its siblings, so `code:` listing either of these
              # does nothing for this output.
              - '.claude/settings.json'
              - '.claude/hooks/block-env-read.sh'
              # manifest-and-enable.bats git-greps EVERY committed file of these
              # four types for a raw top-level sandbox enable, in both the flat
              # key form and the nested object form, so its read set is
              # literally all of them and any narrower glob would be a filter
              # that omits a path the suite reads. Neither forbidden spelling is
              # written out here on purpose: this file is a *.yml, so the suite
              # greps this very comment, and quoting them reds the suite. One
              # glob per type is the whole set at every depth: dorny/paths-filter
              # matches with picomatch `{dot: true}` (MatchOptions in its
              # src/filter.ts, at the SHA pinned above), so `**/` both descends
              # into .claude/, .gaia/ and .github/ and matches zero segments,
              # covering root-level package.json and CHANGELOG.md too.
              - '**/*.json'
              - '**/*.md'
              - '**/*.yml'
              - '**/*.yaml'
      # python3-yaml pins the parser (python3+pyyaml) that every
      # `require_yaml_parser` gate on this runner needs. Three suites carry one:
      # block-invalid-yaml-write.bats, whose gate sits in setup() and so covers
      # all of its tests with no fallback; retrigger-reachability.bats, which
      # gates 15 of its tests behind it, also with no fallback; and
      # lint-yaml.bats, whose gate also accepts `yq`, so on a runner carrying yq
      # that suite still parses. All three FAIL rather than `skip` when
      # GITHUB_ACTIONS is set, precisely so dropping this package reds the run
      # here instead of retiring the whole self-heal reachability invariant, and
      # the YAML-write hook's coverage, behind `ok ... # skip`. Those gates are
      # what enforce this line; this comment only explains it. Pin the package
      # here rather than resting on whatever the runner image happens to
      # preinstall.
      # Admits `sandbox` as well as `code`, so a PR that arms only that output
      # still gets bats on the box. This is what puts bats there deterministically:
      # ubuntu-latest does not preinstall it. run-all.sh does carry an
      # `npx -y bats@latest` fallback, so dropping this line would not
      # necessarily red the step, but it would trade an apt package for a
      # per-run npm download from a second network dependency, inside a
      # declared-required context. Keep the install here and let the fallback
      # serve the hand-run case it was written for.
      - if: steps.filter.outputs.code == 'true' || steps.filter.outputs.sandbox == 'true' || github.event_name == 'workflow_dispatch'
        name: Install bats and YAML parser
        run: sudo apt-get update && sudo apt-get install -y bats python3-yaml zsh
      # The six bats suite directories run CONCURRENTLY in this one step: one
      # step rather than six, and one job rather than six jobs.
      # .gaia/tests/run-bats-parallel.sh forks each directory, captures its
      # stdout and stderr to a log of its own, and waits on each PID
      # INDIVIDUALLY, so any suite's non-zero exit fails this step -- a bare
      # `wait` returns only the last job's status and would green a real
      # failure. It then replays the logs in a fixed table order, independent of
      # which suite finished first, and prints a per-suite exit-code and timing
      # summary that recovers what the Actions UI loses when six steps become
      # one. Staying inside one job keeps this a single hop, so the chain
      # ceiling .gaia/scripts/tests/retrigger-reachability.bats computes over
      # the `needs:` graph is unaffected. The runner's own adversarial suite is
      # .gaia/tests/lib/run-bats-parallel.bats, one of the directories it forks.
      #
      # The hook suites are authored/run locally on macOS bash 3.2.57, where a
      # false mid-test `[[ ... ]]` does NOT fail the test (bash 3.2 skips it
      # under set -e), so a broken assertion can green locally. Ubuntu bats runs
      # under bash 5, which enforces `[[ ]]`, making this the authoritative gate
      # for token-tally-git-op.bats, token-rollup-merge.bats, and siblings. The
      # four node-dependent RED-verify suites self-skip here (no node_modules on
      # this lean box); see their setup() guards.
      #
      # The SPEC-ledger lib suites (.specify/extensions/gaia/lib/ scripts):
      # spec-archive-merged.sh + the shared cost-consolidate.sh routine, the
      # spec/plan allocators, folderize, renumber, reconcile, ledger-update,
      # with-ledger-lock. Same bash-5 rationale as the hook suites above. On this
      # lean box flock is present (the mkdir-fallback test's flock branch runs
      # instead of self-skipping) and the real project ledger is absent
      # (.gaia/local/ is gitignored), so spec-ledger-status's project-ledger
      # test self-skips; both are green outcomes.
      - if: steps.filter.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
        name: Run the six bats suite directories in parallel
        run: bash .gaia/tests/run-bats-parallel.sh
      # The sandbox-enablement conformance tree. Gated on the `sandbox` filter
      # output rather than `code`, so a PR touching only a file this tree reads
      # runs it without arming the two pnpm installs and the concurrency meter
      # below. Invoked through run-all.sh, matching the forensics step above and
      # the contract that script documents in its own header.
      #
      # Two of its 20 tests self-skip here and both are green outcomes, not
      # gaps: UAT-016 needs a sandbox-capable runner (bubblewrap/socat, which
      # ubuntu-latest does not have and its header says so), and the docs-link
      # reachability check skips under CI so a third-party outage cannot red a
      # declared-required context. The other 18 run.
      - if: steps.filter.outputs.sandbox == 'true' || github.event_name == 'workflow_dispatch'
        name: Run .gaia/tests/sandbox bats suites
        run: bash .gaia/tests/sandbox/run-all.sh
      # Everything below arms the INV-7 concurrency meter. Note what that
      # changes about this job's posture, as a deliberate choice rather than a
      # side effect: a job that previously ran only bats on a lean box now
      # executes dependency install scripts from a `pull_request` head on every
      # armed run. Accepted because the exposure is bounded the same way
      # tests.yml's already is -- a read-only GITHUB_TOKEN, no secrets in
      # scope, and lifecycle scripts gated by `allowBuilds` in both
      # pnpm-workspace.yaml files (which is why both are in the path filter
      # above). Node comes first because three of its scenarios drive real node
      # code, and none of them can borrow the escape hatch the five sibling
      # suites under
      # .gaia/tests/hooks/ use: those guard the same `typescript` dependency
      # with `|| skip "typescript not installed"`, and the meter BANS `skip` in
      # its own header on the grounds that a skip reports green, which is the
      # opposite of what a red-by-design suite means. meter-gate.sh enforces
      # that ban, so the suite cannot borrow the hatch -- it has to actually
      # have the dependency.
      #
      # TWO installs, not one, and the reason is structural: .gaia/cli is
      # deliberately its own isolated pnpm workspace
      # (.gaia/cli/pnpm-workspace.yaml), so a repo-root install does not reach
      # it. The root install is what C4-04 and C4-07 need (their node helpers
      # resolve `typescript` from the repo root); the .gaia/cli install is what
      # C3-05 needs (it runs the CLI's own tsx binary out of
      # .gaia/cli/node_modules, which is gitignored and so absent on a fresh
      # checkout). Skipping either flips a landed, green scenario red for want
      # of an npm install, which would read as a regression in the number this
      # program is judged by rather than as the environment gap it is.
      #
      - if: steps.filter.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
        name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - if: steps.filter.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
        name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
          # Both lockfiles: the meter installs both workspaces, so warming the
          # store on only one leaves the other cold.
          cache-dependency-path: |
            pnpm-lock.yaml
            .gaia/cli/pnpm-lock.yaml
      - if: steps.filter.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
        name: Install root dependencies (C4-04 and C4-07 resolve typescript here)
        run: pnpm install --frozen-lockfile
      - if: steps.filter.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
        name: Install .gaia/cli dependencies (C3-05 runs the CLI's own tsx)
        run: pnpm -C .gaia/cli install --frozen-lockfile
      # Runs the WHOLE suite and adjudicates every scenario against
      # .gaia/tests/concurrency/expected-status.txt, so any scenario the
      # manifest marks red by design does not wedge this required check while
      # still counting in the reading. A `bats --filter` over the armed
      # tranches was the alternative and is worse: it hides the reds and makes
      # a newly added scenario invisible by default.
      - if: steps.filter.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
        name: Run the INV-7 concurrency meter (gated on its expected-status manifest)
        run: bash .gaia/tests/concurrency/meter-gate.sh
