name: Code Review Audit

# Pre-merge gate that runs the `code-review-audit` agent
# (.claude/agents/code-audit-frontend.md) against the PR diff. Skipped when
# (a) the PR HEAD already carries a matching `GAIA-Audit:` commit trailer
# (locally-stamped audit), (b) the un-audited delta (since the last clean
# audit) contains no audit-relevant files (wiki, instruction files, and
# other prose-only surfaces are out of scope), or (c) the PR modifies this
# workflow file itself
# (claude-code-action's workflow-validation guardrail would refuse to
# run, so the audit cannot complete regardless). Adopter-tunable knobs
# live at .gaia/audit-ci.yml.
#
# Per-author mode (local vs ci): the "Resolve audit decision" step calls the
# shared resolver (.gaia/scripts/read-audit-ci-config.sh --resolve-author)
# with the PR author and override-label presence. When it resolves `local`
# with no override AND the change is in audit scope, CI stands down: it spends
# no audit tokens and the "Stand down" step posts a `pending` GAIA-Audit status
# (no cleared-shaped description) so the merge stays blocked until the local
# merge path runs the audit and clears it. Every expensive step and the
# audit-downstream stamps gain `&& should_run == 'true'`; the resolution is
# subordinate to the scope gates (it only runs in-scope and not self-modifying),
# so out-of-scope / self-mod PRs take the existing success-stamp paths unchanged
# and never also post a stand-down.
#
# Required-check semantics under classic branch protection: the job is
# green-by-design on every code path (including a local-mode stand-down where
# no audit ran); the GATE is the `GAIA-Audit` commit STATUS, not the job name.
# Each path still reaches a terminal "set check status / comment" step so the
# job concludes cleanly. A `pending` GAIA-Audit status (the stand-down) blocks
# the merge button; a `success` status with HEAD's version+tree clears it. All
# gating is expressed at the step level (mirrors `.github/workflows/tests.yml`).
#
# Third-party actions are pinned to full-length commit SHAs (resolved tag in parens):
#   actions/checkout              @ 3d3c42e5aac5ba805825da76410c181273ba90b1 (v7.0.1)
#   pnpm/action-setup             @ 0977fd99725f1db4007ccb2928dbb4e90d06cc86 (v6.0.10)
#   actions/setup-node            @ 820762786026740c76f36085b0efc47a31fe5020 (v7.0.0)
#   anthropics/claude-code-action @ 63322d7b2bc79e7b621b89f41b53ceb8e5a5d314 (v1.0)

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions: {}

concurrency:
  group: code-review-audit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  code-review-audit:
    name: code-audit-frontend
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      statuses: write
      id-token: write
      # `actions: write` lets the self-heal re-trigger step dispatch
      # required workflows on the PR branch after pushing self-heal
      # commits. `checks: write` lets it stamp a `code-review-audit`
      # check run on the new HEAD so branch protection accepts the
      # already-audited tree without re-running this workflow.
      actions: write
      checks: write
      # `issues: write` lets the agent file out-of-scope findings as
      # deduped, severity-labeled `tech-debt` disposition issues (and
      # create the `tech-debt`/`severity:*`/`wontfix` labels) from CI.
      # The top-level `permissions: {}` stays default-deny; this grant
      # is job-scoped, matching the existing pattern.
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Read audit-ci config
        id: config
        run: bash .gaia/scripts/read-audit-ci-config.sh >> "$GITHUB_OUTPUT"

      - name: Check gate label
        id: gate
        env:
          GATE_LABEL: ${{ steps.config.outputs.gate_label }}
          PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -eu
          if [ -z "$GATE_LABEL" ]; then
            {
              echo "gated=false"
              echo "reason=no-gate-label-configured"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s' "$PR_LABELS_JSON" \
              | jq -e --arg l "$GATE_LABEL" 'index($l)' >/dev/null; then
            {
              echo "gated=false"
              echo "reason=label-present"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "gated=true"
              echo "reason=label-missing"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Check chore-deps title
        id: chore-deps
        if: steps.gate.outputs.gated == 'false'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -eu
          # Pre-verified dep-bump PRs (the /update-deps wrapper runs the full
          # quality gate locally before pushing) skip the audit. Predicate
          # lives in .gaia/scripts/chore-deps-skip.sh. Assigned first, then
          # echoed: a substitution inside echo's argument is a status `set -e`
          # cannot see, so a predicate that failed to run would write an empty
          # `skip` that satisfies neither the skip=='true' nor the skip=='false'
          # arms below, firing no terminal status writer and no terminal
          # comment step, and leaving the merge gate unsatisfiable in silence.
          skip="$(bash .gaia/scripts/chore-deps-skip.sh "$PR_TITLE")"
          echo "skip=${skip}" >> "$GITHUB_OUTPUT"

      - name: Resolve audit base
        id: base
        if: |
          steps.gate.outputs.gated == 'false' &&
          steps.chore-deps.outputs.skip == 'false'
        run: |
          set -eu
          # Incremental scope: resolve the most recent ancestor on this PR that
          # already passed a CLEAN audit under the current agent version
          # (proven by a GAIA-Audit commit trailer or commit status). Resolved
          # here, before the source-change check, so that check and the audit
          # share one base: everything before <base> was already cleared. Falls
          # back to the branch this PR merges into (origin/main when none is
          # declared), full PR scope, when no audited ancestor exists
          # (first audit, prior runs cancelled/failed, or a .gaia/VERSION bump
          # invalidated them). A helper failure falls back to full scope rather
          # than failing the audit. That last-resort literal stays origin/main
          # rather than this PR's own base: it fires only when the helper itself
          # could not run, and repeating the ref the rest of this workflow
          # already assumes is a safer answer there than one this step would
          # have to re-derive. Where origin/main does not resolve, because the
          # repository's default branch is named something else, the next step
          # exits non-zero: this path fails loudly rather than reviewing a
          # wrong scope.
          base="$(bash .github/audit/resolve-audit-base.sh || echo origin/main)"
          echo "base=${base}" >> "$GITHUB_OUTPUT"
          echo "code-review-audit: incremental review base = ${base}" >&2

      - name: Check for source-code changes
        id: source-changes
        if: |
          steps.gate.outputs.gated == 'false' &&
          steps.chore-deps.outputs.skip == 'false'
        env:
          AUDIT_BASE: ${{ steps.base.outputs.base }}
        run: |
          set -eu
          # Audit-relevant scope: TS/TSX/CSS code under app/, tests,
          # .storybook configs, GitHub workflow files, and root-level
          # build/lint/test/typecheck configs. PRs whose UN-AUDITED DELTA
          # (<audit-base>...HEAD) only touches wiki/, .claude/, .specify/,
          # prose docs, or .gaia/ metadata are skipped; the agent has no rules
          # that would meaningfully apply. The base is the last clean-audited
          # ancestor, so once a code commit is audited clean a later prose-only
          # commit reviews an empty auditable delta and skips. With no audited
          # ancestor the base is the branch this PR merges into (origin/main
          # when none is declared) → full PR diff, preserving first-audit
          # behavior.
          # -z, so a non-ASCII path is not C-quoted past the patterns below:
          # unquoted, an in-scope change can read as has_source=false and skip
          # the audit entirely. The `tr` stays inside the substitution because
          # `$(...)` discards NUL bytes, and the subshell sets pipefail so a git
          # failure still aborts under `set -e` as it did before the pipe.
          changed=$(set -o pipefail; git diff --name-only -z "${AUDIT_BASE}...HEAD" | tr '\0' '\n')
          dir_pattern='^(app|test|\.storybook|\.github/workflows)/'
          file_pattern='^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml)$|^tsconfig[^/]*\.json$|^[^/]*\.config\.(ts|mts|mjs|cjs|js)$'
          if printf '%s\n' "$changed" | grep -qE "${dir_pattern}|${file_pattern}"; then
            echo "has_source=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_source=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check workflow self-modification
        id: workflow-self-mod
        if: |
          steps.gate.outputs.gated == 'false' &&
          steps.source-changes.outputs.has_source == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          # claude-code-action enforces a workflow-validation guardrail:
          # it refuses to run when the workflow file on the PR branch
          # differs from the version on main (security: prevents secret
          # exfiltration via PR-modified workflows). When this PR
          # touches the workflow itself, the audit cannot run, so skip
          # cleanly and surface a truthful comment instead of letting
          # the abort path post a misleading message.
          # -z for the same reason as the scope gate above. The path this one
          # matches is pure ASCII and git would never quote it, so this is
          # uniformity rather than a live defect; the class is cheaper to hold
          # everywhere than to re-argue per call site.
          changed=$(set -o pipefail; git diff --name-only -z "${BASE_SHA}..${HEAD_SHA}" | tr '\0' '\n')
          if printf '%s\n' "$changed" | grep -qE '^\.github/workflows/code-review-audit\.yml$'; then
            echo "self_modified=true" >> "$GITHUB_OUTPUT"
          else
            echo "self_modified=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve audit phase
        id: phase
        # The shared audit-phase precondition, computed once. Every step below
        # that runs only when the job has reached the audit phase reads this one
        # output instead of restating the chain, so tightening the preconditions
        # is a single edit rather than one edit per guarded step. A site that
        # missed such an edit would guard on a strict subset of its siblings and
        # fire on a path the new precondition was meant to exclude. Because the
        # guarded steps are the ones that write the `GAIA-Audit` commit status
        # `.claude/hooks/pr-merge-audit-check.sh` gates merges on, that is the
        # merge gate failing OPEN, and CI cannot catch it: each guard covers a
        # different code path and one PR exercises only one of them.
        #
        # No `if:`, so the output is always defined on every path that reaches
        # here. Each input is compared against its passing literal rather than
        # tested for non-emptiness: a skipped upstream step yields the empty
        # string, which must read as "did not reach the audit phase", never as a
        # pass. Fail-closed is the safe direction for a merge gate.
        env:
          GATED: ${{ steps.gate.outputs.gated }}
          HAS_SOURCE: ${{ steps.source-changes.outputs.has_source }}
          SELF_MODIFIED: ${{ steps.workflow-self-mod.outputs.self_modified }}
        run: |
          set -eu
          if [ "$GATED" = 'false' ] \
              && [ "$HAS_SOURCE" = 'true' ] \
              && [ "$SELF_MODIFIED" = 'false' ]; then
            echo "reached_audit=true" >> "$GITHUB_OUTPUT"
          else
            echo "reached_audit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve audit decision
        id: decision
        # Per-author mode resolution. Subordinate to the scope gates above:
        # only meaningful once there is in-scope source and the PR is not
        # self-modifying. Delegates to the shared resolver
        # (.gaia/scripts/read-audit-ci-config.sh --resolve-author) so the CI
        # side and the local merge path read the SAME resolved_mode for an
        # author and can never diverge. The resolver is a pure function of
        # the config, the author, the override-label presence, and the fork
        # flag (PR_IS_FORK, supplied below from the event payload); its
        # answer never depends on GITHUB_ACTIONS or on any other signal that
        # differs between callers. A fork PR always resolves to `ci`, ahead
        # of every other rule (including an audit_authors pin and the
        # override label). should_run == 'false' (local mode, no
        # override, not a fork, in scope) means CI stands down and the local
        # path runs the audit instead.
        if: |
          steps.phase.outputs.reached_audit == 'true' &&
          steps.chore-deps.outputs.skip == 'false'
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          OVERRIDE_LABEL: ${{ steps.config.outputs.override_label }}
          PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          set -eu
          # Compute override-label presence from the PR's labels, then pass it
          # to the shared resolver via the Phase 1 input form
          # (OVERRIDE_LABEL_PRESENT=true; any-case true/yes/1 → present, absent
          # → not present). The resolver owns precedence + normalization +
          # required-check fail-closed; this step stays thin so it is
          # reviewable by inspection.
          if [ -n "$OVERRIDE_LABEL" ] \
              && printf '%s' "$PR_LABELS_JSON" \
                | jq -e --arg l "$OVERRIDE_LABEL" 'index($l)' >/dev/null; then
            override_present=true
          else
            override_present=false
          fi
          OVERRIDE_LABEL_PRESENT="$override_present" \
          PR_IS_FORK="$PR_IS_FORK" \
            bash .gaia/scripts/read-audit-ci-config.sh \
              --resolve-author "$PR_AUTHOR" >> "$GITHUB_OUTPUT"

      - name: Check audit trailer
        id: trailer
        if: |
          steps.phase.outputs.reached_audit == 'true' &&
          steps.decision.outputs.should_run == 'true'
        run: bash .github/audit/check-trailer.sh >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        if: |
          steps.phase.outputs.reached_audit == 'true' &&
          steps.decision.outputs.should_run == 'true' &&
          steps.trailer.outputs.skip == 'false'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        if: |
          steps.phase.outputs.reached_audit == 'true' &&
          steps.decision.outputs.should_run == 'true' &&
          steps.trailer.outputs.skip == 'false'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        if: |
          steps.phase.outputs.reached_audit == 'true' &&
          steps.decision.outputs.should_run == 'true' &&
          steps.trailer.outputs.skip == 'false'
        run: pnpm install --frozen-lockfile

      - name: Compute audit step timeout
        id: timeout
        if: |
          steps.phase.outputs.reached_audit == 'true' &&
          steps.decision.outputs.should_run == 'true' &&
          steps.trailer.outputs.skip == 'false'
        env:
          BUDGET_SECONDS: ${{ steps.config.outputs.budget_seconds }}
        run: |
          set -eu
          # Convert budget_seconds → minutes (rounded up). Floor of 1 so
          # the action never gets a `timeout-minutes: 0` (treated as "no
          # timeout" by GitHub Actions). Default 30 if the value is
          # missing/zero.
          if [ -z "$BUDGET_SECONDS" ] || [ "$BUDGET_SECONDS" -eq 0 ]; then
            minutes=30
          else
            minutes=$(( (BUDGET_SECONDS + 59) / 60 ))
            [ "$minutes" -lt 1 ] && minutes=1
          fi
          echo "minutes=$minutes" >> "$GITHUB_OUTPUT"

      - name: Resolve debt provenance
        id: provenance
        # Never fail the job over provenance. Enumerating the abort paths does
        # not hold: every write here redirects into `$out`, so whatever breaks
        # the primary redirect breaks its `||` fallback too, and `set -e` takes
        # the step down. A red step here is skipped by the audit and by every
        # terminal status writer, none of which carries `always()`, so the pull
        # request would end with no GAIA-Audit status at all. This closes every
        # arm at once; nothing reads `steps.provenance.*`, so it costs nothing.
        # Same precedent as the audit step below.
        continue-on-error: true
        if: |
          steps.phase.outputs.reached_audit == 'true' &&
          steps.decision.outputs.should_run == 'true' &&
          steps.trailer.outputs.skip == 'false'
        env:
          # The FULL-PR base, not steps.base.outputs.base (the incremental
          # audit base). The provenance `changed` field answers "did this pull
          # request touch the cited file at all", which the whole-PR fork point
          # answers and the incremental base does not: on a re-audit round the
          # incremental base covers only the delta since the previous round.
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          # The agent's CI tool policy grants no shell for the derivation
          # helper, so this step runs it and hands the agent finished lines.
          # Three are pre-rendered rather than one plus an assembly rule,
          # because assembling the line in the prompt would be a second
          # implementation of the encoding and could not stay byte-identical
          # to a local run.
          out=.gaia/local/audit/provenance
          mkdir -p "$out"
          for c in 0 1 unknown; do
            bash .gaia/scripts/debt-origin-lib.sh \
              --changed "$c" --branch "${PR_BRANCH:-}" \
              > "$out/origin.changed-$c.txt" 2>/dev/null \
              || : > "$out/origin.changed-$c.txt"
          done
          # Three-dot: it resolves its own merge base rather than diffing the
          # recorded base tip directly.
          # No pathspec: a finding on a non-TypeScript file this pull request
          # touched must read 1, not 0.
          # -z so the recorded list carries real path bytes rather than a
          # C-quoted rendering of them. No pipefail subshell here, unlike the
          # gates above: this call already tolerates its own failure through the
          # `|| :` fallback, and a git failure still yields the empty file that
          # fallback exists to create.
          git diff --name-only -z "${PR_BASE_SHA}...HEAD" 2>/dev/null \
            | tr '\0' '\n' > "$out/pr-changed-files.txt" \
            || : > "$out/pr-changed-files.txt"

      - name: Run code-review-audit (claude-code-action)
        id: audit
        if: |
          steps.phase.outputs.reached_audit == 'true' &&
          steps.decision.outputs.should_run == 'true' &&
          steps.trailer.outputs.skip == 'false'
        # Continue on failure: max-turns / SDK / API errors must not strand
        # the PR check in a half-state. The status-summary terminal steps
        # below comment the outcome regardless.
        continue-on-error: true
        timeout-minutes: ${{ fromJSON(steps.timeout.outputs.minutes) }}
        uses: anthropics/claude-code-action@63322d7b2bc79e7b621b89f41b53ceb8e5a5d314 # v1.0
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Run the code-audit-frontend agent at .claude/agents/code-audit-frontend.md.
            Review the INCREMENTAL diff ${{ steps.base.outputs.base }}...HEAD; this
            base is the most recent commit on this PR that already passed a clean
            audit under the current agent version (or, with none, the branch
            this PR merges into), so
            everything before it is already cleared and only the delta needs
            review. For any exported symbol whose signature or contract changed in
            this delta, also check its importers across the repo even if those
            files are unchanged; an incremental scope must still catch a delta
            that breaks an already-cleared caller. When the agent's report has
            no Critical or Important issues, you MUST stamp the GAIA-Audit
            trailer per .claude/hooks/audit-stamp-trailer.sh. The checkout is at
            a detached HEAD (PR head sha), so the stamp helper writes an empty
            `chore: code review audit passed` commit carrying the trailer; do
            not pass `AUDIT_SELF_HEALED=true` (the helper's amend path would
            rewrite a commit the workflow runner does not own). On a clean
            report you MUST also write the local clean marker via the shared
            clearance writer, `bash .gaia/scripts/audit-write-clearance.sh
            --root "$(git rev-parse --show-toplevel)" --member
            code-audit-frontend --provenance earned`, which resolves the
            member's content digest from `--root` and writes
            `.gaia/local/audit/<digest>.ok` keyed to that digest, not the
            commit sha or tree (the "Audit marker" step in the agent
            definition). Write it even if the trailer
            stamp declines or makes no commit: when nothing is pushed, the
            workflow promotes this marker to the durable GAIA-Audit commit
            status on HEAD, and a clean audit that leaves no marker strands the
            merge gate. Any self-heal
            file edits go in their own commit (or commits) BEFORE you call the
            stamp helper. After the audit and stamp, post a single PR comment
            summarizing findings (and whether self-heal commits were pushed).

            FINDINGS BLOCK: append a machine-readable findings block to the END
            of that same PR comment, after the human-readable summary. The block
            is a JSON object wrapped INSIDE an HTML comment so it does not render,
            framed by two stable sentinel lines. The cross-machine tally pass
            parses it; the sentinels are the parse anchors, emit them verbatim:

            <!-- gaia-harden:findings:start -->
            <!--
            {"schema":1,"pr_number":PR_NUMBER,"auditor":"ci","findings":[
              {"finding_class":"react-doctor/no-generic-handler-names","severity":"warning","area_tags":["app/components"]},
              {"finding_class":"holistic/missing-auth-check","severity":"error","area_tags":["app/routes"]}
            ]}
            -->
            <!-- gaia-harden:findings:end -->

            Substitute PR_NUMBER with this PR's number. One object per finding you
            assigned a stable `finding_class`, using the per-bucket convention in
            `.claude/agents/code-audit-frontend.md` (oracle ids verbatim with the
            tool prefix; the controlled holistic/rule vocabulary otherwise). Carry
            only `finding_class`, `severity` (error/warning/suggestion), and
            `area_tags` per finding, never code or file contents. Omit any finding
            with no stable class (it stays in the prose summary). If you classified
            zero findings, still emit the block with `"findings":[]`, an explicit
            empty block is parseable, a missing one is ambiguous.

            DISPOSITION (out-of-scope findings): the agent files out-of-scope
            findings as deduped, severity-labeled `tech-debt` issues per its own
            definition (.claude/agents/code-audit-frontend.md). Three CI-mode
            invariants are load-bearing because this run is `--verbose` and posts
            to a PUBLIC channel, so they are restated here (the CI prompt is the
            load-bearing copy for the CI run):
            1. BODY VIA FILE: pass every `gh issue` / advisory body via
               `--body-file <path>` or stdin, NEVER a `--body` argv string.
               `--verbose` echoes command lines into the public Actions log, so a
               `--body` argv would leak finding detail. This mirrors the
               agent-definition rule.
            2. SECURITY DIVERT (count-only): a security-class finding on a
               PUBLIC/INTERNAL repo NEVER becomes a public or internal issue. The
               default GITHUB_TOKEN cannot POST a repository security advisory, and
               the privileged-credential mechanism is DEFERRED -- do NOT wire one
               in v1. Instead surface a redacted COUNT-ONLY signal to the public
               PR comment (e.g. "N security-class findings diverted; maintainer
               must review") with no file:line, no finding text, no finding_class.
               The marker still writes -- never a public issue, never a marker
               deadlock. Durable tracking of diverted PUBLIC/INTERNAL security
               findings is deferred.
            3. PUBLIC COMMENT CARRIES COUNTS ONLY: the disposition feature adds
               only COUNTS to the public PR comment -- no out-of-scope finding
               detail, no security detail, no file:line. The FINDINGS BLOCK above
               is unchanged (it carries only finding_class / severity / area_tags).

            PROVENANCE (`gaia-debt-origin`): this workflow resolved the
            provenance line in a step of its own, because the CI tool policy
            grants no shell for the derivation helper. Derive no provenance
            field yourself and restate no vocabulary; the contract lives in
            `.claude/skills/file-tech-debt/SKILL.md`. Using the Read tool (no
            shell reader is granted for these paths), read
            `.gaia/local/audit/provenance/pr-changed-files.txt` (the pull
            request's fork-point changed-file set) and the three pre-rendered
            lines at `.gaia/local/audit/provenance/origin.changed-0.txt`,
            `origin.changed-1.txt`, and `origin.changed-unknown.txt`. For each
            finding you file as a `tech-debt` issue, and for each finding you
            record as machinery-waived in the pull-request body, copy one of
            those lines verbatim onto its own line immediately after the
            `gaia-debt-key` line, never merged into it: `origin.changed-1.txt`
            when the finding's cited path appears in `pr-changed-files.txt` as
            its own complete line, `origin.changed-0.txt` when it does not,
            `origin.changed-unknown.txt` when `pr-changed-files.txt` is missing
            or empty. If a pre-rendered file is missing or empty, omit the line
            and continue; never block, fail, retry, or defer a filing or a waive
            over provenance. The line is an HTML comment, adding nothing to the
            rendered issue or the public PR comment's visible text, and carries
            no finding detail, so it does not touch the count-only invariants above:
            `branch`, `mode`, `unit`, `changed`, and `head` say nothing about
            what the finding is.

            SELF-HEAL CONSTRAINTS: read before making any edits:
            1. Run `git diff --name-only ${{ github.event.pull_request.base.sha }}...HEAD`
               first. Self-heal edits are ONLY permitted on files that appear in
               this list. Never edit a file that was not changed by this PR. The
               base sha rather than origin/main: on a PR stacked on another
               branch the range from main also carries the base branch's own
               commits, so the permitted set would be a superset of what this PR
               changed and this constraint would pass on a file this PR never
               touched.
            2. Run `git diff ${{ github.event.pull_request.base.sha }}...HEAD -- <file>`
               before editing any file.
               If the PR's diff for that file shows lines being REMOVED (minus lines),
               do NOT restore them. Intentional deletions are not defects.
            3. Never add content that references a library, tool, or pattern that this
               PR removed. The PR diff is the source of truth for intent.
            4. NEVER edit files under `.claude/`, `.specify/`, or `wiki/` as part of
               a self-heal. These define the project's conventions, skills, and this
               agent's own definition, not code defects. If one looks wrong, raise
               it as a finding for human review. The workflow's self-heal scope gate
               refuses any self-heal that touches them.
          claude_args: |
            --max-turns ${{ steps.config.outputs.max_turns }}
            --allowedTools "Edit,Write,Bash(git:*),Bash(pnpm:*),Bash(node:*),Bash(npm:*),Bash(gh:*),Bash(bash .gaia/scripts/audit-write-clearance.sh:*),Bash(bash .gaia/scripts/check-debt-issue-metadata.sh:*)"
            --verbose

      - name: Print audit progress breadcrumbs
        # Public-safe observability. The agent (show_full_output:false hides its
        # SDK output) writes curated per-phase breadcrumbs to a tree-keyed
        # gitignored file via Write/Edit, keyed to the tree it started reviewing
        # (AUDIT_TREE_SHA); this step surfaces it in the step summary AFTER the
        # agent runs. Gate MIRRORS the agent step exactly (not always(), not
        # success()) so partial breadcrumbs surface even on an aborted audit.
        # Always exits 0: a missing/empty file must never fail the required
        # check.
        if: |
          steps.phase.outputs.reached_audit == 'true' &&
          steps.decision.outputs.should_run == 'true' &&
          steps.trailer.outputs.skip == 'false'
        env:
          # The PUSHED PR head sha, not `git rev-parse HEAD`. On a self-heal run
          # the agent commits its fix during its own turn, before this step and
          # before "Commit and push self-heal" pushes it, so the runner's local
          # HEAD can already be one commit (one tree) ahead of what was pushed
          # when the agent captured AUDIT_TREE_SHA and keyed its breadcrumb file.
          # $HEAD_SHA is always the tree the agent started from.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set +e
          tree_sha="$(git rev-parse "${HEAD_SHA}^{tree}" 2>/dev/null)"
          progress=""
          [ -n "$tree_sha" ] && progress=".gaia/local/audit/${tree_sha}.progress.log"
          {
            echo "## code-review-audit progress"
            echo ""
            if [ -z "$tree_sha" ]; then
              echo "_Progress unavailable: could not resolve HEAD's tree._"
            elif [ -s "$progress" ]; then
              echo '```'
              cat "$progress"
              echo '```'
            else
              echo "_No breadcrumbs recorded (audit wrote none, or aborted before the first phase)._"
            fi
          } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null
          # Mirror to the step log for log-only consumers.
          if [ -n "$progress" ] && [ -s "$progress" ]; then
            echo "code-review-audit progress:"
            cat "$progress"
          fi
          exit 0

      - name: Commit and push self-heal
        id: push-fixes
        if: |
          steps.phase.outputs.reached_audit == 'true' &&
          steps.decision.outputs.should_run == 'true' &&
          steps.trailer.outputs.skip == 'false' &&
          steps.config.outputs.push_fixes == 'true' &&
          steps.audit.outcome == 'success'
        run: |
          set -eu
          # Push gate: any combination of (a) commits the agent made
          # (self-heal commits and/or the stamp helper's empty trailer
          # commit) ahead of origin, OR (b) leftover uncommitted edits
          # the agent forgot to commit. Both must reach origin/PR_BRANCH.
          git config user.name 'gaia-code-review-audit[bot]'
          git config user.email 'gaia-code-review-audit[bot]@users.noreply.github.com'

          # Drop claude-code-action's untrusted-PR file restore before the tree
          # is inspected or staged. The action restores a fixed set of sensitive
          # config/hook paths from the branch this PR merges into, into the
          # runner's working tree before the agent runs (it logs "Restoring ...
          # from origin/<base branch> (PR head is untrusted)"). When this PR
          # legitimately modifies one of them, that restore REVERTS the PR's
          # change in the working tree; the
          # `git add -u` below would then stage the revert and commit it as a
          # bogus self-heal -- this is what stripped a .husky/pre-commit guard a
          # PR had just added. The agent is never an allowed editor of these
          # convention/hook surfaces, so any working-tree delta on them is either
          # the action's restore or a forbidden edit; reset each to HEAD either
          # way. Keep this list in sync with claude-code-action's restore set,
          # which leads with .claude: omitting it leaves the base branch's
          # .claude/** in the tree on any PR that changes it, and the self-heal
          # scope gate below then reads that revert as the agent having edited a
          # governance surface and discards the whole self-heal.
          for restored_path in \
            .claude .husky .mcp.json .claude.json .gitmodules .ripgreprc \
            CLAUDE.md CLAUDE.local.md; do
            git checkout HEAD -- "$restored_path" 2>/dev/null || true
          done

          # Surface untracked files for transparency. The agent or
          # claude-code-action may leave runtime artifacts (e.g. .claude-pr/)
          # behind; .gitignore should cover known cases. We never stage them.
          # NUL-delimited so a non-ASCII path is reported as itself rather than
          # in git's C-quoted spelling; the subshell sets pipefail because the
          # step's shell is `bash -e` without it. The count deletes everything
          # except the record separators and counts those, rather than
          # translating them to newlines and counting lines: a path containing a
          # literal newline would otherwise count twice. Deliberately no
          # pipefail on the `head -20` pipeline below, where `tr` dying on
          # SIGPIPE would abort the step under `set -e`.
          untracked="$(set -o pipefail; git -c core.quotepath=false ls-files --others --exclude-standard -z | tr -cd '\0' | wc -c | tr -d ' ')"
          if [ "$untracked" -gt 0 ]; then
            echo "code-review-audit: $untracked untracked file(s) left behind by audit (NOT staged):" >&2
            git -c core.quotepath=false ls-files --others --exclude-standard -z | tr '\0' '\n' | head -20 >&2
          fi

          # Self-heal scope gate. One refusal set
          # (.claude/hooks/lib/audit-selfheal-paths.sh), sourced here and by the
          # local producer's PreToolUse hook
          # (.claude/hooks/block-selfheal-paths.sh), names every domain a
          # self-healing member must never touch: the tests that would catch
          # its own bad repair, the CI pipeline and the rest of .github/**, the
          # gate machinery and roster under .gaia/, instruction/convention
          # surfaces (.claude/**, .specify/**, wiki/**), which are the rules
          # this audit enforces and the agent's own definition, and root-level
          # build/lint/test/typecheck configuration. A self-heal that edits
          # any of these is almost always reverting intentional PR work, or
          # disabling the very check that would catch its own bad repair.
          # Inspect both committed self-heal commits and uncommitted edits; if
          # any touch the refused set, refuse the whole self-heal and surface
          # it for human review (mirrors the >10-file gate below). The early
          # `exit 0` runs before the commit/push logic, so nothing the audit
          # changed reaches origin.
          # shellcheck source=/dev/null
          . .claude/hooks/lib/audit-selfheal-paths.sh
          # -z on both halves, with one `tr` after the group: the refuse-set ERE
          # below is matched against these paths, so a C-quoted path would slip
          # past the refusal and let a self-heal edit a surface this gate exists
          # to protect. Failure posture is unchanged -- the second call keeps its
          # own `|| true`, and the group already tolerated an empty first half.
          self_heal_paths="$(
            {
              git diff --name-only -z
              git diff --name-only -z "origin/${PR_BRANCH}..HEAD" 2>/dev/null || true
            } | tr '\0' '\n' | sort -u
          )"
          if printf '%s\n' "$self_heal_paths" \
              | grep -qE "$AUDIT_SELFHEAL_REFUSE_ERE"; then
            echo "code-review-audit: self-heal touched a refused surface (tests, the CI pipeline, .gaia/ gate machinery, instruction/convention surfaces, or root build config) -- refusing." >&2
            printf '%s\n' "$self_heal_paths" \
              | grep -E "$AUDIT_SELFHEAL_REFUSE_ERE" >&2 || true
            {
              echo "pushed=false"
              echo "marker_only=false"
              echo "refused=true"
              echo "refused_reason=governance-surface"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git diff --quiet; then
            # Stage modifications and deletions to TRACKED files only -- never
            # `git add -A`, which would sweep audit runtime artifacts.
            git add -u

            # Self-heal sanity gate. A code review audit's auto-fix surface
            # should be small (a typo, a stale import). A sprawling diff is
            # a red flag -- the agent is likely undoing intentional PR work
            # rather than fixing a defect. Refuse and surface for human review.
            #
            # The count reads the NUL separators themselves rather than
            # translating them back to newlines: a `| tr '\0' '\n' | wc -l`
            # round-trip would count a path holding a literal newline twice and
            # refuse a compliant self-heal. The diagnostic below does translate,
            # because it is read by a human.
            files_changed="$(set -o pipefail; git diff --cached --name-only -z | tr -cd '\0' | wc -c | tr -d ' ')"
            if [ "$files_changed" -gt 10 ]; then
              echo "code-review-audit: self-heal would touch $files_changed files (>10) -- refusing." >&2
              echo "Files staged:" >&2
              git diff --cached --name-only -z | tr '\0' '\n' >&2
              git reset >/dev/null
              {
                echo "pushed=false"
                echo "marker_only=false"
                echo "refused=true"
                echo "refused_reason=file-count"
                echo "refused_count=$files_changed"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if ! git diff --cached --quiet; then
              git commit -m "chore: code-review-audit self-heal"
            fi
          fi

          # A commit is the empty marker iff: (a) its tree equals its parent's
          # tree (empty commit), AND (b) its message carries a GAIA-Audit:
          # trailer line.
          is_marker_commit() {
            sha="$1"
            parent="$(git rev-parse "${sha}^" 2>/dev/null || true)"
            [ -n "$parent" ] || return 1
            head_tree="$(git rev-parse "${sha}^{tree}")"
            parent_tree="$(git rev-parse "${parent}^{tree}")"
            [ "$head_tree" = "$parent_tree" ] || return 1
            git log -1 --format='%B' "$sha" | grep -q '^GAIA-Audit:' || return 1
            return 0
          }

          ahead=$(git rev-list --count "origin/${PR_BRANCH}..HEAD" 2>/dev/null || echo 0)
          if [ "$ahead" -eq 0 ]; then
            {
              echo "pushed=false"
              echo "marker_only=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Case A: the ONLY commit ahead of origin is the empty marker.
          # GitHub does not re-trigger CI for GITHUB_TOKEN pushes, so pushing
          # the empty marker would strand the PR on a HEAD with zero checks.
          # Skip the push; the GAIA-Audit status step stamps HEAD~1 instead.
          if [ "$ahead" -eq 1 ] && is_marker_commit HEAD; then
            audit_sha="$(git rev-parse HEAD~1)"
            echo "code-review-audit: marker-only HEAD; not pushing the empty commit." >&2
            {
              echo "pushed=false"
              echo "marker_only=true"
              echo "audit_sha=${audit_sha}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Case B: real self-heal commits exist. If the marker is sitting on
          # top of them, drop it before pushing so we never push the empty
          # commit. Soft reset keeps the working tree clean (the marker is
          # empty), matching the real self-heal HEAD.
          if is_marker_commit HEAD; then
            git reset --soft HEAD~1
            echo "code-review-audit: dropped empty marker commit before pushing self-heal." >&2
          fi

          # Re-establish authenticated remote URL before push. The agent's
          # Bash(git:*) toolset can mutate git config (remote URL, credential
          # helper, extraheader) during execution; rather than diagnose every
          # path, force a known-good token-bearing URL right before the push.
          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:$PR_BRANCH"
          audit_sha="$(git rev-parse HEAD)"
          {
            echo "pushed=true"
            echo "marker_only=false"
            echo "audit_sha=${audit_sha}"
          } >> "$GITHUB_OUTPUT"

      - name: Write GAIA-Audit commit status
        id: push-status
        if: |
          steps.phase.outputs.reached_audit == 'true' &&
          steps.decision.outputs.should_run == 'true' &&
          steps.trailer.outputs.skip == 'false' &&
          steps.audit.outcome == 'success' &&
          (steps.push-fixes.outputs.marker_only == 'true' ||
           steps.push-fixes.outputs.pushed == 'true')
        env:
          AUDIT_SHA: ${{ steps.push-fixes.outputs.audit_sha }}
          # The FULL-PR base, not steps.base.outputs.base (the incremental audit
          # base). Membership is a function of the whole PR diff; see
          # .github/audit/gate-pending-members.sh "Full-PR scope".
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          # Self-heal push path. Stamp the sha that already carries the audit's
          # check runs: a status, unlike a pushed empty commit, does not advance
          # the branch HEAD, so branch protection stays satisfied and the
          # check-name skip logic still has a durable signal to read on a re-run.
          #
          # This is the one writer whose sha comes from a step output rather than
          # the event payload, so it is the only one that can arrive EMPTY. The
          # writer skips rather than stamping nothing in particular.
          #
          # .github/audit/write-audit-status.sh owns the fail-closed rule these
          # five terminal paths share -- never stamp on an unrecomputable digest,
          # never clobber a live success -- as one copy rather than five (gaia-react/gaia#1286).
          #
          # This step carries an `id:` so its post_failed output reaches the
          # terminal "Status - audit complete" comment. A rejected status POST no
          # longer reds this step, so that comment is the only place an author is
          # told the gate is shut (gaia-react/gaia#1296).
          bash .github/audit/write-audit-status.sh \
            --sha "${AUDIT_SHA:-}" \
            --base "${PR_BASE_SHA}"

      - name: Write GAIA-Audit commit status (clean, no push)
        id: clean-status
        if: |
          steps.phase.outputs.reached_audit == 'true' &&
          steps.decision.outputs.should_run == 'true' &&
          steps.trailer.outputs.skip == 'false' &&
          steps.config.outputs.push_fixes == 'true' &&
          steps.audit.outcome == 'success' &&
          steps.push-fixes.outputs.pushed != 'true' &&
          steps.push-fixes.outputs.marker_only != 'true'
        env:
          # The PUSHED PR head sha, straight from the event payload. This is the
          # only commit GitHub is guaranteed to have; `git rev-parse HEAD` in the
          # runner can point at a local, never-pushed commit the audit created
          # during the run (an empty trailer marker, or a refused self-heal), and
          # POSTing a status to a sha GitHub does not have returns HTTP 422.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # The FULL-PR base, not steps.base.outputs.base (the incremental audit
          # base). Membership is a function of the whole PR diff; see
          # .github/audit/gate-pending-members.sh "Full-PR scope".
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          # Genuinely-clean-but-no-commit path. A clean audit that makes no
          # self-heal commits AND no empty trailer commit leaves push-fixes with
          # neither `pushed` nor `marker_only` set, so the stamp step above is
          # skipped and the PR head carries no GAIA-Audit status. The merge hook
          # (.claude/hooks/pr-merge-audit-check.sh) then finds no signal and
          # blocks the merge even though the audit passed; the only escape used to
          # be a local agent pushing an empty trailer commit, the very HEAD-moving
          # workaround this design avoids.
          #
          # This path also covers a REFUSED self-heal. `refused` means the
          # self-heal was off-limits -- an instruction/convention surface
          # (.claude/**, .specify/**, wiki/**) or a >10-file sprawl -- NOT that
          # the audit failed or the tree is dirty, so it must not gate this stamp.
          #
          # --require-marker is therefore the sole proven-clean check for every
          # no-push case, clean and refused alike: the agent writes
          # .gaia/local/audit/<digest>.ok ONLY when the review is clean. A dirty
          # audit reaches this step too (it pushed nothing) and its marker is
          # absent, so nothing is stamped and the merge stays blocked.
          #
          # Nothing was pushed here, so the pushed head's tree IS the tree that
          # will merge, even if the agent left an unpushed local commit that moved
          # the runner's HEAD off it without changing content.
          #
          # A rejected status POST never reds any of the four stamp paths, so
          # this one asks for nothing special: gaia-react/gaia#726 was an HTTP
          # 422 on an unpushed sha turning an otherwise-clean audit RED under
          # `set -eu`, and .github/audit/write-audit-status.sh now settles that
          # for every writer rather than for this one alone. This step carries an
          # `id:` so its post_failed output reaches the terminal "Status - audit
          # complete" comment.
          bash .github/audit/write-audit-status.sh \
            --sha "${HEAD_SHA}" \
            --base "${PR_BASE_SHA}" \
            --require-marker

      - name: Stand down (local-mode, no override)
        if: |
          steps.phase.outputs.reached_audit == 'true' &&
          steps.chore-deps.outputs.skip == 'false' &&
          steps.decision.outputs.should_run == 'false'
        env:
          # The PUSHED PR head sha, straight from the event payload, exactly as
          # the stamp steps above take it: `git rev-parse HEAD` in the runner
          # can point at a local, never-pushed commit and POSTing a status to a
          # sha GitHub does not have returns HTTP 422.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          # Local-mode stand-down: this author's resolved mode is `local` with no
          # override label, and the change is in audit scope. CI does NOT run the
          # audit (no tokens spent); the local merge path runs it instead. Post a
          # `pending` GAIA-Audit status on HEAD so the required check blocks the
          # merge button until the local audit clears it.
          #
          # --force-pending rather than --base: CI dispatched no members here, so
          # there is no member set to resolve and success is never this step's to
          # post. The description deliberately carries NO "<version>
          # <frontend-digest> <tree>" cleared shape -- a fixed sentinel that
          # cannot match any real digest -- so even a state-blind reader cannot
          # mistake it for cleared (defense in depth behind the state-aware
          # readers, which reject any non-success state).
          #
          # Subordinate to the scope gates (has_source == true && self_modified
          # == false): out-of-scope / self-mod PRs take the stamp paths and never
          # reach here, so exactly one terminal status lands per run.
          #
          # This is the writer where the non-clobber read bites HARDEST, not
          # least. Local mode is the common maintainer path; this step's `if:`
          # depends only on the label gate, chore-deps, has_source, self_modified
          # and should_run, NONE of which change once a `success` is live; and the
          # workflow triggers on `labeled`/`unlabeled`, re-running it on the SAME
          # head sha with no new push. Unguarded, any label touched on the PR would
          # overwrite the success the local producer had just posted.
          bash .github/audit/write-audit-status.sh \
            --sha "${HEAD_SHA}" \
            --force-pending "local mode: local producer owns the whole audit; CI dispatched zero members"

      - name: Write GAIA-Audit commit status (out-of-scope skip)
        id: oos-status
        if: |
          steps.gate.outputs.gated == 'false' &&
          steps.chore-deps.outputs.skip == 'false' &&
          steps.source-changes.outputs.has_source == 'false'
        env:
          # The PUSHED PR head sha, straight from the event payload, exactly as
          # the stamp steps above take it: `git rev-parse HEAD` in the runner
          # can point at a local, never-pushed commit and POSTing a status to a
          # sha GitHub does not have returns HTTP 422.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # The FULL-PR base, not steps.base.outputs.base (the incremental audit
          # base). Membership is a function of the whole PR diff; see
          # .github/audit/gate-pending-members.sh "Full-PR scope".
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          # Out-of-scope skip path: the un-audited delta touches no audit-relevant
          # files, so the agent never runs and a local audit would find nothing in
          # scope. Stamp a GAIA-Audit status on HEAD anyway so the merge hook
          # (.claude/hooks/pr-merge-audit-check.sh) is satisfied without a
          # ceremonial local run. has_source == 'false' structurally excludes the
          # already-audited path (has_source && trailer.skip) and the
          # self-modification path (has_source && self_modified), since both
          # require has_source == 'true', so neither auto-stamps.
          #
          # "Out of scope" here means out of scope for the FRONTEND member:
          # has_source mirrors that member's auditable-base set exactly. A
          # SPECIALIZED member's globs sit outside that set, so a diff touching
          # only framework CLI source or framework bash yields has_source ==
          # 'false' while the resolver still dispatches a member that owns every
          # changed file. Stamping success here would clear the required check --
          # and the github.com merge button -- for a diff a required auditor never
          # read. --base is what stops that: any dispatched member downgrades this
          # to `pending` and lets the local, member-aware producer clear it.
          #
          # This step carries an `id:`, so the writer's members_pending /
          # success_stamped / post_failed / success_live / read_failed outputs are
          # read by the terminal comment step. They exist so the author is never
          # told the gate is satisfied while the status says otherwise.
          bash .github/audit/write-audit-status.sh \
            --sha "${HEAD_SHA}" \
            --base "${PR_BASE_SHA}"

      - name: Write GAIA-Audit commit status (chore-deps skip)
        id: chore-deps-status
        if: |
          steps.gate.outputs.gated == 'false' &&
          steps.chore-deps.outputs.skip == 'true'
        env:
          # The PUSHED PR head sha, straight from the event payload, exactly as
          # the stamp steps above take it: `git rev-parse HEAD` in the runner
          # can point at a local, never-pushed commit and POSTing a status to a
          # sha GitHub does not have returns HTTP 422.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # The FULL-PR base, not steps.base.outputs.base (the incremental audit
          # base). Membership is a function of the whole PR diff; see
          # .github/audit/gate-pending-members.sh "Full-PR scope".
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          # chore(deps) fast-path stamp. A `chore(deps):` / `chore(deps-dev):` PR
          # skips the expensive frontend audit: the /update-deps wrapper runs the
          # full quality gate locally before pushing, so the bump is pre-verified
          # and the frontend member's clearance is implicit for this PR class (the
          # same bypass the local merge gate applies, and the same narrowing
          # tests.yml and chromatic.yml apply). But skipping the audit must NOT
          # also skip the STAMP: the required GAIA-Audit check is a POSTed commit
          # status, not a job conclusion, so unlike the other required checks it is
          # not satisfied by a job-level skip conclusion. With no stamp the
          # required context is unsatisfiable and the merge button never opens.
          #
          # Member-aware for the same reason as the out-of-scope stamp: the
          # chore(deps) bypass clears ONLY the frontend member. Any co-dispatched
          # specialized member is not covered by the pre-verified rationale, so
          # --base downgrades this to `pending` and the local producer clears it.
          # Only when none is dispatched -- the common case, and every adopter
          # case, where a dep bump touches just the frontend member's surface --
          # does frontend's implicit clearance suffice and success is stamped.
          #
          # Nothing is pushed on this path, so the pushed head's tree is the tree
          # that will merge and its frontend digest is what the success
          # description vouches for.
          bash .github/audit/write-audit-status.sh \
            --sha "${HEAD_SHA}" \
            --base "${PR_BASE_SHA}"

      - name: Re-trigger and stamp required checks on new HEAD
        if: |
          steps.phase.outputs.reached_audit == 'true' &&
          steps.trailer.outputs.skip == 'false' &&
          steps.audit.outcome == 'success' &&
          steps.push-fixes.outputs.pushed == 'true'
        env:
          AUDIT_SHA: ${{ steps.push-fixes.outputs.audit_sha }}
          RETRIGGER_WORKFLOWS: ${{ steps.config.outputs.retrigger_workflows }}
        run: |
          set -eu
          # When the audit self-heals and pushes a new commit, GitHub does
          # not fire push / pull_request events for the GITHUB_TOKEN-authored
          # push (recursion guard). The new HEAD would therefore have zero
          # check runs and branch protection would block the merge
          # indefinitely. This step closes that loop in three parts:
          #
          # 1. Stamp a `code-review-audit` check run on the new HEAD with
          #    conclusion=success. The audit just produced the new tree,
          #    so it is vouching for its own output. The version+tree
          #    binding lives in the separate GAIA-Audit commit status,
          #    which is the required check; a rejected status POST does
          #    not fail the stamp step, so this check run can land on a
          #    HEAD carrying no such status.
          # 2. Dispatch every workflow listed in `retrigger_workflows`
          #    against the PR branch. `workflow_dispatch` IS allowed
          #    under GITHUB_TOKEN (unlike push), so the dispatched runs
          #    execute on the self-heal HEAD.
          # 3. Poll each dispatched run to completion, then POST a
          #    matching check run per job to the new HEAD via the Checks
          #    API. The dispatched runs' own check suites are excluded
          #    from `statusCheckRollup` (GitHub filters out
          #    `workflow_dispatch`-event suites whose `pull_requests` link
          #    is empty), so branch protection never sees them. Direct
          #    POST'd check runs land in the rollup regardless of suite
          #    linkage; same mechanism as the `code-review-audit` stamp.
          #
          # Each `gh workflow run` failure (workflow not present, lacks
          # `workflow_dispatch:` trigger, etc.) is logged and tolerated;
          # an adopter may list a workflow that doesn't exist in their
          # repo, and the audit should not fail the PR over that.

          if [ -z "${AUDIT_SHA:-}" ]; then
            echo "code-review-audit: no audit_sha to re-trigger against; skipping." >&2
            exit 0
          fi

          # The summary points at the GAIA-Audit status rather than asserting
          # what it says. This step carries an implicit success(), and a rejected
          # status POST no longer fails the stamp step above, so this one now
          # runs on a HEAD that may carry no status at all; a summary claiming
          # the binding was recorded would be a durable artifact contradicting
          # the terminal comment the same run writes (gaia-react/gaia#1296).
          gh api "repos/${GITHUB_REPOSITORY}/check-runs" \
            --method POST \
            --field name=code-review-audit \
            --field head_sha="${AUDIT_SHA}" \
            --field status=completed \
            --field conclusion=success \
            --field 'output[title]=code-review-audit (re-stamped on self-heal HEAD)' \
            --field 'output[summary]=Audit completed on the parent commit and produced the self-heal changes that advanced HEAD to this SHA. The version + tree binding lives in the GAIA-Audit commit status, which a separate step posts and which is the required check; read that status rather than this check run for whether the gate is satisfied.' \
            >/dev/null \
            || echo "code-review-audit: failed to stamp check run on ${AUDIT_SHA}; continuing." >&2

          if [ -z "${RETRIGGER_WORKFLOWS:-}" ]; then
            echo "code-review-audit: retrigger_workflows is empty; nothing to dispatch." >&2
            exit 0
          fi

          TMPDIR_RT=$(mktemp -d)
          trap 'rm -rf "$TMPDIR_RT"' EXIT

          # Poll a dispatched workflow run to completion, then POST a
          # check run per job into the AUDIT_SHA's rollup. Returns 0
          # always; internal failures are logged and tolerated.
          poll_and_stamp() {
            workflow_name="$1"
            dispatch_ts="$2"

            run_id=""
            for _ in $(seq 1 18); do
              run_id=$(gh api \
                "repos/${GITHUB_REPOSITORY}/actions/runs?event=workflow_dispatch&branch=${PR_BRANCH}&per_page=20" \
                --jq ".workflow_runs[] | select(.name == \"${workflow_name}\" and .created_at >= \"${dispatch_ts}\") | .id" \
                | head -1) || run_id=""
              if [ -n "$run_id" ]; then
                break
              fi
              sleep 5
            done
            if [ -z "$run_id" ]; then
              echo "[${workflow_name}] WARN: dispatched run id not resolved within 90s; not stamping" >&2
              return 0
            fi
            echo "[${workflow_name}] resolved run_id=${run_id}"

            status=""
            conclusion=""
            for _ in $(seq 1 150); do
              payload=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" \
                --jq '{status, conclusion}') || payload='{"status":"unknown","conclusion":null}'
              status=$(printf '%s' "$payload" | jq -r '.status // "unknown"')
              conclusion=$(printf '%s' "$payload" | jq -r '.conclusion // ""')
              if [ "$status" = "completed" ]; then
                break
              fi
              sleep 10
            done
            if [ "$status" != "completed" ]; then
              echo "[${workflow_name}] WARN: run ${run_id} did not complete within 25 min (status=${status}); not stamping" >&2
              return 0
            fi
            echo "[${workflow_name}] run ${run_id} completed: conclusion=${conclusion}"

            jobs_file=$(mktemp)
            gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs" \
              --jq '.jobs[] | {name, conclusion}' > "$jobs_file" \
              || { echo "[${workflow_name}] WARN: failed to enumerate jobs for run ${run_id}" >&2; rm -f "$jobs_file"; return 0; }
            while IFS= read -r job_json; do
              [ -n "$job_json" ] || continue
              job_name=$(printf '%s' "$job_json" | jq -r .name)
              job_conclusion=$(printf '%s' "$job_json" | jq -r '.conclusion // ""')
              if [ -z "$job_conclusion" ] || [ "$job_conclusion" = "null" ]; then
                job_conclusion="failure"
              fi
              echo "[${workflow_name}] stamping '${job_name}' = ${job_conclusion} on ${AUDIT_SHA}"
              gh api "repos/${GITHUB_REPOSITORY}/check-runs" \
                --method POST \
                --field name="${job_name}" \
                --field head_sha="${AUDIT_SHA}" \
                --field status=completed \
                --field conclusion="${job_conclusion}" \
                --field "output[title]=${job_name} (stamped from dispatched run ${run_id})" \
                --field "output[summary]=GitHub excludes workflow_dispatch-event check suites from statusCheckRollup when their pull_requests link is empty (the case for GITHUB_TOKEN-attributed dispatches). This stamp mirrors the dispatched run's per-job conclusion into a directly-attributable check run so branch protection sees the result." \
                >/dev/null \
                || echo "[${workflow_name}] WARN: stamp POST for '${job_name}' failed" >&2
            done < <(jq -c '.' "$jobs_file")
            rm -f "$jobs_file"
          }

          # Phase 1: dispatch every retrigger workflow, fork a background
          # poll_and_stamp per successful dispatch.
          pids=""
          while IFS= read -r workflow_name; do
            [ -n "$workflow_name" ] || continue
            dispatch_ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            echo "code-review-audit: dispatching '${workflow_name}' on ${PR_BRANCH} at ${dispatch_ts}" >&2
            if gh workflow run "$workflow_name" --ref "$PR_BRANCH" 2>&1; then
              log_name=$(printf '%s' "$workflow_name" | tr -c 'A-Za-z0-9._-' '_')
              log="${TMPDIR_RT}/${log_name}.log"
              poll_and_stamp "$workflow_name" "$dispatch_ts" >"$log" 2>&1 &
              pids="$pids $!"
            else
              echo "code-review-audit: dispatch of '${workflow_name}' failed -- workflow may be absent or missing workflow_dispatch trigger." >&2
            fi
          done < <(printf '%s\n' "$RETRIGGER_WORKFLOWS")

          # Phase 2: wait for every background poller, then stream its log.
          for pid in $pids; do
            wait "$pid" || true
          done

          for log in "$TMPDIR_RT"/*.log; do
            [ -f "$log" ] || continue
            echo "----- $(basename "$log") -----"
            cat "$log"
          done

      # ----------------------------------------------------------------
      # Terminal status steps. Exactly one fires per run; together they
      # guarantee the job reaches a clean conclusion on every code path
      # (the job is green-by-design). The required-check gate is the
      # `GAIA-Audit` commit STATUS posted by the stamp / stand-down steps
      # above, not the job name: a `pending` stand-down blocks the merge
      # while the job is still green. These comments are advisory.
      # ----------------------------------------------------------------

      - name: Status - skipped (gate label missing)
        if: steps.gate.outputs.gated == 'true'
        env:
          GATE_LABEL: ${{ steps.config.outputs.gate_label }}
        run: |
          set -eu
          bash .github/audit/cra-status-upsert.sh "$PR_NUMBER" \
            "code-review-audit skipped: gate_label '$GATE_LABEL' not present on PR"

      - name: Status - skipped (chore-deps PR)
        if: |
          steps.gate.outputs.gated == 'false' &&
          steps.chore-deps.outputs.skip == 'true'
        env:
          MEMBERS_PENDING: ${{ steps.chore-deps-status.outputs.members_pending }}
          SUCCESS_STAMPED: ${{ steps.chore-deps-status.outputs.success_stamped }}
          SUCCESS_LIVE: ${{ steps.chore-deps-status.outputs.success_live }}
          READ_FAILED: ${{ steps.chore-deps-status.outputs.read_failed }}
          POST_FAILED: ${{ steps.chore-deps-status.outputs.post_failed }}
        run: |
          set -eu
          # chore(deps) / chore(deps-dev) PRs skip the expensive frontend audit
          # (pre-verified by the /update-deps wrapper's local quality gate), but
          # the "Write GAIA-Audit commit status (chore-deps skip)" step still
          # stamps the required GAIA-Audit status so the merge gate is
          # satisfiable. This comment reports WHICH outcome that step reached,
          # mirroring the "no source changes" comment: a bare "skipped" line would
          # read as green even on the pending / not-stamped paths.

          # A GAIA-Audit success for this commit's tree is already live (every
          # dispatched member cleared locally); CI declined to clobber it. Checked
          # first: members_pending stays non-empty here because CI cannot see a
          # local marker, so the pending branch below would otherwise tell the
          # author to clear an already-green gate.
          if [ "${SUCCESS_LIVE:-}" = "true" ]; then
            bash .github/audit/cra-status-upsert.sh "$PR_NUMBER" \
              "code-review-audit skipped: chore(deps) PRs are pre-verified by the /update-deps local quality gate. GAIA-Audit is already green for this commit's tree, every dispatched member has cleared. No action needed"
            exit 0
          fi
          # The non-clobber guard could not read the current GAIA-Audit status, so
          # the stamp step stood down having posted nothing; the gate's true state
          # is unknown.
          if [ "${READ_FAILED:-}" = "true" ]; then
            bash .github/audit/cra-status-upsert.sh "$PR_NUMBER" \
              "code-review-audit skipped: chore(deps) PR, but this diff dispatches ${MEMBERS_PENDING}, and the current GAIA-Audit status could not be read, so its state is unknown. Run the dispatched member(s) locally to be sure the merge gate is clear"
            exit 0
          fi
          # A co-dispatched specialized member CI cannot run is present; the
          # pre-verified rationale covers only the frontend member, so the stamp
          # step posted `pending`, not `success`, and a local audit of that member
          # is required.
          if [ -n "${MEMBERS_PENDING:-}" ]; then
            bash .github/audit/cra-status-upsert.sh "$PR_NUMBER" \
              "code-review-audit skipped: chore(deps) PR, but this diff dispatches ${MEMBERS_PENDING}, which CI cannot run. GAIA-Audit is pending, not green: run the dispatched member(s) locally to clear the merge gate"
            exit 0
          fi
          # The stamp step reached the POST and GitHub rejected it. Checked
          # before the generic no-stamp branch below, whose stated cause is a
          # missing .gaia/VERSION: that would send the author to repair a file
          # that is fine. A rejected POST no longer reds the stamp step, so this
          # comment is the whole signal.
          if [ "${POST_FAILED:-}" = "true" ]; then
            bash .github/audit/cra-status-upsert.sh "$PR_NUMBER" \
              "code-review-audit skipped: chore(deps) PR, but the GAIA-Audit status POST was rejected by GitHub (rate limit, 5xx, or auth blip), so NO status was stamped on HEAD and the merge gate is NOT satisfied. Re-run this workflow, or run a local audit, to stamp it"
            exit 0
          fi
          # The stamp step bowed out having posted NOTHING (unrecomputable frontend
          # digest, or .gaia/VERSION missing/empty). The gate fails closed, so a
          # bare "skipped" line would claim the opposite of what happened.
          if [ "${SUCCESS_STAMPED:-}" != "true" ]; then
            bash .github/audit/cra-status-upsert.sh "$PR_NUMBER" \
              "code-review-audit skipped: chore(deps) PR, but NO GAIA-Audit commit status was stamped on HEAD, so the merge gate is NOT satisfied. Most likely .gaia/VERSION is missing/empty or the frontend digest could not be recomputed; see the 'Write GAIA-Audit commit status (chore-deps skip)' step log. Restore .gaia/VERSION, or run a local audit, to clear the gate"
            exit 0
          fi
          bash .github/audit/cra-status-upsert.sh "$PR_NUMBER" \
            "code-review-audit skipped: chore(deps) / chore(deps-dev) PRs are pre-verified by the /update-deps local quality gate; GAIA-Audit commit status stamped on HEAD so the merge gate is satisfied"

      - name: Status - skipped (no source changes)
        if: |
          steps.gate.outputs.gated == 'false' &&
          steps.source-changes.outputs.has_source == 'false'
        env:
          MEMBERS_PENDING: ${{ steps.oos-status.outputs.members_pending }}
          SUCCESS_STAMPED: ${{ steps.oos-status.outputs.success_stamped }}
          SUCCESS_LIVE: ${{ steps.oos-status.outputs.success_live }}
          READ_FAILED: ${{ steps.oos-status.outputs.read_failed }}
          POST_FAILED: ${{ steps.oos-status.outputs.post_failed }}
        run: |
          set -eu
          # Checked BEFORE members_pending, which is still non-empty on this
          # path: the status step stood down because a GAIA-Audit success for
          # this commit's tree is already live, meaning every dispatched member
          # cleared locally and CI deliberately declined to overwrite it with
          # `pending`. CI cannot see a local marker, so it still names those
          # members as pending -- and the members_pending branch below would
          # therefore tell the author to clear a gate that is already green.
          # Under-claiming is as much a lie as over-claiming here.
          if [ "${SUCCESS_LIVE:-}" = "true" ]; then
            bash .github/audit/cra-status-upsert.sh "$PR_NUMBER" \
              "code-review-audit skipped: no files in the frontend auditor's scope. GAIA-Audit is already green for this commit's tree, every dispatched member has cleared. No action needed"
            exit 0
          fi
          # Also checked BEFORE members_pending: the status step could not tell
          # whether a GAIA-Audit success for this tree is already live (the
          # non-clobber guard's read failed), so it stood down having stamped
          # nothing. The members_pending branch below asserts "pending, not
          # green", a claim this step never verified on this exit; the gate's
          # true state is exactly what the guard could not read.
          if [ "${READ_FAILED:-}" = "true" ]; then
            bash .github/audit/cra-status-upsert.sh "$PR_NUMBER" \
              "code-review-audit skipped: no files in the frontend auditor's scope, but this diff dispatches ${MEMBERS_PENDING}, and the current GAIA-Audit status could not be read, so its state is unknown. Run the dispatched member(s) locally to be sure the merge gate is clear"
            exit 0
          fi
          # "No source changes" is frontend-relative: has_source mirrors that
          # member's auditable-base set. When a SPECIALIZED member still owns a
          # changed file, the status step above posted `pending`, not `success`,
          # so the merge gate is NOT satisfied and a local audit IS required.
          # Report that instead of the free-skip message, which would otherwise
          # tell the author the button is open while it is shut.
          if [ -n "${MEMBERS_PENDING:-}" ]; then
            bash .github/audit/cra-status-upsert.sh "$PR_NUMBER" \
              "code-review-audit skipped: no files in the frontend auditor's scope, but this diff dispatches ${MEMBERS_PENDING}, which CI cannot run. GAIA-Audit is pending, not green: run the dispatched member(s) locally to clear the merge gate"
            exit 0
          fi
          # The status step reached the POST and GitHub rejected it. Checked
          # before the branch below, whose stated cause is a missing
          # .gaia/VERSION: that would send the author to repair a file that is
          # fine. A rejected POST no longer reds the status step, so this comment
          # is the whole signal.
          if [ "${POST_FAILED:-}" = "true" ]; then
            bash .github/audit/cra-status-upsert.sh "$PR_NUMBER" \
              "code-review-audit skipped: no files in the frontend auditor's scope, but the GAIA-Audit status POST was rejected by GitHub (rate limit, 5xx, or auth blip), so NO status was stamped on HEAD and the merge gate is NOT satisfied. Re-run this workflow, or run a local audit, to stamp it"
            exit 0
          fi
          # The status step can also bow out having posted NOTHING (.gaia/VERSION
          # missing or empty). The gate fails closed there -- an absent required
          # check shuts the button -- so the free-skip message below would tell the
          # author the exact opposite of what happened, with the only truthful
          # signal buried in that step's log. Anything other than a confirmed
          # `true` is read as no-stamp, so a future reshape that drops the output
          # degrades to the cautious message rather than a false green.
          if [ "${SUCCESS_STAMPED:-}" != "true" ]; then
            bash .github/audit/cra-status-upsert.sh "$PR_NUMBER" \
              "code-review-audit skipped: no audit-relevant files changed in the un-audited delta (since the last clean audit), but NO GAIA-Audit commit status was stamped on HEAD, so the merge gate is NOT satisfied. Most likely .gaia/VERSION is missing or empty; see the 'Write GAIA-Audit commit status (out-of-scope skip)' step log. Restore .gaia/VERSION, or run a local audit, to clear the gate"
            exit 0
          fi
          bash .github/audit/cra-status-upsert.sh "$PR_NUMBER" \
            "code-review-audit skipped: no audit-relevant files changed in the un-audited delta (since the last clean audit); GAIA-Audit commit status stamped on HEAD so the merge gate is satisfied with no local audit run"

      - name: Status - skipped (trailer matches)
        if: |
          steps.phase.outputs.reached_audit == 'true' &&
          steps.trailer.outputs.skip == 'true'
        env:
          MATCHED_VERSION: ${{ steps.trailer.outputs.matched_version }}
          MATCHED_TREE: ${{ steps.trailer.outputs.matched_tree }}
        run: |
          set -eu
          short_tree="$(printf '%s' "$MATCHED_TREE" | cut -c1-7)"
          bash .github/audit/cra-status-upsert.sh "$PR_NUMBER" \
            "code-review-audit skipped: GAIA-Audit trailer matches version $MATCHED_VERSION tree $short_tree"

      - name: Status - skipped (workflow self-modification)
        if: |
          steps.gate.outputs.gated == 'false' &&
          steps.source-changes.outputs.has_source == 'true' &&
          steps.workflow-self-mod.outputs.self_modified == 'true'
        run: |
          set -eu
          bash .github/audit/cra-status-upsert.sh "$PR_NUMBER" \
            "code-review-audit skipped: PR modifies the audit workflow itself; claude-code-action's workflow-validation guardrail would refuse to run"

      - name: Status - local-mode stand-down
        # Green terminal step for the local-mode stand-down path. The JOB
        # stays green-by-design; the GATE is the `GAIA-Audit` STATUS. The
        # stand-down step posts that status as `pending` ONLY when it reads
        # back a definitive "no success live" for HEAD's tree. When a success
        # IS live it leaves it alone (the local producer already cleared every
        # dispatched member, so the gate is legitimately green), and when the
        # read is unanswerable it posts nothing, which fails closed: an absent
        # required check blocks the merge just as a `pending` one does. The
        # message below holds on all three, because it points the author at the
        # local merge path, which is a no-op when the gate is already green.
        # Gated identically to the stand-down step so exactly one terminal
        # status step fires per run.
        if: |
          steps.phase.outputs.reached_audit == 'true' &&
          steps.chore-deps.outputs.skip == 'false' &&
          steps.decision.outputs.should_run == 'false'
        env:
          OVERRIDE_LABEL: ${{ steps.config.outputs.override_label }}
        run: |
          set -eu
          bash .github/audit/cra-status-upsert.sh "$PR_NUMBER" \
            "code-review-audit standing down for this author (local mode). Merge via Claude (which runs the audit locally) or add the '${OVERRIDE_LABEL}' label to force a CI audit."

      - name: Status - audit aborted
        # `continue-on-error: true` on the audit step keeps the workflow
        # alive after the audit fails so this terminal step can post the
        # truthful comment. `outcome != 'success'` is the only reliable
        # signal that the audit did not run cleanly (the audit step's
        # `conclusion` is forced to success by `continue-on-error`).
        # Common causes: max-turns hit, SDK error, transient API
        # failure, or a workflow-validation refusal that slipped past
        # the self-modification skip. After commenting, `exit 1`
        # surfaces the abort as a red check on the PR; without it, the
        # green-check-plus-aborted-comment combo silently hides real
        # audit failures from PR authors.
        if: |
          steps.phase.outputs.reached_audit == 'true' &&
          steps.decision.outputs.should_run == 'true' &&
          steps.trailer.outputs.skip == 'false' &&
          steps.audit.outcome != 'success'
        run: |
          set -eu
          bash .github/audit/cra-status-upsert.sh "$PR_NUMBER" \
            "code-review-audit aborted: workflow validation refusal, max-turns, SDK error, or transient API failure (see workflow run logs)"
          exit 1

      - name: Status - audit complete
        if: |
          steps.phase.outputs.reached_audit == 'true' &&
          steps.decision.outputs.should_run == 'true' &&
          steps.trailer.outputs.skip == 'false' &&
          steps.audit.outcome == 'success'
        env:
          PUSHED: ${{ steps.push-fixes.outputs.pushed }}
          REFUSED: ${{ steps.push-fixes.outputs.refused }}
          REFUSED_COUNT: ${{ steps.push-fixes.outputs.refused_count }}
          REFUSED_REASON: ${{ steps.push-fixes.outputs.refused_reason }}
          PUSH_FIXES: ${{ steps.config.outputs.push_fixes }}
          # Whichever of the two stamp steps this run reached; they are mutually
          # exclusive, and a step that did not run contributes an empty string.
          # This comment is the only one covering either path, so without these a
          # shut gate would leave "complete: no fixes needed" standing beside it.
          #
          # The full set the two skip comments read, not just post_failed: a
          # rejected POST is one of five ways those stamp steps end with nothing
          # stamped, and reporting one of the five would make the silence on the
          # other four read as a clean finish.
          #
          # `||` is safe on every one of them. The two steps cannot both run, a
          # skipped step contributes '', and the only non-empty falsy-looking
          # value any of them takes is the literal `false` on success_stamped,
          # which GitHub expressions treat as a truthy non-empty string, so it is
          # never silently replaced by the other step's empty output.
          MEMBERS_PENDING: ${{ steps.push-status.outputs.members_pending || steps.clean-status.outputs.members_pending }}
          SUCCESS_STAMPED: ${{ steps.push-status.outputs.success_stamped || steps.clean-status.outputs.success_stamped }}
          SUCCESS_LIVE: ${{ steps.push-status.outputs.success_live || steps.clean-status.outputs.success_live }}
          READ_FAILED: ${{ steps.push-status.outputs.read_failed || steps.clean-status.outputs.read_failed }}
          POST_FAILED: ${{ steps.push-status.outputs.post_failed || steps.clean-status.outputs.post_failed }}
        run: |
          set -eu
          if [ "$PUSH_FIXES" = "false" ]; then
            mode="advisory (push_fixes=false)"
          elif [ "$REFUSED" = "true" ]; then
            if [ "$REFUSED_REASON" = "governance-surface" ]; then
              mode="self-heal REFUSED: edited a surface off-limits to self-heal (tests, the CI pipeline, .gaia/ gate & roster machinery, instruction/convention surfaces under .claude/**, .specify/**, wiki/**, or root build config); see workflow logs and review manually"
            else
              mode="self-heal REFUSED: diff exceeded the 10-file safety threshold (touched $REFUSED_COUNT files); see workflow logs and review manually"
            fi
          elif [ "$PUSHED" = "true" ]; then
            mode="self-heal pushed"
          else
            mode="no fixes needed"
          fi
          # Appended rather than substituted: what the audit DID is still true
          # and still worth reporting, and the stamp is a separate fact about
          # whether the gate opened.
          #
          # Same arms in the same literal order as the two skip comments, with
          # ONE deliberate difference: the final arm tests for the literal
          # `false` where they test `!= "true"`. That is not a style choice. An
          # EMPTY success_stamped here means neither stamp step ran at all, the
          # ordinary shape of advisory mode (push_fixes=false posts no status by
          # design), so `!= "true"` would attach a merge-gate warning to every
          # advisory run. The skip comments have no such state -- their stamp
          # step always runs -- which is why the same predicate is right there
          # and wrong here.
          #
          # KEEP THE ORDER IN SYNC RATHER THAN REASONING ABOUT IT. Hoisting the
          # post_failed arm is inert only while the pending POST swallows its own
          # rejection and never emits post_failed; the writer's header names
          # closing that as a separate change, and on the day it lands, an arm
          # order that had drifted would tell an author here to re-run the
          # workflow while the skip comments tell them to run the dispatched
          # members locally. That is the divergence-between-copies shape
          # gaia-react/gaia#1286 exists to remove.
          stamp=""
          if [ "${SUCCESS_LIVE:-}" != "true" ]; then
            if [ "${READ_FAILED:-}" = "true" ]; then
              stamp=". But this diff dispatches ${MEMBERS_PENDING}, and the current GAIA-Audit status could not be read, so the stamp step stood down having posted nothing and the gate's state is unknown. Run the dispatched member(s) locally to be sure the merge gate is clear"
            elif [ -n "${MEMBERS_PENDING:-}" ]; then
              stamp=". But this diff dispatches ${MEMBERS_PENDING}, which CI cannot run, so GAIA-Audit is pending, not green: run the dispatched member(s) locally to clear the merge gate"
            elif [ "${POST_FAILED:-}" = "true" ]; then
              stamp=". But the GAIA-Audit status POST was rejected by GitHub (rate limit, 5xx, or auth blip), so NO status was stamped on HEAD and the merge gate is NOT satisfied. Re-run this workflow, or run a local audit, to stamp it"
            elif [ "${SUCCESS_STAMPED:-}" = "false" ]; then
              stamp=". But NO GAIA-Audit commit status was stamped on HEAD, so the merge gate is NOT satisfied. Most likely .gaia/VERSION is missing/empty, the frontend digest could not be recomputed, or the audit was not proven clean; see the stamp step's log. Restore .gaia/VERSION, or run a local audit, to clear the gate"
            fi
          fi
          bash .github/audit/cra-status-upsert.sh "$PR_NUMBER" \
            "code-review-audit complete: ${mode}${stamp}"
