name: Audit Roster Drift

# Advisory-only drift detector for the Code Audit Team roster: runs
# .gaia/scripts/verify-audit-roster.sh's deterministic invariants against
# the live .gaia/audit-ci.yml -- pairwise claimant glob disjointness, the
# default-member's exclusion from that comparison, a hard fail on any glob
# pair the bounded dialect cannot decide, that every roster member has an
# agent file on disk registered in both machinery lists, that every
# member's name carries the `code-audit-` prefix the self-heal repair
# boundary keys off of, remit region parity (region vs roster entry,
# ordered; the region-shape rules; the region-glob dialect rule), and
# coverage -- that every tracked path resolves an owner or is declared in
# the roster's `unowned:` list, with that list held narrow by failing an
# entry that reaches an owned path, one no ownerless path needs, and one
# matching nothing at all.
#
# The roster is meant to grow as a project adds languages and surfaces, and
# these failure modes are otherwise silent: an unregistered agent file
# rotates no member's content digest and merges unaudited, a glob overlap
# between two claimant members hands a path to whichever member the roster
# happens to list first, an off-convention member name escapes the
# self-heal repair boundary silently, a remit region that disagrees
# with its roster entry misdescribes what the member actually reviews, and
# a path the roster reaches with no glob at all dispatches nobody, which
# the merge gate reads as "nobody is owed a clearance" -- so it merges
# having been reviewed by no one.
#
# Deliberately NOT added to the required set: registering this (or any
# check) as a required status check is a maintainer-run, ask-first cutover
# (SPEC-045 deferred that call explicitly), not something this drift
# detector should do to itself. This job surfaces drift for a human to act
# on; it never mutates the roster or the machinery lists.
#
# The check itself (manifest class `owned`) and its repair writer,
# .gaia/scripts/write-audit-remits.sh, ship to every clone and run there by
# hand. This workflow is maintainer-only and release-excluded because it
# runs against the GAIA team's own roster and CI on this repo's pull
# requests; an adopter clone's roster is adopter-owned, so the job would be
# a silent passenger at best and a confusing red check at worst there.
# Release-excluded alongside the other maintainer-only workflows (category
# 9 in .gaia/release-exclude).
#
# Pinned action SHAs match the sibling maintainer workflows:
#   actions/checkout   @ 93cb6efe18208431cddfb8368fd83d5badbf9bfd (v5.0.1)

# A `push:` arm as well as the pull-request one, unlike the sibling advisory
# workflows, and the coverage invariant is why: its verdict is a property of the
# MERGE-RESULT TREE, not of a pull request's own files, so two pull requests
# that are each green in isolation compose into a red `main`. One removes a
# member glob or an `unowned:` entry (its merge-result tree does not yet carry
# the other's file, so it passes); the other adds a file under that path (its
# merge-result tree still carries the roster that owns it, so it passes too).
# Both merge, `main` now has a path that dispatches nobody, and with a
# pull-request-only trigger nothing says so until an unrelated third pull
# request happens to open. That is the same argument this job already makes for
# carrying no paths filter, one level up.
#
# `workflow_dispatch:` for the same reason: a maintainer must be able to ask
# `main` the question directly rather than waiting for the next pull request.
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-audit-roster:
    name: Audit roster drift (advisory)
    runs-on: ubuntu-latest
    # Read-only token, and `contents: read` alone: the job reads the checked-out
    # tree and reports. Naming any scope here sets every unlisted one to `none`,
    # so this grants nothing else. It needs no `pull-requests: read` because it
    # asks the API nothing about the pull request -- it runs on every PR and
    # reads the tracked tree rather than the changed-file list.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      # No paths filter, unlike the sibling advisory workflows, and the coverage
      # invariant is why. Its input is the TRACKED TREE rather than any list of
      # files, so the pull request that most needs this job is one adding a
      # single file somewhere the roster has never mentioned -- precisely what a
      # filter over roster inputs would skip. A file-based filter cannot decide
      # whether this check has something to say, so it does not get to try.
      #
      # Running it on every pull request is what makes that affordable: the
      # checker is read-only and finishes in well under a second on this tree.
      - name: Verify roster invariants
        run: bash .gaia/scripts/verify-audit-roster.sh
