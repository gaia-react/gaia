# .gaia/audit-ci.yml: adopter-tunable knobs for the code-review-audit CI workflow.
# This file ships in the GAIA template; adopters edit values to tune behavior.
# The workflow reads this file at job start; missing file falls back to the defaults below.

# Run the audit only when the PR carries this label. Set to null to run on every PR.
# Maintainer recommendation: leave null until the audit is stable in CI; flip to "ready-for-review" once it is.
gate_label: null

# Hard wall-clock budget (seconds) for the audit invocation. Workflow times out
# the agent step at this value and reports a clean "audit aborted: budget" check
# rather than failing red.
budget_seconds: 1800

# Maximum number of fix turns the agent is allowed inside CI. Maps to claude_args
# `--max-turns`. Lower = cheaper. Higher = more chance to self-heal.
max_turns: 60

# Whether the agent may push self-heal commits to the PR branch. Set false to make
# the audit advisory-only (it comments findings but does not push).
push_fixes: true

# Who audits: `local` (a session on the developer's machine) or `ci` (the
# code-review-audit workflow). Both producers resolve this identically from this
# file, the per-author map, the override label, and whether the PR comes from a
# fork, so they never disagree about who audits. A fork PR always resolves to
# `ci` regardless of this value.
default_mode: local

# Workflows the audit re-dispatches against the PR branch after a self-heal
# push. GitHub does not fire push / pull_request events for commits made with
# GITHUB_TOKEN (its recursion guard), so required check runs on the new HEAD
# would otherwise be absent and branch protection would block the merge. The
# audit calls `gh workflow run --ref <branch>` for each name, producing fresh
# check runs on the new HEAD.
#
# Each entry is the workflow's `name:` field (top of its YAML file), not the
# filename. The first two entries match the GAIA template's required-check-
# producing workflows. Adopters who require additional workflows (e.g. a
# custom lint or security scan) add them here; adopters who do not require
# Chromatic / Tests can remove them.
#
# Workflows listed here must declare `workflow_dispatch:` in their `on:`
# triggers, and the job producing the required check must admit that event in
# its `if:` -- a job gated to `pull_request` skips on a dispatch, and the audit
# stamps `skipped`, which satisfies no required check.
# gaia:maintainer-only:start
# .gaia/scripts/tests/retrigger-reachability.bats guards both halves for every
# declared-required context.
# gaia:maintainer-only:end
retrigger_workflows:
  - Chromatic
  - Tests
  # gaia:maintainer-only:start
  # The three maintainer-only required checks. Their workflows are
  # release-excluded, so naming them on an adopter clone would dispatch
  # workflows that do not exist there; the release scrub strips this block.
  - CLI Tests
  - Audit CI Tests
  - Distribution Audit (PR)
  # gaia:maintainer-only:end

# Code Audit Team roster. Each entry maps file-globs to a specialized auditor
# member; the dispatch resolver (.gaia/scripts/resolve-audit-members.sh) reads
# this list, and the shared GAIA-Audit gate requires a per-member clearance for
# every member a diff dispatches. Every member, the default included, declares
# its own domain here: a claimant's globs are matched first, first-match-wins
# over roster order; the default's globs are evaluated only after every
# claimant has failed to match. Exactly one entry carries `default: true`.
# Entries with `scope: maintainer-only` are wrapped in the marker comments
# below and stripped from the adopter bundle at release time, so an adopter
# clone audits only adopter-scope surfaces.
auditors:
  - name: code-audit-frontend
    globs:
      - "app/**"
      - "test/**"
      - ".storybook/**"
      - ".github/workflows/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig*.json"
      - "*.config.ts"
      - "*.config.mts"
      - "*.config.mjs"
      - "*.config.cjs"
      - "*.config.js"
      # The Playwright suite is executed test code and the sibling of test/**,
      # which this member already owns. It dispatched nobody until now.
      - ".playwright/**"
      # Root tooling that decides what runs: the registry and install policy,
      # what the pre-commit gate formats and lints, what the image builds, the
      # environment contract, and the Node version CI and local must agree on.
      # Editor preferences, VCS bookkeeping, the licence and the root prose are
      # deliberately NOT here; they are declared in `unowned:` instead.
      #
      # REVIEWED here, REPAIRED nowhere. This member is the roster's only
      # `push_fixes: true` one, so granting it a path that decides what the
      # gates check would let it rewrite the gate in the same self-heal commit
      # as its repair. All seven are therefore also in the self-heal refusal set
      # (`.claude/hooks/lib/audit-selfheal-paths.sh`), matching every sibling
      # root config this member owns; the grant buys review, not write access.
      - ".npmrc"
      - ".lintstagedrc.json"
      - ".prettierignore"
      - "Dockerfile"
      - ".env.example"
      - ".nvmrc"
      - ".node-version"
    scope: adopter
    push_fixes: true
    default: true
  - name: code-audit-github-workflows
    globs:
      - ".github/workflows/*.yml"
      - ".github/workflows/*.yaml"
      - ".github/actions/**/*.yml"
      - ".github/actions/**/*.yaml"
    scope: adopter
    push_fixes: false
  # gaia:maintainer-only:start
  - name: code-audit-maintainer-shell
    globs:
      - ".gaia/**/*.sh"
      - ".gaia/**/*.bats"
      - ".claude/hooks/**/*.sh"
      - ".specify/extensions/gaia/lib/*.sh"
      - ".github/**/*.sh"
      - ".github/**/*.bats"
      # The husky hooks are extensionless POSIX shell, so no *.sh glob reaches
      # them. .husky/pre-commit is the Quality Gate floor for every commit, so
      # it gets the shell lens and the shellcheck oracle like any other script.
      - ".husky/**"
      # The distribution and governance surface beside the scripts: the roster
      # and the release scrub's own config (`.gaia/*.yml`, which generalizes the
      # bare `.gaia/audit-ci.yml` this line used to carry), the manifest that
      # decides what ships plus the state and hook-scope registries and their
      # schemas (`.gaia/*.json`), the release exclusion list, the hook
      # registrations, and the review-ownership file. Each decides what is
      # shipped, executed, or reviewed, and each dispatched nobody until now.
      # None of these globs crosses a `/`, so the CLI's own package.json,
      # tsconfig and lockfile stay with the node member below.
      - ".gaia/*.yml"
      - ".gaia/*.json"
      # The model-pricing table the bash cost tooling reads at runtime
      # (cost-reprice.sh, cost-unpriced-scan.sh, the token-tally chain). It
      # carries dated per-model rates, so it is actively edited and a wrong
      # entry silently misprices every tally. Named as a literal because
      # `.gaia/scripts/**/*.json` is otherwise all test fixtures; see the
      # `unowned:` note on that exemption below.
      - ".gaia/scripts/token-rates.json"
      - ".gaia/release-exclude"
      # The vendored bats archive .gaia/tests/install-bats.sh extracts onto
      # every matrix leg of the bats workflow. Granted rather than declared
      # unowned, even though no lens reads a tarball: a change to it is a
      # change to the bytes a gate tool is built from, and the reviewer who
      # can judge that is the one holding the script carrying the digest pin.
      # An `unowned:` entry would let a swapped blob dispatch nobody.
      - ".gaia/tests/vendor/**"
      - ".gaia/VERSION"
      - ".claude/settings.json"
      - ".github/CODEOWNERS"
      # Same shape as CODEOWNERS above: a maintainer-only `.github/`
      # governance file that is not shell, granted here rather than to the
      # workflows member because that member's roster entry and agent
      # definition both ship. A shipped surface naming a release-excluded path
      # is what `release runtime-deps` fails the build on, and it decides which
      # action versions land here, so leaving it unowned would merge a
      # supply-chain change nobody reviewed.
      - ".github/dependabot.yml"
      - ".claude/agents/code-audit-*.md"
      - ".claude/rules/**"
    scope: maintainer-only
    push_fixes: false
  - name: code-audit-maintainer-node
    globs:
      - ".gaia/cli/src/**/*.ts"
      - ".gaia/cli/src/**/*.tmpl"
      - ".gaia/cli/src/**/*.snap"
      - ".gaia/cli/src/**/.gitkeep"
      # The CLI build/config surface beside src/: the bundle build scripts and
      # runtime deps (package.json), the resolved dependency tree
      # (pnpm-lock.yaml), the workspace's supply-chain policy
      # (pnpm-workspace.yaml: minimumReleaseAge, trustPolicy, and both
      # exclusion lists), the build config (tsconfig*.json), and the CLI's own
      # tool configs (vitest.config.ts, eslint.config.mjs,
      # prettier.config.mjs), whose `setupFiles` and rule sets decide what the
      # CLI test and lint runs actually execute. Without these a change to any
      # merges with no code-audit review. The default member's own
      # `pnpm-workspace.yaml` and bare `*.config.*` globs never cross a `/`, so
      # they claim the repository-root files only and reach these not at all.
      #
      # The config family is enumerated across the five JS/TS extensions,
      # matching what the default member declares at the repository root, and
      # NOT collapsed to a single `.gaia/cli/*.config.*`. That one-glob form is
      # unavailable rather than unwanted: `*` matches any run within a segment,
      # so it also spells `.gaia/cli/x.config.sh`, which the shell member's
      # `.gaia/**/*.sh` already claims, and the roster's disjointness invariant
      # decides claimant overlap as GLOB LANGUAGES rather than over the files
      # that happen to exist. The dialect has no way to subtract an extension.
      # What retires the hand-enumeration defect is the coverage invariant
      # below, not this line: a sixth config extension added here without a
      # roster entry is now reported ownerless instead of merging unreviewed.
      - ".gaia/cli/package.json"
      - ".gaia/cli/pnpm-lock.yaml"
      - ".gaia/cli/pnpm-workspace.yaml"
      - ".gaia/cli/tsconfig*.json"
      - ".gaia/cli/*.config.ts"
      - ".gaia/cli/*.config.mts"
      - ".gaia/cli/*.config.mjs"
      - ".gaia/cli/*.config.cjs"
      - ".gaia/cli/*.config.js"
      # The framework's executable Node beside the shell scripts. The shell
      # member's `.gaia/**/*.sh` never reaches these, so they dispatched nobody.
      - ".gaia/scripts/**/*.mjs"
    scope: maintainer-only
    push_fixes: false
  - name: code-audit-maintainer-prose
    globs:
      - ".claude/skills/**/*.md"
      # The Code Audit Team's own review lenses. This glob reaches exactly
      # `.claude/agents/code-audit-frontend/`, whose five files decide what that
      # member checks, so leaving them ownerless meant a commit deleting a check
      # from one of them rotated no digest and dispatched nobody. They are
      # instruction prose, which is this member's remit; the per-member agent
      # definitions beside them (`.claude/agents/code-audit-*.md`) are machinery
      # and stay with the shell member, and the two globs are disjoint.
      - ".claude/agents/*/**"
      # Executable prose: instructions a language model runs, as against prose a
      # human reads. `.claude/skills/**/*.md` above is the same artifact type,
      # and so is each of these: a command, an agent definition, a rule, a lens
      # or a prompt template that steers a run. A wrong edit to one misdirects
      # that run the way a wrong skill file does, which is what earns them a
      # reviewer rather than an exemption.
      #
      # Under `.specify/extensions/gaia/`, `commands`, `rules` and `templates`
      # are named rather than taken as whole subtrees because their siblings are
      # inert: a README, test evidence, and the forensics fixture corpus are
      # declared in `unowned:` below. A new directory under that root, or under
      # `.github/forensics/`, is therefore reported ownerless rather than
      # inheriting an exemption nobody decided to give it.
      #
      # Every entry here is extension-qualified for a second reason: this member
      # is advisory-only and never grades a finding Critical, so a whole-subtree
      # glob would route a future `.claude/commands/tool.sh` here and get it
      # read for legibility rather than for quoting, portability and fail-open
      # behaviour. Both directories hold Markdown only today, which makes this
      # latent rather than live, and an unqualified glob is exactly how it would
      # stop being latent without anyone deciding it should.
      - ".claude/commands/**/*.md"
      - ".claude/instructions/**/*.md"
      - ".claude/agents/worthiness-evaluator.md"
      - ".gaia/cli/health/**/*.md"
      # The two forensics prompts by name rather than the directory's whole top
      # level, which also carries a README that is a human-facing script table
      # nothing executes. Taking the level whole would own that README while
      # `.specify/extensions/gaia/README.md` stays exempt, which is the same
      # file in the same role decided two ways in one roster.
      - ".github/forensics/prompt.md"
      - ".github/forensics/apply-fix-prompt.md"
      - ".specify/extensions/gaia/commands/*.md"
      - ".specify/extensions/gaia/rules/*.md"
      - ".specify/extensions/gaia/templates/*.md"
      - ".specify/presets/**/*.md"
    scope: maintainer-only
    push_fixes: false
  # gaia:maintainer-only:end

# Paths that are MEANT to dispatch no auditor. The roster above answers "who
# owns this path"; this list answers the question the dispatch resolver
# structurally cannot, because an empty dispatched set is both "nothing here
# needs an owner" and "this needs one and has none". Only
# .gaia/scripts/verify-audit-roster.sh's coverage invariant reads it: no
# dispatch path consults it, so an entry here never suppresses a review.
#
# This is not a free opt-out, and the checker enforces that rather than trusting
# it. An entry reaching a path some member already owns fails as OVERBROAD,
# which is what a blanket `**` does by construction. An entry no ownerless path
# needs fails as REDUNDANT. And editing this file dispatches an auditor, where
# adding an unowned file dispatched nobody -- that asymmetry is the point.
#
# Adding a path here is a claim that nothing about it is worth a specialist's
# review. Prefer granting it to a member.
#
# NOTE FOR ADOPTER CLONES. The maintainer-only entries below are stripped at
# release, and so are the roster's maintainer-only members -- which means the
# machinery those members own (.gaia/**, .claude/rules/**, and the rest) has no
# owner on an adopter clone and the coverage invariant reports it. That is
# accurate rather than a defect: on your clone GAIA's own machinery is not
# yours to audit. Declare it with entries of your own (`.gaia/**`,
# `.claude/**`) alongside whatever else your tree legitimately leaves unowned.
unowned:
  # Prose, assets and bookkeeping that no member claims. Root `*.md` never
  # crosses a `/`, so it reaches the repository-root documents only.
  #
  # Do not read this list as a claim that nothing under it executes, and do not
  # carry an entry across into the merge gate's out-of-scope allowlist on that
  # reading. `public/**` is the counter-example: it carries a service worker,
  # which is exactly what the default member has a lens for, so it is declared
  # unowned here and deliberately stays IN scope there. Unowned is advisory and
  # suppresses no review; the allowlist clears a merge with no member having
  # read the diff, so each of its entries is judged against what the path can
  # actually contain. See the arm comment in `.claude/hooks/lib/audit-scope.sh`.
  - "*.md"
  - "LICENSE"
  - ".editorconfig"
  - ".gitignore"
  - "wiki/**"
  - "docs/**"
  - "public/**"
  - ".github/FUNDING.yml"
  - ".github/ISSUE_TEMPLATE/**"
  - ".github/pull_request_template.md"
  # gaia:maintainer-only:start
  # GAIA's fixtures, generated bundles, test data and inert documentation.
  # Several are extension-qualified rather than whole-subtree because a member
  # already owns a sibling inside the same tree (`.gaia/**/*.sh`,
  # `.gaia/**/*.bats`, `.specify/extensions/gaia/lib/*.sh`), and a whole-subtree
  # entry would reach it and fail as overbroad.
  #
  # GAIA's own instruction prose is NOT here. Commands, agent definitions,
  # rules, health lenses and prompt templates are prose a language model
  # EXECUTES, the same artifact type as `.claude/skills/**/*.md`, and they
  # belong to the prose member (see its `Executable prose` note above). What
  # this block holds is prose nothing executes -- a README, test evidence,
  # fixture corpora -- alongside the generated and inert files.
  #
  # The distinction to apply when adding an entry: not "is this Markdown" but
  # "does an agent act on this". A file an agent reads as INPUT DATA is inert
  # and belongs here. A file an agent reads as INSTRUCTIONS belongs to a member.
  - ".claude/skills/release-notes/eval/**"
  - ".gaia/cli/.gitignore"
  # The built CLI bundles. Generated by the esbuild step from `.gaia/cli/src/**`,
  # which the node member owns, so the review belongs on the source and a lens
  # pointed at minified output would read machine-written code as if a human
  # had written it. Kept rather than re-owned for that reason, not overlooked.
  - ".gaia/cli/gaia"
  - ".gaia/cli/gaia-maintainer"
  # Generated by the same build step, and the same argument covers it: the
  # `bundle:adopter` script re-creates this directory verbatim from
  # `src/scaffold/templates` and `src/automation/templates/workflows`, both of
  # which the node member owns through `.gaia/cli/src/**/*.tmpl`. A finding
  # raised on a copy cannot be repaired on the copy, since the next build
  # discards it, so the review belongs on the source and an exemption here is
  # the accurate declaration rather than an oversight.
  - ".gaia/cli/templates/**"
  - ".gaia/cli/test-fixtures/**/*.json"
  - ".gaia/cli/test-fixtures/**/*.md"
  - ".gaia/cli/test-fixtures/**/*.ts"
  # Scoped to `tests/` rather than the whole subtree: `.gaia/scripts/**/*.json`
  # also reaches `.gaia/scripts/token-rates.json`, the shipped rate table the
  # cost tooling reads, and exempting it would not merely leave it ownerless but
  # assert it is meant to be. It is granted to the shell member above instead.
  - ".gaia/scripts/tests/**/*.json"
  - ".gaia/scripts/**/*.jsonl"
  - ".gaia/scripts/**/*.txt"
  - ".gaia/scripts/**/*.yml"
  - ".gaia/scripts/**/*.md"
  - ".gaia/scripts/**/.gitkeep"
  - ".gaia/templates/**"
  - ".gaia/tests/**/*.md"
  - ".gaia/tests/**/*.ts"
  - ".gaia/tests/**/*.tsx"
  - ".gaia/tests/**/*.txt"
  - ".gaia/tests/**/*.json"
  - ".gaia/tests/**/*.tsv"
  # Pinned to the one file rather than the extension: this is an executable
  # scanner, not fixture data, and it is exempt only because no Python auditor
  # exists to give it to. An extension glob would hand that exemption to a
  # second Python tool silently; a literal makes the next one report ownerless.
  - ".gaia/tests/observability/serena/usage_scan.py"
  # Scoped to `tests/` rather than the whole subtree: the two prompts the
  # forensics run executes are named individually in the prose member's globs
  # above. What this entry covers is the fixture corpus -- malformed and
  # canonical report bodies the bats suite feeds the renderer -- which is input
  # data and executed by nothing. The README beside those prompts is a script
  # table for a human, so it is exempt on the same terms as the spec-kit one
  # below rather than on the accident of which directory level it sits at.
  - ".github/forensics/README.md"
  - ".github/forensics/tests/**/*.md"
  - ".serena/**"
  # Enumerated rather than a `.specify/extensions/gaia/**/*.md` subtree for the
  # same reason: that extension's `commands/`, `rules/` and `templates/`
  # directories are executable prose and belong to the prose member. Only the
  # extension's own README and its `test/` evidence notes are read by humans.
  - ".specify/extensions/gaia/README.md"
  - ".specify/extensions/gaia/test/**/*.md"
  - ".specify/extensions/gaia/**/*.yml"
  - ".specify/extensions/gaia/**/*.tmpl"
  # Extension-qualified rather than a `.specify/presets/**` subtree: the preset's
  # Markdown is its own commands and spec template, which the prose member owns.
  # `preset.yml` is declarative configuration the preset loader reads.
  - ".specify/presets/**/*.yml"
  # gaia:maintainer-only:end
