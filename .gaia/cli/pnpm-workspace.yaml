# Marks .gaia/cli as its own pnpm workspace root. Without this, the repo-root
# pnpm-workspace.yaml (added for supply-chain hardening) makes pnpm treat the
# whole repo as one workspace and `pnpm -C .gaia/cli install` installs the root
# project instead of this standalone maintainer CLI. pnpm resolves the nearest
# pnpm-workspace.yaml, so this keeps .gaia/cli's own pnpm-lock.yaml and
# node_modules isolated. Maintainer-only; release-excluded.

# Supply-chain hardening, for parity with the root workspace. This workspace is
# its own pnpm root (see above), so it inherits none of root's settings and an
# install here resolved unhardened until #1152. Value is in minutes;
# 10080 = 7 days. The exposure is at lockfile-write time, when a maintainer
# bumps a dependency: CI's --frozen-lockfile install does not re-resolve and so
# inherits whatever the last unhardened resolve committed.
minimumReleaseAge: 10080

# Require a decision when a resolution breaches the window above (a prompt on an
# interactive terminal, a hard install failure in CI and any other non-TTY),
# rather than admitting the version and
# auto-appending its exemption below. Same reasoning as root's entry, including
# why it is stated explicitly when pnpm would infer it; the maintainer runbook
# for a blocked install lives there too.
minimumReleaseAgeStrict: true

# Fail the install if a package's trust level has decreased vs prior releases.
trustPolicy: no-downgrade

# Neither exclusion list below is longer than root's, and deliberately so: each
# entry earns its place against THIS workspace's closure, which root's is a
# superset of. A list that currently matches root's entry for entry is not drift
# to correct; the relation is containment, not difference. Do not sync them by
# copying.

# Exempt first-party packages from the release-age delay. The 7-day window
# defends against malicious THIRD-party updates; @gaia-react/lint is authored,
# reviewed, and published by this project's own maintainer, so the
# community-vetting rationale does not apply. Same reasoning as root's entry.
# Root carried a second entry, bippy@0.5.42, until the 0.7.3 bump retired it, so
# this list and root's now hold the same single entry.
minimumReleaseAgeExclude:
  - '@gaia-react/lint'

# Acknowledge known-good packages that trip no-downgrade. Each is an old,
# pre-provenance release that is the correct, required version for its dependent
# (named per entry). A newer MAJOR line later added npm provenance, so pnpm reads
# the older unattested release as a trust downgrade. These are not supply-chain
# regressions. Scope each exception to the exact version; no-downgrade stays
# enforced for everything else. Both arrive through @gaia-react/lint's plugin set.
#   - semver@6.3.1: final 6.x release; required by eslint-plugin-import (^6.3.1)
#   - eslint-import-resolver-typescript@3.10.1: final 3.x release; required by
#     eslint-plugin-canonical (^3.7.0)
# Root's third entry, chokidar@4.0.3, is absent: it is @react-router/dev's, and
# @react-router/dev is not in this closure.
trustPolicyExclude:
  - 'semver@6.3.1'
  - 'eslint-import-resolver-typescript@3.10.1'

# Build-script approval. pnpm 11 replaces the onlyBuiltDependencies allowlist
# with the allowBuilds map (true = the package may run install/build scripts).
# esbuild builds a native binary in its postinstall; without this, the
# --frozen-lockfile install fails with ERR_PNPM_IGNORED_BUILDS.
allowBuilds:
  esbuild: true
  unrs-resolver: true

# @gaia-react/lint bundles plugins for surfaces this CLI omits (storybook,
# better-tailwindcss, react/react-dom); their peers are absent from this
# CLI-only workspace. Pin peer mismatches as warnings, not install failures,
# for parity with the root workspace's explicit setting.
strictPeerDependencies: false

# Dependency version overrides, the security-floor subset of root's that this
# closure actually needs. Apply with a `pnpm dedupe` scoped to this workspace,
# never a bare `pnpm install`, which short-circuits on an overrides-only change
# (wiki/dependencies/pnpm-overrides.md).
#
# Entries here earn their place against THIS workspace's closure, on the same
# containment doctrine the two exclusion lists above state: the relation to
# root's list is containment, not difference, so do not sync them by copying.
# Root's morgan floor is absent because morgan arrives through
# @react-router/serve, which this CLI-only closure does not carry.
#
# These floors exist because this workspace is its own pnpm root, as the file's
# opening comment says, so root's floors do not reach it. fast-uri is the live
# case rather than a hypothetical one: it has no direct pin in this manifest,
# it sat at the vulnerable 3.1.4, and it reached a patched version only as a
# side effect of a whole-lockfile re-resolve. That is exactly the condition
# root's own comment names, a range permitting the fix is not the same as the
# fix landing, so with nothing holding it a later re-resolve can drop it back
# under the patched version and say nothing.
#
# Toggled and retired the same way root's are. /update-deps Phase 0 and Phase 6
# take one workspace root at a time and toggle the keys in that root's own
# overrides map, this file included, so a key here that stops clearing an
# advisory is dropped on the same pass that drops root's. That is a change from
# how this block was first written: those phases used to open only the ROOT
# pnpm-workspace.yaml, which left these entries to become silent caps once their
# parents bumped past the versions below, on a workspace whose build inlines its
# dependencies into a shipped binary. Nothing here needs a by-hand re-check on
# that account any more; a removal this file did not authorize is a bug in that
# phase rather than expected drift.
#
#   - cosmiconfig>js-yaml and @eslint/eslintrc>js-yaml -> 4.3.1:
#     GHSA-5p4m-2wfm-xmqj, quadratic CPU consumption in !!omap resolution.
#     Written as the two arrival paths rather than as a bare `js-yaml@^4.0.0`,
#     because a workspace override outranks a DIRECT dependency as well as a
#     transitive one: pnpm applies it to every match and rewrites the
#     importer's own `specifier:` field, so a broad key silently clamps the
#     `js-yaml` pin in package.json. A later advisory bump of that pin would
#     then leave the manifest reading patched while the tree was not, with no
#     disagreement in the lockfile diff to catch it. That pin is exact, so it
#     cannot drift on its own and needs no floor; these two parents declare
#     ^4.1.0 and ^4.3.0 and are the copies that can.
#   - fast-uri -> 3.1.6: GHSA-7p8r-x3mc-p8w7, host confusion via a backslash
#     authority introducer, plus the two earlier host-confusion advisories it
#     supersedes. Reached through ajv (^3.0.1) in the eslint toolchain. Root
#     pins 3.1.5, the advisory's own floor; this workspace pins the 3.1.6 its
#     closure already resolved, because pinning down to root's value would be a
#     downgrade that buys nothing. The two are not meant to match.
overrides:
  'cosmiconfig>js-yaml': 4.3.1
  '@eslint/eslintrc>js-yaml': 4.3.1
  fast-uri: 3.1.6
