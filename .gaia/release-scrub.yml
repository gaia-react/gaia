# Bundle-time scrub config. Consumed by `gaia-maintainer release scrub <staging-dir>`
# from inside `release.yml` between staging and tarball creation.
#
# Four transforms run in order against the staging tree:
#
#   1. marker-strip: remove maintainer-only blocks delimited by HTML
#      comment markers from in-scope markdown files.
#
#   2. json-strip: delete maintainer-only keys from structured JSON files.
#      Keys use dot-notation to address nested paths (e.g. "scripts.foo").
#      Dots are path separators; a literal dot inside a key name is escaped
#      as `\.` (e.g. "exports.\./feature"). Missing keys are silently skipped
#      (no error). Runs after marker-strip so leak-check sees the already-
#      clean JSON.
#
#   3. json-strip-array-element: remove a single array element by predicate
#      from a structured JSON file, the shape json-strip cannot express. A
#      selector's `path` walks the JSON by dot-notation with a `[]` suffix
#      marking an array to iterate; `match` is a key→value map, and an element
#      is removed only when every entry equals the element's own value. A
#      selector that matches nothing is a silent no-op. Runs before leak-check
#      so it sees the already-clean JSON.
#
#   4. leak-check: run codified audit patterns against the post-strip
#      staging tree. Non-empty match = build failure with a leak report.
#      Mirrors the patterns in `.claude/rules/wiki-style.md` Audit section
#      and `.gaia/cli/health/taxonomy.md` Distribution boundary classes.
#
# Path globs use `*` (single segment) and `**` (any depth). Globs match
# repo-relative paths under the staging directory.
#
# This file is itself maintainer-only (release-exclude category 5).
# Adopters never run `gaia-maintainer release scrub`.

transforms:
  - type: marker-strip
    paths:
      - "wiki/**/*.md"
      - ".claude/**/*.md"
      - ".specify/extensions/gaia/**/*.md"
    start: "<!-- gaia:maintainer-only:start -->"
    end: "<!-- gaia:maintainer-only:end -->"

  # .prettierignore carries maintainer-only globs for byte-sensitive test
  # fixtures under .gaia/tests/ (release-excluded; absent on adopter machines).
  # Distinct #-comment markers because .prettierignore is not markdown and
  # HTML-comment markers would read as literal ignore globs there.
  - type: marker-strip
    paths:
      - ".prettierignore"
    start: "# gaia:maintainer-only:start"
    end: "# gaia:maintainer-only:end"

  # Code Audit Team maintainer-only blocks: the roster's maintainer-only
  # entries in .gaia/audit-ci.yml and the resolver's built-in-default block
  # (audit-scope.sh, sourced by resolve-audit-members.sh). Same #-comment
  # markers as the .prettierignore transform above, kept as its own block
  # (rather than folded into that transform's paths) so the
  # .prettierignore-specific rationale above stays intact.
  # **/*.sh is broad by design: any maintainer-only block wrapped in shipped
  # shell is meant to be stripped, wherever it lands. Same for **/*.yml.tmpl
  # (workflow render templates).
  - type: marker-strip
    paths:
      - ".gaia/audit-ci.yml"
      - "**/*.sh"
      - "**/*.yml.tmpl"
    start: "# gaia:maintainer-only:start"
    end: "# gaia:maintainer-only:end"

  # Maintainer-only package.json keys that must not reach adopter projects.
  # bin: registers the gaia CLI binary, only meaningful when a package is
  #   published and installed as a dependency; adopters build apps, not
  #   publishable packages.
  # scripts.test:forensics: runs GAIA's internal BATS suite against
  #   .gaia/tests/forensics/unit.bats, which is release-excluded and does
  #   not exist on adopter machines.
  # scripts.test:sandbox: same shape, against .gaia/tests/sandbox/run-all.sh.
  - type: json-strip
    paths:
      - "package.json"
    keys:
      - "bin"
      - "scripts.test:forensics"
      - "scripts.test:sandbox"

  # Maintainer-only hook registrations inside a shipped settings file.
  # distribution-preflight-check.sh is release-excluded (it names
  # .gaia/cli/gaia-maintainer and .github/workflows/distribution-audit-pr.yml,
  # both release-excluded), so its committed registration in .claude/settings.json
  # (manifest class `shared`, reaches adopters) would leave every adopter's
  # PreToolUse/Bash chain pointing at a file absent from their clone. The
  # selector empties the matching element from each PreToolUse entry's hooks
  # array; a stale selector that matches nothing is a no-op. An emptied hooks[]
  # stays as [] (its matcher entry is not collapsed): well-formed and harmless.
  - type: json-strip-array-element
    paths:
      - ".claude/settings.json"
    selectors:
      - path: "hooks.PreToolUse[].hooks[]"
        match: {command: ".claude/hooks/distribution-preflight-check.sh"}

  # Maintainer SPEC ids inside `.gaia/state-registry.json`'s per-entry
  # `source` provenance. The field cannot simply be deleted: the shipped
  # `.gaia/state-registry.schema.json` declares `source` in `/$defs/entry`'s
  # `required` array, so a bundle missing it would fail its own validator.
  # Rewriting keeps the field schema-valid and still meaningful
  # ("SPEC-061 §shared" → "§shared") while the identifier, which resolves only
  # inside the maintainer's release-excluded `.specify/specs/` tree, leaves the
  # bundle. Maintainer-side provenance in the repo is untouched.
  - type: json-field-rewrite
    paths:
      - ".gaia/state-registry.json"
    selectors:
      - path: "entries[].source"
        pattern: "\\bSPEC-[0-9]{3,}\\s*"
        replacement: ""

  # The six token-leak checks (uat-narrative through monorepo-prefix) each
  # carry `scope: ["**"]`, the whole staging tree. That tree IS the shipped
  # set, so their scope cannot drift from what ships, and there is no list left
  # to be wrong: five earlier repairs of this class (#644, #656, #710, #1306,
  # #1352) each added one more glob to one more list and the sixth instance
  # arrived anyway. The narrower scopes further down belong to the
  # file-class-specific checks, where a narrow scope is the intent, not drift.
  - type: leak-check
    # Subtracted from every check in this transform: a binary's bytes decoded
    # as UTF-8 are noise a token regex can match by accident, and a reported
    # "match" out of one is unreadable. Deliberately NOT a size filter:
    # scanning the whole staged tree, the 1.1 MB CLI bundle and the lockfile
    # included, costs ~80ms, and both of those are shipped files where a leak
    # is as real as in any markdown page.
    scope-skip:
      - "**/*.png"
      - "**/*.ico"
    checks:
      # ---- UAT-NNN narrative refs (working-doc identifiers) ----
      - id: uat-narrative
        description: "UAT-NNN narrative references in shipped instruction surfaces"
        pattern: "UAT-[0-9]{3}"
        scope:
          - "**"
        path-allowlist:
          # The rule itself names concrete IDs to teach adopters what NOT
          # to write.
          - ".claude/rules/wiki-style.md"
          # The wiki-lint playbook's documentation describes what its audit
          # flags, with concrete-ID examples by design.
          - ".claude/skills/gaia/references/wiki/lint.md"
        # Lines matching ANY of these regexes are exempt. Structural matches
        # only; see `.claude/rules/wiki-style.md` Exceptions for the contract.
        line-allowlist:
          # Identifier fragments inside variable names: uat_id, uats_block,
          # seen_uat_files, --uat-id CLI flag form.
          - "uat[-_]id|uats_block|seen_uat_files"
          # Filename literals like uat-001.spec.ts.
          - "uat-[0-9]+\\.spec\\.[a-z]+"
          # Frontmatter-style fixture: `uat_id: 'UAT-099'` or `uat_id: UAT-099`.
          - "uat_id\\s*[:=]\\s*['\"]?UAT-"

      # ---- Concrete maintainer SPEC IDs ----
      - id: spec-concrete-ids
        description: "Concrete maintainer SPEC IDs in shipped instruction surfaces"
        pattern: "\\bSPEC-[0-9]{3,}\\b"
        scope:
          - "**"
        path-allowlist:
          # The rule itself names concrete IDs to teach adopters what NOT to
          # do. Self-referential prose is the rule's body.
          - ".claude/rules/wiki-style.md"
          # The wiki-lint playbook's documentation cites concrete-ID
          # examples that mirror the audit findings it surfaces.
          - ".claude/skills/gaia/references/wiki/lint.md"
        line-allowlist:
          # Illustrative usage in CLI/SPEC docs: `(e.g. SPEC-002)` or
          # `(e.g. \`SPEC-002\`)` (with optional backticks around the ID).
          - "e\\.g\\.\\s*`?SPEC-[0-9]{3,}"

      # ---- Release-excluded paths leaked into shipped surfaces ----
      # Every directory alternative ends `\b`, never a trailing `/`. A trailing
      # slash matches only a reference that continues past the directory name,
      # so a bare-directory mention of the same release-excluded tree passes
      # silently and ships an adopter a pointer to a path their clone lacks.
      # `\b` covers both forms: `/` is a non-word character, so the boundary
      # fires there too.
      - id: maintainer-paths
        description: "Release-excluded paths referenced in shipped surfaces"
        pattern: "\\.gaia/cli/src\\b|\\.gaia/cli/test-fixtures\\b|\\.gaia/cli/__tests__\\b|\\.gaia/cli/health\\b|\\.gaia/cli/gaia-maintainer\\b|\\.specify/extensions/gaia/test\\b|\\.specify/specs\\b|\\.gaia/tests\\b|\\.gaia/scripts/tests\\b|\\.github/audit/tests\\b|\\.github/forensics\\b|\\.claude/rules/maintainers\\b"
        scope:
          - "**"
        path-allowlist:
          # Policy-documenting rule: its own body and Audit git-grep commands
          # cite the maintainer-only .gaia/tests/forensics/ path as the
          # sanctioned exception it governs; the exclusion globs are
          # load-bearing and kept unwrapped, so the file stays allowlisted.
          # (wiki-style.md and the wiki-lint playbook formerly sat here too;
          # they now wrap their `.gaia/tests/` rationale in maintainer-only
          # markers, so the strip removes it and the leak-check now actively
          # guards them against an unwrapped re-add.)
          - ".claude/rules/repo-relative-paths.md"
          # Documents the smoke-harness convention split between
          # `.specify/extensions/gaia/test/` (UAT runbooks) and
          # `.gaia/tests/smoke/` (release-gate harnesses); literal paths
          # are the rule's classification table, not stray references.
          - ".specify/extensions/gaia/rules/smoke.md"
          # Adopter-owned sentinels that ship in the tarball but contain
          # release-baseline content after `gaia-maintainer release scrub-wiki`
          # (Step 8 of `/gaia-release`). Local simulations against
          # mid-development hot/log content would otherwise false-positive.
          - "wiki/hot.md"
          - "wiki/log.md"
        # The three shipped surfaces below each name one `.github/forensics/`
        # helper by path. That directory is release-excluded wholesale
        # (category 9), so the pattern above flags any reference; these are the
        # sanctioned exceptions. Line-allowlisted, not path-allowlisted, so each
        # file stays scanned for every OTHER maintainer path and for any
        # UNlisted forensics script, keeping the pattern a loud tripwire.
        line-allowlist:
          # .claude/skills/gaia/references/forensics.md documents the upstream
          # byte-identical contract: the deterministic issue-body parser an
          # adopter's filed report is read by. The script is maintainer-only;
          # the contract it enforces is adopter-relevant.
          - "\\.github/forensics/parse-issue-body\\.sh"
          # wiki/decisions/Quality Gate.md describes the Forensics Triage
          # Workflow's own CI gate (install → typecheck → lint → test → knip)
          # by its script path; descriptive prose, not a rendered pointer.
          - "\\.github/forensics/run-quality-gate\\.sh"
          # .claude/commands/setup-gaia.md names the label-bootstrap script
          # inside a `[ -f .github/workflows/forensics-triage.yml ]` guard; on an
          # adopter the guard is false and the echo is a graceful no-op, the same
          # runtime-optional class the `excluded-workflow-ref` guard covers.
          - "\\.github/forensics/bootstrap-labels\\.sh"
          # package.json's `gaia.wikiClassify` source/test path arrays are
          # load-bearing config globs, not prose pointers: an entry naming a
          # release-excluded tree simply matches nothing on an adopter clone.
          # Anchored to a bare JSON array-element string so an ordinary
          # reference anywhere else in package.json still trips the check.
          - "^\\s*\"\\.gaia/(cli/src|tests|scripts/tests)/\",?$"

      # ---- Code Audit Team maintainer-only member names ----
      # A mis-wrapped roster entry or resolver block would leave a
      # code-audit-maintainer-* member name (the roster in .gaia/audit-ci.yml,
      # the resolver's built-in-default block) in a shipped surface.
      - id: maintainer-audit-members
        description: "code-audit-maintainer-* member names surviving the roster/resolver strip"
        pattern: "code-audit-maintainer-"
        scope:
          - "**"

      # ---- Never-present-on-adopter workflows referenced in shipped surfaces ----
      # `.github/workflows/` is the one distribution-boundary directory where
      # some files ship (tests.yml, chromatic.yml) and some do not, so the
      # `maintainer-paths` alternation above cannot blanket it, and enumerating
      # each excluded workflow by hand drifts. This derived check reads
      # `.gaia/release-exclude` at scan time and flags references to any excluded
      # `.github/workflows/*.yml` that has NO render template under
      # `.gaia/cli/templates/workflows/`, i.e. is never installable on an adopter
      # (unlike `code-review-audit.yml`, which `/setup-gaia` renders from its
      # `.tmpl`, so references to it are legitimate). A newly excluded maintainer
      # workflow is covered with no edit here; the set cannot drift from the
      # exclude list. Mirrors `wikilink-to-excluded`. Prior occurrence: a shipped
      # workflow-template comment cross-referenced `forensics-triage.yml`.
      - id: excluded-workflow-ref
        description: "References to release-excluded, never-installed workflows in shipped surfaces"
        derive: excluded-workflows
        scope:
          - "**"
        line-allowlist:
          # setup-gaia's forensics detection uses a `[ -f ... ]` existence guard;
          # on an adopter the file is absent so the branch is a graceful no-op,
          # the same runtime-optional class as the `runtime-deps` check's guards.
          - "\\[ -f \\.github/workflows/forensics-triage\\.yml \\]"

      # ---- Sibling-monorepo path prefixes ----
      - id: monorepo-prefix
        description: "Maintainer monorepo siblings (studio/, website/) in shipped surfaces"
        pattern: "(?:^|[\\s`(/])(studio|website)/"
        scope:
          - "**"
        path-allowlist:
          # release-notes skill is release-excluded (category 1); its
          # ../website/ references are maintainer-only and never ship.
          - ".claude/skills/release-notes/SKILL.md"
          # Same hot/log carve-out as maintainer-paths; they get
          # release-baseline content via `gaia-maintainer release scrub-wiki`.
          - "wiki/hot.md"
          - "wiki/log.md"
        line-allowlist:
          # `gaia wiki dead-paths` is the check that FLAGS sibling-monorepo
          # references, so its own help text has to name them. Self-referential,
          # the same exception `.claude/rules/wiki-style.md` gets by path.
          - "sibling-monorepo paths \\(studio/, website/\\)"

      # ---- Absolute filesystem literals ----
      - id: absolute-paths
        description: "Absolute /Users or /home filesystem paths in shipped Claude files"
        pattern: "/Users/|/home/"
        scope:
          - ".claude/**"
        path-allowlist:
          # The rule's own counter-example prose documents this pattern.
          - ".claude/rules/instruction-files.md"
          # Forensics redaction documents Rule B's regex literally; the
          # pattern `/Users/<name>/` and `/home/<name>/` is the load-bearing
          # algorithm input the skill executes against. Removing the literal
          # would break the documentation's correspondence to the regex.
          - ".claude/skills/gaia/references/forensics/redaction.md"
          # Policy-documenting rule: contains sanctioned generic placeholders
          # (/Users/you, /Users/username) and forensics-fixture paths
          # (/Users/testuser, /Users/alice) as the examples it governs; same
          # rationale as wiki-style.md.
          - ".claude/rules/repo-relative-paths.md"

      # ---- Maintainer-only governance files at staging root ----
      # Release-exclude category 11 keeps these out of the staging tree.
      # If the exclude lines are reverted by mistake, the files would
      # silently ship and adopters would inherit GAIA's governance. Using
      # `.*` as the pattern means any line (including the empty file
      # `LICENSE`) triggers a leak; file presence is the signal.
      - id: governance-files
        description: "Maintainer governance files present at staging root"
        pattern: ".*"
        scope:
          - "CHANGELOG.md"
          - "CODE_OF_CONDUCT.md"
          - "CONTRIBUTING.md"
          - "LICENSE"
          - "README.md"
          - "SUPPORTERS.md"

      # ---- Wikilinks resolving to release-excluded slugs ----
      # Marker-strip catches blocks the maintainer wraps with
      # gaia:maintainer-only markers. This check defends the case where
      # the maintainer forgets to wrap a wikilink whose target is
      # release-excluded; the link survives the strip but resolves to
      # nothing on the adopter side.
      #
      # `derive: excluded-slugs` builds the excluded-slug set at scan time
      # from `.gaia/release-exclude`, resolved against the source repo (that
      # file excludes itself, so it never reaches the staging tree the other
      # checks scan). Every `.md` exclude contributes its slug; every
      # bare-directory exclude (wiki/entities, wiki/meta) contributes the
      # directory slug plus the slug of each page beneath it, so entity pages
      # and the dated audit artifacts under wiki/meta/ (consolidate-report-*,
      # lint-report-*, staleness-audit-*) are covered without enumeration.
      # Matching is case-insensitive and alias/anchor-aware. A newly excluded
      # page is caught with no edit here; the set cannot drift from the
      # manifest.
      - id: wikilink-to-excluded
        description: "Wikilinks pointing at release-excluded wiki slugs"
        derive: excluded-slugs
        scope:
          - "wiki/**/*.md"
        path-allowlist:
          - "wiki/hot.md"
          - "wiki/log.md"

      # ---- Bare-prose Title-Case mentions of release-excluded wiki titles ----
      # The wikilink-to-excluded check above only catches a `[[wikilink]]`
      # whose target is release-excluded. It misses a bare Title-Case mention
      # of an excluded page's title in ordinary prose, a dangling pointer to a
      # page the adopter's clone never received.
      #
      # `derive: excluded-titles` builds the excluded-title set at scan time
      # from `.gaia/release-exclude`, resolved against the source repo (that
      # file excludes itself, so it never reaches the staging tree the other
      # checks scan). Every `.md` exclude contributes its case-preserved
      # basename; every bare-directory exclude (wiki/entities, wiki/meta)
      # contributes the case-preserved basename of every page beneath it, not
      # the directory basename itself (a lowercase common word that would
      # cry wolf on ordinary prose). A newly excluded page is caught with no
      # edit here; the set cannot drift from the exclude list.
      #
      # `title-opt-out` subtracts titles that read as ordinary prose and would
      # otherwise cry wolf on nearly every shipped page:
      - id: excluded-titles
        description: "Bare-prose Title-Case mentions of release-excluded wiki page titles"
        derive: excluded-titles
        scope:
          - "wiki/**/*.md"
        path-allowlist:
          - "wiki/hot.md"
          - "wiki/log.md"
        title-opt-out:
          - "GAIA" # the project's own name; a generic word on nearly every shipped page.
          - "dashboard" # a common noun; the wiki/meta/dashboard.md title is not a followable pointer in prose.
          - "Steven Sacks" # the maintainer's name appears as attribution, not as a page reference.
          - "Release Workflow" # a generic multi-word title; bare-prose form reads as ordinary text, and its [[wikilink]] and path forms stay covered by the sibling checks.

      # ---- Workflow paths-filter denylist syntax ----
      # `paths-ignore:` and inverted `!pattern` entries fail quiet: a new
      # top-level path added to the repo silently passes the filter and
      # the workflow runs (or skips) when it shouldn't. Allowlists fail
      # loud (skip when expected to run) and are the only safe shape.
      # The three alternations catch the three physical layouts of a
      # denylist entry: a `paths-ignore:` key, a block-list inverted item
      # (`- "!*.md"`), and an inverted entry smuggled into an inline flow
      # array (`paths: ["src/**", "!*.md"]`). The inline alternation is
      # quote-anchored (`[...'"!`) so a stray `[!` in a run-step string
      # does not false-positive.
      # Prior occurrences: chromatic.yml + tests.yml denylists missed
      # `.gaia/`, `.specify/`, `studio/` (a8a4b75, c6eeecc).
      - id: workflow-denylist
        description: "Workflow paths-ignore or inverted !pattern entries: denylists fail quiet"
        pattern: "^\\s*paths-ignore\\s*:|^\\s*-\\s*['\"]?!|\\[[^\\]]*['\"]!"
        scope:
          - ".github/workflows/**"

      # ---- Runtime-optional dependency references ----
      # Hook scripts that reference .gaia/ config files guarded by `[ -f ]`
      # are runtime-optional; adopters without the file get a graceful no-op.
      # The runtime-deps checker cannot infer conditionality from shell guard
      # syntax and flags these as missing dependencies.
      - id: runtime-deps
        description: "Runtime-optional .gaia/ config references guarded by shell [ -f ] checks"
        pattern: "\\.gaia/automation\\.json"
        scope:
          - ".claude/hooks/**"
        line-allowlist:
          # In .claude/hooks/lib/gaia-ci-defer.sh: a variable assignment guarded
          # by `[ -f "$config_path" ] || return 0`, so adopters without
          # .gaia/automation.json get a graceful no-op.
          - "local config_path=.*\\.gaia/automation\\.json"
          # In .claude/hooks/lib/gaia-ci-defer.sh: shell comment lines documenting
          # the .gaia/automation.json config file in prose, not runtime refs.
          - "#.*\\.gaia/automation\\.json"
